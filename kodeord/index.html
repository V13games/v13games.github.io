<style>
  /* Critical styles: everything needed to play and look right even if the Tailwind CDN fails. */
  :root {
    --bg: #0d1120; --bg-glow: #1b2547; --panel: #161c30; --panel-2: #1f2740; --line: #333d60;
    --text: #eef1fa; --muted: #9ea8c3; --accent: #8c9bff;
    --correct: #1f9e6e; --correct-ink: #ffffff;
    --present: #e3ae32; --present-ink: #231802;
    --absent: #2a3148; --absent-ink: #b4bcd2;
    --key: #38436a; --key-ink: #f2f4fc;
    --flip-ms: 480ms;
    --font: "SF Pro Rounded", ui-rounded, "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root.contrast {
    --correct: #f4772e; --correct-ink: #1c0a00;
    --present: #57b4f5; --present-ink: #04192b;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 70% at 50% -10%, var(--bg-glow) 0%, var(--bg) 62%) var(--bg) no-repeat;
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-size: 1.1em; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Page frame */
  .app {
    height: 100vh; height: 100dvh;
    max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  .topbar, .modebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  .topbar { height: 48px; padding: 0 2px; }
  .modebar { height: 38px; padding: 0 2px; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand-mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 2px; flex: none; }
  .brand-mark i { display: block; height: 9px; border-radius: 2.5px; background: var(--absent-ink); }
  .brand-mark i:nth-child(1) { background: var(--correct); }
  .brand-mark i:nth-child(4) { background: var(--present); }
  @media (max-width: 430px) { .brand-mark { display: none; } }
  .controls { display: flex; align-items: center; gap: 4px; }

  /* Controls */
  .seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .seg-btn {
    appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit;
    font-size: 13px; font-weight: 700; min-height: 30px; padding: 0 10px; border-radius: 8px; cursor: pointer;
    touch-action: manipulation;
  }
  .seg-btn[aria-pressed="true"] { background: var(--accent); color: #0b1020; }
  .icon-btn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; border: 0; border-radius: 10px; background: transparent;
    color: var(--text); cursor: pointer; touch-action: manipulation;
  }
  .icon-btn svg { width: 21px; height: 21px; display: block; }
  .icon-btn[aria-pressed="true"] { background: var(--panel-2); color: var(--correct); }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit;
    font-size: 13px; font-weight: 700; min-height: 32px; padding: 0 12px; border-radius: 9px; cursor: pointer;
    touch-action: manipulation;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #0b1020; }
  .btn-link { min-height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; }
  .status { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 28px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Board */
  .board-wrap { flex: 1 1 auto; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
  .board {
    --gap: 6px;
    --tile: min(calc((100cqw - 4 * var(--gap)) / 5), calc((100cqh - 5 * var(--gap)) / 6), 68px);
    display: grid; grid-template-rows: repeat(6, var(--tile)); gap: var(--gap);
  }
  .row { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: var(--gap); }
  .tile {
    display: flex; align-items: center; justify-content: center;
    width: var(--tile); height: var(--tile); border-radius: 22%;
    font-size: calc(var(--tile) * .52); font-weight: 800; line-height: 1;
    background: rgba(255, 255, 255, .03);
    border: 2px solid var(--panel-2);
    color: var(--text); user-select: none; -webkit-user-select: none;
  }
  .tile[data-state="tbd"] { border-color: var(--muted); background: var(--panel); }
  .tile[data-state="correct"] { background: var(--correct); border-color: var(--correct); color: var(--correct-ink); }
  .tile[data-state="present"] { background: var(--present); border-color: var(--present); color: var(--present-ink); }
  .tile[data-state="absent"]  { background: var(--absent);  border-color: var(--absent);  color: var(--absent-ink); }

  /* Keyboard */
  .keyboard { flex: none; display: flex; flex-direction: column; gap: 5px; margin-top: 6px; user-select: none; -webkit-user-select: none; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    appearance: none; flex: 1 1 0; min-width: 0; height: clamp(42px, 7.6vh, 58px); padding: 0; border: 0; border-radius: 9px;
    background: var(--key); color: var(--key-ink); font: inherit; font-size: clamp(14px, 4.4vw, 18px); font-weight: 700;
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .key-wide { flex: 1.65 1 0; font-size: 12px; letter-spacing: .02em; }
  .key svg { width: 22px; height: 22px; }
  .key-gap { flex: .5 1 0; }
  .key[data-state="correct"] { background: var(--correct); color: var(--correct-ink); }
  .key[data-state="present"] { background: var(--present); color: var(--present-ink); }
  .key[data-state="absent"]  { background: #1a2034; color: #76809c; }
  @media (hover: hover) {
    .key:hover, .btn:hover, .icon-btn:hover { filter: brightness(1.14); }
    .icon-btn:hover { background: var(--panel-2); }
  }

  /* Toast */
  .toasts { position: fixed; z-index: 60; top: 96px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
  .toast { background: var(--text); color: #0d1120; padding: 9px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); text-align: center; animation: toast-in .16s ease-out both; }

  /* Modal */
  .overlay { position: fixed; z-index: 50; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 9, 18, .72); }
  .dialog {
    position: relative; width: 100%; max-width: 420px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; color: var(--text);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5); animation: dialog-in .18s ease-out both;
  }
  .dialog:focus { outline: none; }
  .dialog-close { position: absolute; top: 10px; right: 10px; }
  .ex-row { display: flex; gap: 4px; margin: 14px 0 6px; --tile: 34px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat-grid > div > span { display: block; }
  .dist-row { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 6px; }
  .dist-track { display: block; }
  .dist-bar {
    display: flex; align-items: center; justify-content: flex-end; min-width: 26px; height: 22px; padding: 0 7px;
    border-radius: 0 4px 4px 0; background: var(--key); color: var(--key-ink); font-size: 12px;
  }
  .dist-row[data-current="true"] .dist-bar { background: var(--correct); color: var(--correct-ink); }
  .result-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .result-box strong { display: block; }

  /* Animations */
  @keyframes pop { 0% { transform: scale(.88); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-34%); } 65% { transform: translateY(6%); } 82% { transform: translateY(-9%); } }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .tile.pop { animation: pop 110ms ease-out; }
  .tile.flip { animation: flip var(--flip-ms) ease-in-out both; }
  .tile.hop { animation: hop 620ms ease-in-out both; }
  .row.shake { animation: shake 460ms ease-in-out; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Short screens: drop the status line; on landscape phones put board and keyboard side by side. */
  @media (max-height: 560px) { .status { height: 22px; } .topbar { height: 42px; } .modebar { height: 34px; } }
  @media (max-height: 480px) and (min-width: 560px) {
    .app { max-width: 860px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto minmax(0, 1fr); column-gap: 14px; }
    .topbar { grid-column: 1 / 3; }
    .modebar { grid-column: 2; grid-row: 2; }
    .status { grid-column: 2; grid-row: 3; align-self: start; }
    .board-wrap { grid-column: 1; grid-row: 2 / 4; }
    .keyboard { grid-column: 2; grid-row: 3; align-self: end; margin: 0; }
    .key { height: 40px; }
    .key:not(.key-wide) { font-size: 14px; }
    .toasts { top: 8px; }
  }
</style>

/** Two passes: greens first, then yellows only while unused copies of the letter remain. */
function scoreGuess(guess, answer) {
  const result = new Array(WORD_LENGTH).fill('absent');
  const unused = {};
  for (let i = 0; i < WORD_LENGTH; i++) {
    if (guess[i] === answer[i]) result[i] = 'correct';
    else unused[answer[i]] = (unused[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < WORD_LENGTH; i++) {
    if (result[i] === 'correct') continue;
    if (unused[guess[i]] > 0) {
      result[i] = 'present';
      unused[guess[i]]--;
    }
  }
  return result;
}

const STATE_RANK = { absent: 1, present: 2, correct: 3 };

/** Best state per letter across guesses; a key can only ever move up. */
function keyStates(guesses, answer) {
  const best = {};
  for (const guess of guesses) {
    const states = scoreGuess(guess, answer);
    for (let i = 0; i < WORD_LENGTH; i++) {
      const prev = best[guess[i]];
      if (!prev || STATE_RANK[states[i]] > STATE_RANK[prev]) best[guess[i]] = states[i];
    }
  }
  return best;
}

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayKey() { return dateKey(new Date()); }

/** Calendar days as integers. Going through UTC keeps this immune to DST. */
function dayIndex(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / 86400000);
}
function dayNumber(key) { return dayIndex(key) - dayIndex(EPOCH); }

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let z = a;
    z = Math.imul(z ^ (z >>> 15), z | 1);
    z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}

function seededShuffle(list, seed) {
  const out = list.slice();
  const random = mulberry32(seed);
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

const DAILY_ORDER = {};
function dailyOrder(lang) {
  if (!DAILY_ORDER[lang]) DAILY_ORDER[lang] = seededShuffle(ANSWERS[lang], SHUFFLE_SEED[lang]);
  return DAILY_ORDER[lang];
}

function dailyAnswer(lang, key) {
  const order = dailyOrder(lang);
  const n = order.length;
  return order[((dayNumber(key) % n) + n) % n];
}

/** A random answer that differs from the current practice word and from today's daily word. */
function pickPractice(lang, current) {
  const daily = dailyAnswer(lang, todayKey());
  const list = ANSWERS[lang];
  let word;
  do {
    word = list[Math.floor(Math.random() * list.length)];
  } while (word === current || word === daily);
  return word;
}

/** Updates a stats object for one finished daily game. Each date counts once. */
function recordDailyResult(stats, date, won, guessCount) {
  if (stats.lastPlayedDate === date) return stats;
  stats.played++;
  stats.lastPlayedDate = date;
  if (won) {
    stats.wins++;
    stats.dist[guessCount - 1]++;
    const continues = stats.lastWinDate && dayIndex(date) - dayIndex(stats.lastWinDate) === 1;
    stats.streak = continues ? stats.streak + 1 : 1;
    stats.lastWinDate = date;
    stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  } else {
    stats.streak = 0;
  }
  return stats;
}

/** A streak dies as soon as a day has passed without a win. */
function expireStreak(stats, today) {
  if (stats.streak > 0 && (!stats.lastWinDate || dayIndex(today) - dayIndex(stats.lastWinDate) > 1)) stats.streak = 0;
  return stats;
}

function shareText(lang, mode, date, guesses, answer, won) {
  const s = STRINGS[lang];
  const tag = mode === 'daily' ? '#' + (dayNumber(date) + 1) : s.practiceShare;
  const score = won ? guesses.length : 'X';
  const emoji = { correct: '🟩', present: '🟨', absent: '⬛' };
  const grid = guesses.map((g) => scoreGuess(g, answer).map((st) => emoji[st]).join('')).join('\n');
  return s.brand + ' ' + lang.toUpperCase() + ' ' + tag + ' ' + score + '/' + MAX_GUESSES + '\n\n' + grid;
}

/** Normalizes event.key to an uppercase letter of the language, or null. */
function normalizeLetter(key, lang) {
  if (typeof key !== 'string') return null;
  const composed = key.normalize('NFC');
  if (composed.length !== 1) return null;
  const upper = composed.toUpperCase();
  return ALPHABET[lang].has(upper) ? upper : null;
}

function currentGame() { return store.games[store.lang][store.mode]; }
function currentAnswer() {
  const game = currentGame();
  return store.mode === 'daily' ? dailyAnswer(store.lang, game.date) : game.answer;
}
function inputLocked() { return !!ui.reveal || !!ui.modal || currentGame().finished; }

function typeLetter(letter) {
  const game = currentGame();
  if (inputLocked() || game.draft.length >= WORD_LENGTH) return;
  game.draft += letter;
  const col = game.draft.length - 1;
  renderBoard();
  const tile = ui.tiles[game.guesses.length][col];
  tile.classList.remove('pop');
  void tile.offsetWidth;
  tile.classList.add('pop');
  saveStore();
}

function deleteLetter() {
  const game = currentGame();
  if (inputLocked() || !game.draft) return;
  game.draft = game.draft.slice(0, -1);
  renderBoard();
  saveStore();
}

function submitGuess() {
  const game = currentGame();
  if (inputLocked()) return;
  const guess = game.draft;
  if (guess.length < WORD_LENGTH) return rejectGuess('notEnough');
  if (!ALLOWED[store.lang].has(guess)) return rejectGuess('notInList');

  const answer = currentAnswer();
  game.guesses.push(guess);
  game.draft = '';
  game.won = guess === answer;
  game.finished = game.won || game.guesses.length >= MAX_GUESSES;
  if (game.finished && store.mode === 'daily') {
    recordDailyResult(store.stats[store.lang], game.date, game.won, game.guesses.length);
  }
  saveStore();
  startReveal(game.guesses.length - 1);
}

function rejectGuess(key) {
  showToast(t(key));
  const row = ui.rows[currentGame().guesses.length];
  row.classList.remove('shake');
  void row.offsetWidth;
  row.classList.add('shake');
  later(500, () => row.classList.remove('shake'));
}

function setLang(lang) {
  if (lang === store.lang) return;
  cancelEffects();
  store.lang = lang;
  saveStore();
  buildKeyboard();
  renderAll();
}

function setMode(mode) {
  if (mode === store.mode) return;
  cancelEffects();
  store.mode = mode;
  saveStore();
  renderAll();
}

function newPracticeWord() {
  cancelEffects();
  const lang = store.lang;
  const previous = store.games[lang].practice.answer;
  store.games[lang].practice = freshPractice(pickPractice(lang, previous));
  saveStore();
  renderAll();
}

/** Moves every language to today's game when the local date changes. */
function rolloverIfNeeded() {
  if (ui.reveal) return;
  const today = todayKey();
  let changed = false;
  for (const lang of LANGS) {
    expireStreak(store.stats[lang], today);
    if (store.games[lang].daily.date !== today) {
      store.games[lang].daily = freshDaily(today);
      changed = true;
    }
  }
  if (!changed) return;
  saveStore();
  renderAll();
  if (store.mode === 'daily') showToast(t('newDay'));
}

function prefersReducedMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function later(ms, fn) {
  const id = setTimeout(() => {
    ui.timers = ui.timers.filter((x) => x !== id);

  }, ms);
  ui.timers.push(id);
}

/** Stops all running effects. The stored state is already final, so nothing is lost. */
function cancelEffects() {
  ui.timers.forEach(clearTimeout);

function buildBoard() {
  el.board.textContent = '';

      tile.setAttribute('role', 'img');

      row.appendChild(tile);
      tiles.push(tile);

    ui.rows.push(row);

}

const BACKSPACE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';

function makeKey(id, wide) {
  const key = document.createElement('button');
  key.type = 'button';
  key.className = wide ? 'key key-wide' : 'key';
  key.dataset.key = id;
  if (id === 'BACK') key.innerHTML = BACKSPACE_ICON;
  else key.textContent = id;
  ui.keys.set(id, key);
  return key;
}

function buildKeyboard() {
  el.keyboard.textContent = '';
  ui.keys.clear();
  KEY_ROWS[store.lang].forEach((letters, index) => {
    const row = document.createElement('div');
    row.className = 'kb-row';
    const spaced = letters.length === 9;
    const gap = () => { const g = document.createElement('span'); g.className = 'key-gap'; return g; };
    if (spaced) row.appendChild(gap());
    if (index === 2) row.appendChild(makeKey('ENTER', true));
    for (const letter of letters) row.appendChild(makeKey(letter, false));
    if (index === 2) row.appendChild(makeKey('BACK', true));
    if (spaced) row.appendChild(gap());
    el.keyboard.appendChild(row);
  });
}

function setTile(tile, letter, state, row, col) {
  if (tile.textContent !== letter) tile.textContent = letter;
  tile.dataset.state = state;
  const place = t('row', { n: row + 1 }) + ', ' + (col + 1);
  let label = t('tileEmpty');
  if (letter) label = STATE_RANK[state] ? letter + ', ' + t(state) : letter;
  tile.setAttribute('aria-label', place + ': ' + label);
}

function renderBoard() {
  const game = currentGame();
  const answer = currentAnswer();
  for (let r = 0; r < MAX_GUESSES; r++) {
    ui.rows[r].setAttribute('aria-label', t('row', { n: r + 1 }));
    const guess = game.guesses[r];
    const hidden = ui.reveal && ui.reveal.row === r;
    const states = guess && !hidden ? scoreGuess(guess, answer) : null;
    const isDraftRow = r === game.guesses.length && !game.finished;
    for (let c = 0; c < WORD_LENGTH; c++) {
      if (guess) setTile(ui.tiles[r][c], guess[c], hidden ? 'tbd' : states[c], r, c);
      else if (isDraftRow && game.draft[c]) setTile(ui.tiles[r][c], game.draft[c], 'tbd', r, c);
      else setTile(ui.tiles[r][c], '', 'empty', r, c);
    }
  }
}

function renderKeyboard() {
  const game = currentGame();
  const settled = ui.reveal ? game.guesses.slice(0, ui.reveal.row) : game.guesses;
  const best = keyStates(settled, currentAnswer());
  for (const [id, key] of ui.keys) {
    if (id === 'ENTER') {
      key.setAttribute('aria-label', t('enter'));
    } else if (id === 'BACK') {
      key.setAttribute('aria-label', t('backspace'));
    } else {
      const state = best[id];
      if (state) key.dataset.state = state; else delete key.dataset.state;
      key.setAttribute('aria-label', state ? id + ', ' + t(state) : id);
    }
  }
}

function timeToNextWord() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const total = Math.max(0, Math.floor((next - now) / 1000));
  const pad = (n) => String(n).padStart(2, '0');
  return pad(Math.floor(total / 3600)) + ':' + pad(Math.floor(total / 60) % 60) + ':' + pad(total % 60);
}

function renderStatus() {

/* Reveal and end-of-game effects ------------------------------------------ */

function startReveal(row) {
  const game = currentGame();
  const word = game.guesses[row];
  const states = scoreGuess(word, currentAnswer());

  if (prefersReducedMotion()) {
    renderBoard();
    renderKeyboard();
    afterReveal(row, states);
    return;
  }

  ui.reveal = { row };
  renderBoard();
  ui.tiles[row].forEach((tile, col) => {
    const delay = col * STAGGER_MS;
    tile.classList.remove('pop');
    tile.style.animationDelay = delay + 'ms';
    tile.classList.add('flip');
    later(delay + FLIP_MS / 2, () => setTile(tile, word[col], states[col], row, col));
  });
  later((WORD_LENGTH - 1) * STAGGER_MS + FLIP_MS, () => {
    for (const tile of ui.tiles[row]) {
      tile.classList.remove('flip');
      tile.style.animationDelay = '';
    }
    ui.reveal = null;
    renderKeyboard();
    afterReveal(row, states);
  });
}

function afterReveal(row, states) {
  const game = currentGame();
  const summary = game.guesses[row].split('').map((letter, i) => letter + ' ' + t(states[i])).join(', ');
  announce(t('guessSummary', { n: row + 1, tiles: summary }));
  renderStatus();
  if (!game.finished) return;

  const motion = !prefersReducedMotion();
  if (game.won) {
    showToast(STRINGS[store.lang].wins[row], 2000);
    if (motion) {
      ui.tiles[row].forEach((tile, col) => {
        tile.style.animationDelay = col * 90 + 'ms';
        tile.classList.add('hop');
      });
    }
  } else {
    showToast(t('lost', { word: currentAnswer() }), 3200);
  }
  if (store.mode === 'daily') later(motion ? 1500 : 400, () => openStats());
}

function trapFocus(event) {
  const items = [...el.dialog.querySelectorAll('button:not([disabled])')].filter((b) => b.offsetParent !== null);
  if (!items.length) { event.preventDefault(); return; }
  const first = items[0];
  const last = items[items.length - 1];
  const active = document.activeElement;
  if (event.shiftKey && (active === first || active === el.dialog)) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  } else if (!el.dialog.contains(active)) {
    event.preventDefault();
    first.focus();
  }
}

/* Share ------------------------------------------------------------------- */

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) { /* fall through to the legacy path */ }
  try {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    (ui.modal ? el.dialog : document.body).appendChild(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    return ok;
  } catch (err) {
    return false;
  }
}

async function shareResult(mode) {
  const lang = store.lang;
  const game = store.games[lang][mode];
  const answer = mode === 'daily' ? dailyAnswer(lang, game.date) : game.answer;
  const ok = await copyText(shareText(lang, mode, game.date, game.guesses, answer, game.won));
  showToast(t(ok ? 'copied' : 'copyFailed'));
}

/* ==========================================================================
   INPUT
   ========================================================================== */

function handleKeydown(event) {
  if (ui.modal) {
    if (event.key === 'Escape') { event.preventDefault(); closeModal(); }
    else if (event.key === 'Tab') trapFocus(event);
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;

  // A keyboard user activating a focused control must not also submit a guess.
  const onControl = event.target && event.target.closest && event.target.closest('button');
  if (onControl && (event.key === 'Enter' || event.key === ' ')) return;

  if (event.key === 'Enter') {
    event.preventDefault();
    if (!event.repeat) submitGuess();
  } else if (event.key === 'Backspace') {
    event.preventDefault();
    deleteLetter();
  } else {
    const letter = normalizeLetter(event.key, store.lang);
    if (letter) {
      event.preventDefault();
      typeLetter(letter);
    }
  }
}

function bindEvents() {
  // Pointer clicks must not leave focus on a button, or physical Enter would press it again.
  document.addEventListener('click', (event) => {
    const button = event.target.closest && event.target.closest('button');
    if (button && event.detail > 0) button.blur();
  }, true);

  document.addEventListener('keydown', handleKeydown);

  el.keyboard.addEventListener('click', (event) => {
    const key = event.target.closest('.key');
    if (!key) return;
    const id = key.dataset.key;
    if (id === 'ENTER') submitGuess();
    else if (id === 'BACK') deleteLetter();
    else typeLetter(id);
  });

  el.langSwitch.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (button) setLang(button.dataset.lang);
  });
  el.modeSwitch.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (button) setMode(button.dataset.mode);
  });

  el.btnNew.addEventListener('click', newPracticeWord);
  el.btnHelp.addEventListener('click', openHelp);
  el.btnStats.addEventListener('click', openStats);
  el.btnShareInline.addEventListener('click', () => shareResult(store.mode));
  el.btnContrast.addEventListener('click', () => {
    store.contrast = !store.contrast;
    saveStore();
    renderContrast();
    renderText();
  });

  el.dialogClose.addEventListener('click', closeModal);
  el.overlay.addEventListener('mousedown', (event) => {
    if (event.target === el.overlay) closeModal();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) rolloverIfNeeded();
  });
  window.addEventListener('focus', rolloverIfNeeded);

  // Another tab finished or changed a game: adopt its state instead of overwriting it later.
  window.addEventListener('storage', (event) => {
    if (event.key !== STORAGE_KEY || ui.modal) return;
    cancelEffects();
    store = loadStore();
    buildKeyboard();
    renderAll();
  });
}

/* ==========================================================================
   STORAGE
   ========================================================================== */

function storageRead() {
  try { return window.localStorage.getItem(STORAGE_KEY); } catch (err) { return null; }
}

function saveStore() {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (err) { /* in-memory only */ }
}

function detectLang() {
  let language = '';
  try { language = (navigator.language || '').toLowerCase(); } catch (err) { /* keep default */ }
  return language.startsWith('da') ? 'da' : 'en';
}

function cleanWord(value, lang) {
  return typeof value === 'string' && value.length === WORD_LENGTH && [...value].every((c) => ALPHABET[lang].has(c));
}

function cleanDraft(value, lang) {
  return typeof value === 'string' && value.length < WORD_LENGTH + 1 && [...value].every((c) => ALPHABET[lang].has(c)) ? value : '';
}

/** Restores a saved game. "finished" and "won" are recomputed so bad data cannot wedge a game. */
function restoreGame(saved, fresh, answer, lang) {
  if (!saved || typeof saved !== 'object' || !Array.isArray(saved.guesses)) return fresh;
  let guesses = saved.guesses.filter((g) => cleanWord(g, lang)).slice(0, MAX_GUESSES);
  const hit = guesses.indexOf(answer);
  if (hit >= 0) guesses = guesses.slice(0, hit + 1);
  fresh.guesses = guesses;
  fresh.won = hit >= 0;
  fresh.finished = fresh.won || guesses.length >= MAX_GUESSES;
  fresh.draft = fresh.finished ? '' : cleanDraft(saved.draft, lang);
  return fresh;
}

const count = (value) => (Number.isFinite(value) && value > 0 ? Math.floor(value) : 0);
const dateOrNull = (value) => (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : null);

function restoreStats(saved) {
  const stats = freshStats();
  if (!saved || typeof saved !== 'object') return stats;
  stats.played = count(saved.played);
  stats.wins = count(saved.wins);
  stats.streak = count(saved.streak);
  stats.maxStreak = count(saved.maxStreak);
  if (Array.isArray(saved.dist)) stats.dist = stats.dist.map((_, i) => count(saved.dist[i]));
  stats.lastPlayedDate = dateOrNull(saved.lastPlayedDate);
  stats.lastWinDate = dateOrNull(saved.lastWinDate);
  return stats;
}

function loadStore() {
  const base = defaultStore();
  const raw = storageRead();
  if (!raw) return base;
  let saved;
  try { saved = JSON.parse(raw); } catch (err) { return base; }
  if (!saved || typeof saved !== 'object' || saved.v !== 1) return base;

  if (LANGS.includes(saved.lang)) base.lang = saved.lang;
  if (saved.mode === 'daily' || saved.mode === 'practice') base.mode = saved.mode;
  base.contrast = saved.contrast === true;
  base.seenHelp = saved.seenHelp === true;

  const today = todayKey();
  for (const lang of LANGS) {
    const games = saved.games && saved.games[lang];
    if (games && games.daily && games.daily.date === today) {
      base.games[lang].daily = restoreGame(games.daily, freshDaily(today), dailyAnswer(lang, today), lang);
    }
    if (games && games.practice && ANSWERS[lang].includes(games.practice.answer)) {
      const answer = games.practice.answer;
      base.games[lang].practice = restoreGame(games.practice, freshPractice(answer), answer, lang);
    }
    base.stats[lang] = expireStreak(restoreStats(saved.stats && saved.stats[lang]), today);
  }
  return base;
}

/* ==========================================================================
   INIT
   ========================================================================== */

function init() {
  for (const id of ['app', 'board', 'keyboard', 'brandName', 'langSwitch', 'modeSwitch', 'btnHelp', 'btnStats', 'btnContrast',
    'btnNew', 'btnShareInline', 'dayNo', 'statusText', 'toasts', 'srLive', 'overlay', 'dialog', 'dialogTitle', 'dialogBody', 'dialogClose']) {
    el[id] = document.getElementById(id);
  }
  const compileHint = node('div', Object.values(TW).join(' '));
  compileHint.hidden = true;
  document.body.appendChild(compileHint);

  store = loadStore();
  buildBoard();
  buildKeyboard();
  bindEvents();
  renderAll();
  saveStore();
  setInterval(() => {
    rolloverIfNeeded();
    if (!ui.reveal) renderStatus();
  }, 1000);
  if (!store.seenHelp) {
    store.seenHelp = true;
    saveStore();
    openHelp();
  }
}

if (typeof document !== 'undefined') init();
</script>
</body>

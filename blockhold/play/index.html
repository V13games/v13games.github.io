<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="description" content="Blockhold: a walk-around tower defense game. Shoot, collect coins, build and reload towers, and hold the citadel for 20 waves.">
<title>Blockhold</title>
<style>
:root {
  --ui: 1;
  --panel: rgba(30, 42, 58, 0.88);
  --stroke: #1B1B2F;
  --accent: #FFC93C;
  --good: #5CFF8A;
  --bad: #FF4D5E;
  --cyan: #3EE0FF;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --pad: calc(12px * var(--ui));
}
* { box-sizing: border-box; }
html, body {
  position: fixed; inset: 0; margin: 0; width: 100%; height: 100dvh; overflow: hidden;
  overscroll-behavior: none; background: #DFF3FF; font-family: var(--font); color: #fff;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; touch-action: none; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; font-size: calc(16px * var(--ui)); }
#ui * { touch-action: none; }
#ui button, #ui a, #ui input, #ui label, .panel, .screen, .tray, .towerpanel { pointer-events: auto; }
#fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; background: #1E2A3A; color: #fff; font: 600 18px system-ui, sans-serif; z-index: 99; }

/* Panels and buttons: chunky, dark stroke, hard drop shadow. */
.panel { background: var(--panel); border: 3px solid var(--stroke); border-radius: calc(14px * var(--ui)); box-shadow: 0 4px 0 var(--stroke); }
.btn {
  font: 800 calc(16px * var(--ui)) var(--font); color: #fff; letter-spacing: 0.01em;
  background: #34495E; border: 3px solid var(--stroke); border-radius: calc(14px * var(--ui));
  box-shadow: 0 4px 0 var(--stroke); min-height: calc(44px * var(--ui)); padding: 0 calc(14px * var(--ui));
  display: inline-flex; align-items: center; justify-content: center; gap: calc(6px * var(--ui));
  cursor: pointer; transition: transform 80ms, filter 80ms; text-decoration: none;
}
.btn svg { width: calc(24px * var(--ui)); height: calc(24px * var(--ui)); fill: currentColor; flex: none; }
.btn.down, .btn:active { transform: translateY(2px) scale(0.92); filter: brightness(0.82); box-shadow: 0 2px 0 var(--stroke); }
.btn.accent { background: var(--accent); color: #1B1B2F; }
.btn.danger { background: #C8414F; }
.btn.small { min-height: calc(38px * var(--ui)); padding: 0 calc(10px * var(--ui)); font-size: calc(14px * var(--ui)); }
.btn.icon { width: calc(48px * var(--ui)); padding: 0; }
.btn.icon.small { width: calc(40px * var(--ui)); }
.btn.wide { width: 100%; }
.btn.huge { min-height: calc(70px * var(--ui)); font-size: calc(28px * var(--ui)); padding: 0 calc(36px * var(--ui)); border-radius: calc(20px * var(--ui)); }
.btn.huge svg { width: calc(30px * var(--ui)); height: calc(30px * var(--ui)); }
.btn.off, .btn:disabled { filter: grayscale(0.7) brightness(0.75); }
.btn.on { background: var(--cyan); color: #1B1B2F; }

/* HUD corners (inset by the safe areas). */
.hud > div { position: absolute; }
.tl { left: calc(var(--sa-l) + var(--pad)); top: calc(var(--sa-t) + var(--pad)); display: flex; gap: calc(8px * var(--ui)); align-items: flex-start; }
.stats { display: flex; gap: calc(14px * var(--ui)); align-items: center; padding: calc(5px * var(--ui)) calc(12px * var(--ui)); min-height: calc(48px * var(--ui)); }
.stat { display: flex; align-items: center; gap: calc(6px * var(--ui)); font-weight: 900; font-size: calc(19px * var(--ui)); }
.stat svg, .ico svg { width: calc(26px * var(--ui)); height: calc(26px * var(--ui)); display: block; }
.stat.money span { color: var(--accent); min-width: calc(60px * var(--ui)); }
.stat.money.bump { animation: bump 260ms ease-out; }
@keyframes bump { 40% { transform: scale(1.22); } }
.tc { left: 50%; top: calc(var(--sa-t) + var(--pad)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(8px * var(--ui)); }
.basebar { display: flex; align-items: center; gap: calc(8px * var(--ui)); padding: calc(5px * var(--ui)) calc(12px * var(--ui)); }
.track { position: relative; height: calc(16px * var(--ui)); width: calc(220px * var(--ui)); background: #11182A; border: 2px solid var(--stroke); border-radius: 99px; overflow: hidden; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); border-radius: 99px; transition: width 150ms; }
.track.hit { animation: shake 300ms; }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.val { font-weight: 900; min-width: calc(32px * var(--ui)); text-align: right; }
.val.big { font-size: calc(20px * var(--ui)); min-width: calc(54px * var(--ui)); text-align: left; }
.buildbox { display: flex; align-items: center; gap: calc(10px * var(--ui)); padding: calc(6px * var(--ui)) calc(8px * var(--ui)) calc(6px * var(--ui)) calc(14px * var(--ui)); }
.buildbox .count { font-weight: 900; font-size: calc(17px * var(--ui)); white-space: nowrap; }
.preview { display: flex; gap: calc(5px * var(--ui)); flex-wrap: wrap; max-width: calc(330px * var(--ui)); }
.chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.3); border-radius: 99px; padding: 2px 8px 2px 4px; font-size: calc(12px * var(--ui)); font-weight: 800; white-space: nowrap; }
.chip i { width: calc(12px * var(--ui)); height: calc(12px * var(--ui)); border-radius: 50%; border: 2px solid var(--stroke); display: inline-block; }
.chip i.boss { width: calc(16px * var(--ui)); height: calc(16px * var(--ui)); box-shadow: 0 0 6px #B5179E; }
.tr { right: calc(var(--sa-r) + var(--pad)); top: calc(var(--sa-t) + var(--pad)); display: flex; flex-direction: column; align-items: flex-end; gap: calc(8px * var(--ui)); }
.minimap canvas { width: calc(150px * var(--ui)); height: calc(150px * var(--ui)); display: block; border-radius: 50%; box-shadow: 0 4px 0 var(--stroke); }
.trbtns { display: flex; gap: calc(6px * var(--ui)); }
.bl { left: calc(var(--sa-l) + var(--pad)); bottom: calc(var(--sa-b) + var(--pad)); }
.pbox { padding: calc(8px * var(--ui)) calc(12px * var(--ui)); display: flex; flex-direction: column; gap: calc(6px * var(--ui)); }
.pbox .row { display: flex; align-items: center; gap: calc(8px * var(--ui)); }
.pbox .track { width: calc(150px * var(--ui)); height: calc(14px * var(--ui)); }
.fill.hp { background: #FF6B7A !important; }
.fill.dash { background: var(--cyan) !important; transition: none; }
.dashico { color: var(--cyan); }
.ring { width: calc(22px * var(--ui)); height: calc(22px * var(--ui)); border-radius: 50%; background: conic-gradient(var(--accent) var(--p, 0deg), rgba(255,255,255,0.15) 0); opacity: 0; border: 2px solid var(--stroke); }
.br { right: calc(var(--sa-r) + var(--pad)); bottom: calc(var(--sa-b) + var(--pad)); width: calc(250px * var(--ui)); height: calc(250px * var(--ui)); }
.br .btn.round { position: absolute; }
.br .fire { right: 0; bottom: 0; width: calc(112px * var(--ui)); height: calc(112px * var(--ui)); background: #E85D5D; }
.br .fire svg { width: calc(48px * var(--ui)); height: calc(48px * var(--ui)); }
.br .dash { right: calc(18px * var(--ui)); bottom: calc(126px * var(--ui)); width: calc(76px * var(--ui)); height: calc(76px * var(--ui)); background: #2F80ED; overflow: hidden; }
.br .dash svg { width: calc(34px * var(--ui)); height: calc(34px * var(--ui)); position: relative; z-index: 1; }
.br .dash .cd { position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,0.55) var(--p, 0deg), transparent 0); border-radius: 50%; }
.br .build { right: calc(124px * var(--ui)); bottom: calc(6px * var(--ui)); width: calc(70px * var(--ui)); height: calc(70px * var(--ui)); background: #F2A33A; }
.br .build svg { width: calc(34px * var(--ui)); height: calc(34px * var(--ui)); }
.br .reload { right: calc(132px * var(--ui)); bottom: calc(90px * var(--ui)); width: calc(52px * var(--ui)); height: calc(52px * var(--ui)); background: #4A5A70; }
.br .ctx { position: absolute; right: calc(100px * var(--ui)); bottom: calc(160px * var(--ui)); min-height: calc(64px * var(--ui)); padding: 0 calc(16px * var(--ui)) 0 calc(10px * var(--ui)); background: #2EAD5B; white-space: nowrap; border-radius: 99px; overflow: hidden; }
.br .ctx.repair { background: #D9902B; }
.br .ctx .lbl { position: relative; z-index: 1; }
.br .ctx .ico { position: relative; z-index: 1; }
.br .ctx .pring { position: absolute; inset: 0; background: conic-gradient(rgba(255,255,255,0.35) var(--p, 0deg), transparent 0); }
.joy { position: absolute; width: calc(124px * var(--ui)); height: calc(124px * var(--ui)); margin: calc(-62px * var(--ui)) 0 0 calc(-62px * var(--ui)); border-radius: 50%; background: rgba(30,42,58,0.35); border: 3px solid rgba(255,255,255,0.55); }
.joy .knob { position: absolute; left: 50%; top: 50%; width: calc(56px * var(--ui)); height: calc(56px * var(--ui)); margin: calc(-28px * var(--ui)) 0 0 calc(-28px * var(--ui)); border-radius: 50%; background: rgba(255,255,255,0.9); border: 3px solid var(--stroke); }
.joyhint { left: calc(var(--sa-l) + 18%); bottom: 38%; transform: translateX(-50%); font-weight: 800; font-size: calc(15px * var(--ui)); background: rgba(30,42,58,0.6); padding: 6px 12px; border-radius: 99px; border: 2px dashed rgba(255,255,255,0.6); }

/* Left-handed: mirror the controls. */
.lefty .bl { left: auto; right: calc(var(--sa-r) + var(--pad)); }
.lefty .br { right: auto; left: calc(var(--sa-l) + var(--pad)); transform: scaleX(-1); }
.lefty .br .btn svg, .lefty .br .btn span { transform: scaleX(-1); }
.lefty .joyhint { left: auto; right: calc(var(--sa-r) + 4%); }

/* Desktop: no big touch buttons (keys and mouse instead). */
.desk .br .fire, .desk .br .dash, .desk .br .reload { display: none; }

/* Build mode. */
.tray { position: absolute; left: 50%; bottom: calc(var(--sa-b) + var(--pad)); transform: translate(-50%, 140%); display: flex; gap: calc(8px * var(--ui)); transition: transform 220ms cubic-bezier(.2,1.3,.4,1); }
.building .tray { transform: translate(-50%, 0); }
.card {
  position: relative; width: calc(118px * var(--ui)); min-height: calc(128px * var(--ui)); padding: calc(8px * var(--ui)) calc(6px * var(--ui));
  background: var(--panel); border: 3px solid var(--stroke); border-radius: calc(14px * var(--ui)); box-shadow: 0 4px 0 var(--stroke);
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; font-family: var(--font); cursor: pointer;
}
.card.down { transform: scale(0.94); }
.card.on { background: #2B6CA3; border-color: var(--cyan); box-shadow: 0 4px 0 var(--stroke), 0 0 0 3px var(--cyan); }
.card.poor { filter: grayscale(0.8) brightness(0.7); }
.card .tico { display: flex; justify-content: center; width: 100%; padding: calc(4px * var(--ui)) 0; border-radius: calc(10px * var(--ui)); background: linear-gradient(160deg, #46698f, #2a3f58); border: 2px solid rgba(0,0,0,0.35); }
.card.on .tico { background: linear-gradient(160deg, #5ab8ff, #2b6ca3); }
.card .tico svg { width: calc(46px * var(--ui)); height: calc(46px * var(--ui)); filter: drop-shadow(0 3px 0 rgba(0,0,0,0.35)); }
.card .count { position: absolute; right: calc(-8px * var(--ui)); top: calc(-10px * var(--ui)); min-width: calc(26px * var(--ui)); height: calc(26px * var(--ui)); padding: 0 4px; display: flex; align-items: center; justify-content: center; background: #2F80ED; border: 3px solid var(--stroke); border-radius: calc(9px * var(--ui)); font-weight: 900; font-size: calc(13px * var(--ui)); box-shadow: 0 3px 0 var(--stroke); }
.card .name { font-weight: 900; font-size: calc(15px * var(--ui)); }
.card .cost { font-weight: 900; color: var(--accent); font-size: calc(15px * var(--ui)); }
.card.poor .cost { color: var(--bad); }
.card .role { font-size: calc(10.5px * var(--ui)); opacity: 0.85; text-align: center; line-height: 1.15; }
.card .key { position: absolute; left: 6px; top: 4px; font-size: calc(11px * var(--ui)); opacity: 0.6; font-weight: 800; }
.exitbuild { position: absolute; right: calc(var(--sa-r) + var(--pad)); bottom: calc(var(--sa-b) + var(--pad)); display: none !important; background: #C8414F; min-height: calc(64px * var(--ui)); }
.building .exitbuild { display: inline-flex !important; }
.buildhint { position: absolute; left: 50%; bottom: calc(var(--sa-b) + var(--pad) + 150px * var(--ui)); transform: translateX(-50%); padding: 6px 14px; font-weight: 800; display: none; white-space: nowrap; }
.building .buildhint { display: block; }
.building .br, .building .joy, .building .joyhint, .building .bl { display: none; }
.ghostbtns { position: absolute; left: 0; top: 0; display: none; gap: calc(14px * var(--ui)); }
.ghostbtns .btn { width: calc(66px * var(--ui)); height: calc(66px * var(--ui)); }
.ghostbtns .okbtn { background: #2EAD5B; }
.ghostbtns .nobtn { background: #C8414F; }
.ghostbtns { display: flex; }
.towerpanel { position: absolute; right: calc(var(--sa-r) + var(--pad)); top: calc(var(--sa-t) + 232px * var(--ui)); width: calc(270px * var(--ui)); padding: calc(12px * var(--ui)); display: flex; flex-direction: column; gap: calc(8px * var(--ui)); transform: translateX(130%); transition: transform 200ms ease-out; }
.towerpanel.open { transform: none; }
.lefty .towerpanel { right: auto; left: calc(var(--sa-l) + var(--pad)); transform: translateX(-130%); }
.lefty .towerpanel.open { transform: none; }
.tphead { display: flex; align-items: center; gap: 8px; }
.tphead .tico svg { width: calc(44px * var(--ui)); height: calc(44px * var(--ui)); display: block; }
.tptitle { flex: 1; }
.tptitle .name { font-weight: 900; font-size: calc(20px * var(--ui)); }
.tptitle .lvl { font-size: calc(12px * var(--ui)); opacity: 0.85; }
.tpstats { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 10px; font-size: calc(14px * var(--ui)); }
.srow { display: contents; }
.srow .k { opacity: 0.8; }
.srow .v { font-weight: 900; }
.srow .n { color: var(--good); font-weight: 900; font-size: calc(13px * var(--ui)); white-space: nowrap; }

/* Screens. */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(14px * var(--ui)); background: rgba(16, 24, 40, 0.55); padding: 20px; }
.screen.start { background: linear-gradient(rgba(16,24,40,0.15), rgba(16,24,40,0.55)); }
.logo { display: flex; gap: calc(8px * var(--ui)); font-weight: 900; font-size: calc(84px * var(--ui)); line-height: 1; letter-spacing: 0.02em; text-shadow: 0 6px 0 var(--stroke); -webkit-text-stroke: calc(4px * var(--ui)) var(--stroke); paint-order: stroke fill; }
.logo .l1 { color: #2F80ED; }
.logo .l2 { color: var(--accent); }
.tagline { font-weight: 800; font-size: calc(20px * var(--ui)); text-shadow: 0 3px 0 var(--stroke); }
.best { font-weight: 800; color: var(--accent); text-shadow: 0 2px 0 var(--stroke); min-height: 1.2em; }
.loading { font-weight: 800; opacity: 0.85; }
.rowbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.allgames { position: absolute; left: calc(var(--sa-l) + 16px); top: calc(var(--sa-t) + 14px); color: #fff; font-weight: 800; text-decoration: none; background: var(--panel); border: 3px solid var(--stroke); border-radius: 99px; padding: 8px 14px; box-shadow: 0 4px 0 var(--stroke); }
.dialog { width: min(92vw, calc(340px * var(--ui))); padding: calc(18px * var(--ui)); display: flex; flex-direction: column; gap: calc(10px * var(--ui)); max-height: 92vh; overflow-y: auto; }
.dialog.wide { width: min(94vw, calc(560px * var(--ui))); }
.dialog h2 { margin: 0 0 6px; text-align: center; font-size: calc(30px * var(--ui)); font-weight: 900; text-shadow: 0 3px 0 var(--stroke); }
.dialog h2.big { font-size: calc(38px * var(--ui)); color: var(--bad); }
.won .dialog h2.big { color: var(--accent); }
.linkbtn { background: #4A5A70; }
.setbody { display: flex; flex-direction: column; gap: 6px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-weight: 800; }
.setrow input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); }
.setrow input[type=range] { width: 52%; accent-color: var(--accent); height: 30px; }
.seg { display: flex; gap: 6px; }
.helpbody { font-size: calc(15px * var(--ui)); line-height: 1.4; }
.helpbody p { margin: 0 0 10px; }
.helptbl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-bottom: 10px; }
.helptbl .k { font-weight: 900; color: var(--accent); }
.muted { opacity: 0.75; }
.endstats { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: calc(16px * var(--ui)); margin-bottom: 6px; }
.endstats .v { font-weight: 900; text-align: right; }
.overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #1E2A3A; font-weight: 900; font-size: 22px; text-align: center; padding: 30px; z-index: 40; pointer-events: auto; }
.rotico { font-size: 70px; animation: spin 2s ease-in-out infinite; }
@keyframes spin { 50% { transform: rotate(90deg); } }

/* Toasts, banner, vignette, hints, numbers. */
.toasts { position: absolute; left: 50%; top: calc(var(--sa-t) + 130px * var(--ui)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 20; }
.toast { background: var(--panel); border: 3px solid var(--stroke); border-radius: 99px; box-shadow: 0 4px 0 var(--stroke); padding: 6px 16px; font-weight: 800; animation: pop 200ms ease-out; transition: opacity 400ms; white-space: nowrap; }
.toast.out { opacity: 0; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); } }
.banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; transform: translateX(-120%); pointer-events: none; z-index: 15; }
.banner .t { display: inline-block; font-weight: 900; font-size: calc(56px * var(--ui)); color: #fff; -webkit-text-stroke: calc(4px * var(--ui)) var(--stroke); paint-order: stroke fill; text-shadow: 0 6px 0 var(--stroke); }
.banner .s { font-weight: 800; font-size: calc(18px * var(--ui)); text-shadow: 0 3px 0 var(--stroke); }
.banner.boss .t { color: #FF4D5E; }
.banner.show { animation: banner 2.6s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes banner { 0% { transform: translateX(-120%); } 16% { transform: translateX(0); } 82% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(120%); opacity: 0; } }
.vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(255, 30, 60, 0.0); transition: box-shadow 400ms; }
.vignette.on { animation: vig 1.1s ease-in-out infinite; }
@keyframes vig { 50% { box-shadow: inset 0 0 160px 40px rgba(255, 30, 60, 0.45); } }
.hurt::after { content: ''; position: absolute; inset: 0; pointer-events: none; animation: hurt 350ms ease-out; }
@keyframes hurt { 0% { box-shadow: inset 0 0 120px 30px rgba(255, 40, 60, 0.6); } 100% { box-shadow: inset 0 0 120px 30px rgba(255, 40, 60, 0); } }
.hint { position: absolute; left: 50%; top: calc(var(--sa-t) + 180px * var(--ui)); transform: translateX(-50%); padding: 10px 16px; font-weight: 800; max-width: 70vw; text-align: center; z-index: 18; animation: pop 250ms ease-out; border-color: var(--accent); }
.dmglayer, .flylayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dmg { position: absolute; left: 0; top: 0; font-weight: 900; font-size: calc(19px * var(--ui)); -webkit-text-stroke: 3px var(--stroke); paint-order: stroke fill; will-change: transform; }
.coinfly { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; transition: transform 500ms cubic-bezier(.5,-0.3,.6,1); }
.coinfly svg { width: 100%; height: 100%; }
.debug { position: absolute; left: calc(var(--sa-l) + 10px); top: calc(var(--sa-t) + 80px * var(--ui)); background: rgba(0,0,0,0.65); padding: 8px; border-radius: 8px; z-index: 30; pointer-events: auto; }
.debug pre { margin: 0 0 6px; font: 12px ui-monospace, monospace; }
.modal .hud, .modal .tray, .modal .towerpanel { visibility: hidden; }

// ---- 01-level.js ----
// =============================================================================================
// LEVEL — the waypoints of the enemy lane, the build pads, the base and portal, and the seed
// for the props. The lane is a double S from the portal (left) to the citadel (right).
// The path is built once: straight segments joined by rounded corners, sampled densely, with
// cumulative lengths so an enemy's position is a lookup by distance travelled.
// =============================================================================================

const LEVEL = {
  waypoints: [
    [-54, -24], [-32, -24], [-32, 22], [-10, 22], [-10, -22], [12, -22], [12, 22], [34, 22], [34, -3],
  ],
  pathHalfWidth: 2.3,
  cornerRadius: 5,
  pads: [
    [-21, -10], [-21, 8], [1, -8], [1, 10], [23, -8], [23, 10],
    [-42.5, -16], [-21, 28.6], [1, -28.6], [23, 28.6], [-38.6, 2], [40.6, 12], [-46, -32], [45, -4],
  ],
  padSize: 4.2,
  base: { x: 34, z: -11, size: 9.5 },
  portal: { x: -55.5, z: -24 },
  playerSpawn: { x: 24, z: 2 },
  propSeed: 1337,
  pond: { x: 46, z: 42, r: 6.5 },
};

/**
 * Ground height on the field: the grass is made of raised blocks (2 or 4 units wide), so the
 * lane and the pads sit lower, like a trench. 2-unit cells over [-60, 60); 0 where no block.
 */
const HMAP = { cell: 2, n: 60, half: 60, h: new Float32Array(60 * 60) };

function groundHeight(x, z) {
  const i = Math.floor((x + HMAP.half) / HMAP.cell);
  const j = Math.floor((z + HMAP.half) / HMAP.cell);
  if (i < 0 || j < 0 || i >= HMAP.n || j >= HMAP.n) return 0;
  return HMAP.h[j * HMAP.n + i];
}

/** The lane as dense samples: x,z pairs, cumulative distance, total length. */
const PATH = (() => {
  const wp = LEVEL.waypoints;
  const R = LEVEL.cornerRadius;
  const pts = [];
  const push = (x, z) => {
    const n = pts.length;
    if (n >= 2 && Math.abs(pts[n - 2] - x) < 1e-4 && Math.abs(pts[n - 1] - z) < 1e-4) return;
    pts.push(x, z);
  };
  push(wp[0][0], wp[0][1]);
  for (let i = 1; i < wp.length - 1; i++) {
    const [ax, az] = wp[i - 1];
    const [bx, bz] = wp[i];
    const [cx, cz] = wp[i + 1];
    // Unit directions into and out of the corner.
    let d1x = bx - ax, d1z = bz - az;
    let d2x = cx - bx, d2z = cz - bz;
    const l1 = Math.hypot(d1x, d1z), l2 = Math.hypot(d2x, d2z);
    d1x /= l1; d1z /= l1; d2x /= l2; d2z /= l2;
    const r = Math.min(R, l1 / 2, l2 / 2);
    // The rounded corner is a quadratic Bezier from (corner - r·d1) through the corner to
    // (corner + r·d2): smooth, and it never leaves the lane's square corner.
    const sx = bx - d1x * r, sz = bz - d1z * r;
    const ex = bx + d2x * r, ez = bz + d2z * r;
    push(sx, sz);
    const steps = 10;
    for (let k = 1; k <= steps; k++) {
      const t = k / steps;
      const u = 1 - t;
      push(u * u * sx + 2 * u * t * bx + t * t * ex, u * u * sz + 2 * u * t * bz + t * t * ez);
    }
  }
  const last = wp[wp.length - 1];
  push(last[0], last[1]);
  // Resample straight runs every ~1 unit so lookups and distance checks are smooth.
  const dense = [];
  for (let i = 0; i < pts.length - 2; i += 2) {
    const x0 = pts[i], z0 = pts[i + 1], x1 = pts[i + 2], z1 = pts[i + 3];
    const len = Math.hypot(x1 - x0, z1 - z0);
    const n = Math.max(1, Math.ceil(len / 1.0));
    for (let k = 0; k < n; k++) dense.push(x0 + ((x1 - x0) * k) / n, z0 + ((z1 - z0) * k) / n);
  }
  dense.push(pts[pts.length - 2], pts[pts.length - 1]);
  const xz = new Float32Array(dense);
  const count = xz.length / 2;
  const cum = new Float32Array(count);
  for (let i = 1; i < count; i++) cum[i] = cum[i - 1] + Math.hypot(xz[i * 2] - xz[i * 2 - 2], xz[i * 2 + 1] - xz[i * 2 - 1]);
  return { xz, cum, count, total: cum[count - 1] };
})();

/**
 * Position and direction on the lane at distance d. Binary search on the cumulative lengths,
 * then linear interpolation inside the segment. Writes into `out` (no allocation).
 */
function pathAt(d, out) {
  const { xz, cum, count, total } = PATH;
  if (d <= 0) d = 0;
  if (d >= total) d = total - 1e-4;
  let lo = 0, hi = count - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= d) lo = mid; else hi = mid;
  }
  const seg = cum[hi] - cum[lo] || 1;
  const t = (d - cum[lo]) / seg;
  const x0 = xz[lo * 2], z0 = xz[lo * 2 + 1], x1 = xz[hi * 2], z1 = xz[hi * 2 + 1];
  out.x = x0 + (x1 - x0) * t;
  out.z = z0 + (z1 - z0) * t;
  const dl = Math.hypot(x1 - x0, z1 - z0) || 1;
  out.dx = (x1 - x0) / dl;
  out.dz = (z1 - z0) / dl;
  return out;
}

/** Distance from a point to the lane's centre line (and the lane distance at the closest point). */
function distToPath(x, z, out) {
  const { xz, count, cum } = PATH;
  let best = Infinity, bestD = 0;
  for (let i = 0; i < count - 1; i++) {
    const ax = xz[i * 2], az = xz[i * 2 + 1], bx = xz[i * 2 + 2], bz = xz[i * 2 + 3];
    const vx = bx - ax, vz = bz - az;
    const l2 = vx * vx + vz * vz || 1;
    let t = ((x - ax) * vx + (z - az) * vz) / l2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = ax + vx * t - x, pz = az + vz * t - z;
    const dd = px * px + pz * pz;
    if (dd < best) {
      best = dd;
      bestD = cum[i] + Math.sqrt(l2) * t;
    }
  }
  if (out) out.along = bestD;
  return Math.sqrt(best);
}

// ---- 02-utils.js ----
// =============================================================================================
// Utilities — small maths, easing, a seeded RNG, an object pool, an event bus and a spatial
// hash grid. Nothing here touches the scene or the DOM.
// =============================================================================================

const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
/** Frame-rate independent smoothing: moves `a` toward `b` with rate `k` per second. */
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const wrapAngle = (a) => {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
};
const dampAngle = (a, b, k, dt) => a + wrapAngle(b - a) * (1 - Math.exp(-k * dt));
const ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  outBack: (t) => {
    const c = 1.70158;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  },
  inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  outElastic: (t) => (t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
};

/** mulberry32: a small seeded RNG. */
function makeRng(seed) {
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    range: (a, b) => a + (b - a) * next(),
    int: (a, b) => a + Math.floor(next() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    reset: (v) => { s = v >>> 0; },
  };
}

/** A fixed-size pool of plain objects. `make` builds one; `reset` clears it for reuse. */
class Pool {
  constructor(size, make) {
    this.items = [];
    this.free = [];
    for (let i = 0; i < size; i++) {
      const o = make(i);
      o.alive = false;
      o.poolIndex = i;
      this.items.push(o);
      this.free.push(o);
    }
  }
  get() {
    const o = this.free.pop();
    if (!o) return null;
    o.alive = true;
    return o;
  }
  release(o) {
    if (!o.alive) return;
    o.alive = false;
    this.free.push(o);
  }
  releaseAll() {
    this.free.length = 0;
    for (const o of this.items) {
      o.alive = false;
      this.free.push(o);
    }
  }
  get used() {
    return this.items.length - this.free.length;
  }
}

/** A tiny event bus: systems announce things (kills, leaks, waves) and the UI and audio listen. */
class EventBus {
  constructor() {
    this.map = new Map();
  }
  on(name, fn) {
    if (!this.map.has(name)) this.map.set(name, []);
    this.map.get(name).push(fn);
  }
  emit(name, a, b, c) {
    const list = this.map.get(name);
    if (list) for (let i = 0; i < list.length; i++) list[i](a, b, c);
  }
}

/**
 * Spatial hash for enemies (cell ~8 units). Rebuilt each simulation step; queries return
 * candidates from the cells touching a circle. Arrays are reused, nothing allocates per frame.
 */
class SpatialHash {
  constructor(cell, half) {
    this.cell = cell;
    this.half = half;
    this.n = Math.ceil((half * 2) / cell) + 2;
    this.cells = [];
    for (let i = 0; i < this.n * this.n; i++) this.cells.push([]);
    this.out = [];
  }
  clear() {
    for (const c of this.cells) c.length = 0;
  }
  key(x, z) {
    const cx = clamp(Math.floor((x + this.half) / this.cell) + 1, 0, this.n - 1);
    const cz = clamp(Math.floor((z + this.half) / this.cell) + 1, 0, this.n - 1);
    return cz * this.n + cx;
  }
  insert(o, x, z) {
    this.cells[this.key(x, z)].push(o);
  }
  /** Fills and returns a shared array: do not keep it across calls. */
  query(x, z, r) {
    const out = this.out;
    out.length = 0;
    const c = this.cell;
    const x0 = clamp(Math.floor((x - r + this.half) / c) + 1, 0, this.n - 1);
    const x1 = clamp(Math.floor((x + r + this.half) / c) + 1, 0, this.n - 1);
    const z0 = clamp(Math.floor((z - r + this.half) / c) + 1, 0, this.n - 1);
    const z1 = clamp(Math.floor((z + r + this.half) / c) + 1, 0, this.n - 1);
    for (let cz = z0; cz <= z1; cz++)
      for (let cx = x0; cx <= x1; cx++) {
        const cell = this.cells[cz * this.n + cx];
        for (let i = 0; i < cell.length; i++) out.push(cell[i]);
      }
    return out;
  }
}

/** Shared temporaries, so hot code never allocates vectors. */
const TMP = {
  v1: new THREE.Vector3(),
  v2: new THREE.Vector3(),
  v3: new THREE.Vector3(),
  v4: new THREE.Vector3(),
  q1: new THREE.Quaternion(),
  q2: new THREE.Quaternion(),
  e1: new THREE.Euler(),
  m1: new THREE.Matrix4(),
  m2: new THREE.Matrix4(),
  s1: new THREE.Vector3(),
  c1: new THREE.Color(),
  c2: new THREE.Color(),
  p: { x: 0, z: 0, dx: 1, dz: 0 },
  p2: { x: 0, z: 0, dx: 1, dz: 0 },
  along: { along: 0 },
  up: new THREE.Vector3(0, 1, 0),
};

/** Reads/writes localStorage without ever throwing (private mode, full or blocked storage). */
const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      // Ignore.
    }
  },
};

const fmtMoney = (n) => `$${Math.floor(n).toLocaleString('en-US')}`;

// ---- 03-art.js ----
// =============================================================================================
// ART — the 3-step toon gradient, shared materials, geometry factories, model builders for
// every entity and the procedural textures. Everything is built from code: no image, model or
// font files. Geometries are created once and shared.
//
// Draw-call plan: static scenery is merged by material (terrain, path, pads, props, citadel);
// every enemy type is ONE instanced mesh (limbs swing in the vertex shader) plus one outline
// mesh; projectiles, coins, particles, shadows, beams and health bars are instanced too.
// =============================================================================================

const ART = {
  gradient: null,
  mats: {},
  geos: {},
  tex: {},
  outlineWidth: { value: CONFIG.map.outlineWidth },
  time: { value: 0 },
};

function color(hex) {
  return new THREE.Color(hex);
}

/** A 3-step gradient for MeshToonMaterial: shadow, mid, light. */
function makeGradient() {
  const data = new Uint8Array([110, 110, 110, 255, 185, 185, 185, 255, 255, 255, 255, 255]);
  const t = new THREE.DataTexture(data, 3, 1, THREE.RGBAFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}

function toon(hex, opts = {}) {
  const key = `${hex}|${opts.emissive ?? ''}|${opts.ei ?? ''}|${opts.transparent ?? ''}|${opts.opacity ?? ''}`;
  if (ART.mats[key]) return ART.mats[key];
  const m = new THREE.MeshToonMaterial({
    color: hex, gradientMap: ART.gradient,
    emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.ei ?? 1,
    transparent: !!opts.transparent, opacity: opts.opacity ?? 1,
  });
  ART.mats[key] = m;
  return m;
}

/** Inverted-hull outline: back faces pushed out along the normal, drawn dark. */
function outlineMaterial() {
  if (ART.mats.outline) return ART.mats.outline;
  const m = new THREE.MeshBasicMaterial({ color: CONFIG.palette.outline, side: THREE.BackSide });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uOutline = ART.outlineWidth;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uOutline;')
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position) + normal * uOutline;');
  };
  ART.mats.outline = m;
  return m;
}

/** Adds an outline twin to a mesh (same geometry, parented to it). */
function addOutline(mesh) {
  const o = new THREE.Mesh(mesh.geometry, outlineMaterial());
  o.name = 'outline';
  o.raycast = () => {};
  mesh.add(o);
  return o;
}

// ---- Geometry helpers ----------------------------------------------------------------------

function rbox(w, h, d, r = 0.12, seg = 1) {
  const key = `rb:${w}:${h}:${d}:${r}:${seg}`;
  if (!ART.geos[key]) ART.geos[key] = new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2.01, h / 2.01, d / 2.01));
  return ART.geos[key];
}

/**
 * Collects coloured parts and merges them into one geometry with vertex colours (and an
 * optional per-vertex "limb" tag used by the enemy shader).
 */
class GeoBuilder {
  constructor() {
    this.parts = [];
  }
  add(geo, hex, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, limb = null, glow = 1) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (!g.getAttribute('uv')) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.getAttribute('position').count * 2), 2));
    if (!g.getAttribute('normal')) g.computeVertexNormals();
    TMP.e1.set(rx, ry, rz);
    TMP.q1.setFromEuler(TMP.e1);
    TMP.m1.compose(TMP.v1.set(x, y, z), TMP.q1, TMP.s1.set(sx, sy, sz));
    g.applyMatrix4(TMP.m1);
    const n = g.getAttribute('position').count;
    const c = TMP.c1.set(hex);
    const cols = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      cols[i * 3] = c.r * glow;
      cols[i * 3 + 1] = c.g * glow;
      cols[i * 3 + 2] = c.b * glow;
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    const lv = new Float32Array(n * 4);
    if (limb) for (let i = 0; i < n; i++) lv.set(limb, i * 4);
    g.setAttribute('aLimb', new THREE.Float32BufferAttribute(lv, 4));
    this.parts.push(g);
    return this;
  }
  build() {
    const g = BufferGeometryUtils.mergeGeometries(this.parts, false);
    for (const p of this.parts) p.dispose();
    this.parts = [];
    g.computeBoundingSphere();
    return g;
  }
}

// ---- Procedural textures -------------------------------------------------------------------

function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (opts.repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(opts.repeat, opts.repeat);
  }
  if (opts.nearest) {
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
  }
  return t;
}

function makeTextures() {
  // Soft round blob shadow.
  ART.tex.blob = canvasTex(64, 64, (g, w, h) => {
    const r = g.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(20,30,20,0.55)');
    r.addColorStop(0.6, 'rgba(20,30,20,0.25)');
    r.addColorStop(1, 'rgba(20,30,20,0)');
    g.fillStyle = r;
    g.fillRect(0, 0, w, h);
  });
  // Mown stripes for the grass (light/dark bands, very subtle).
  ART.tex.stripes = canvasTex(64, 64, (g, w, h) => {
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#eef3ea';
    g.fillRect(0, 0, w / 2, h);
    for (let i = 0; i < 120; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.35)' : 'rgba(200,215,190,0.35)';
      g.fillRect(Math.random() * w, Math.random() * h, 1, 2);
    }
  }, { repeat: 22 });
  // Player face: two eyes and a smile.
  ART.tex.face = canvasTex(64, 64, (g) => {
    g.clearRect(0, 0, 64, 64);
    g.fillStyle = '#1b1b2f';
    g.fillRect(16, 20, 9, 13);
    g.fillRect(39, 20, 9, 13);
    g.fillStyle = '#ffffff';
    g.fillRect(19, 22, 3, 4);
    g.fillRect(42, 22, 3, 4);
    g.strokeStyle = '#1b1b2f';
    g.lineWidth = 4;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(32, 36, 12, 0.2 * Math.PI, 0.8 * Math.PI);
    g.stroke();
  });
  // Muzzle flash star.
  ART.tex.flash = canvasTex(64, 64, (g, w, h) => {
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,255,230,1)');
    r.addColorStop(0.3, 'rgba(255,220,120,0.9)');
    r.addColorStop(1, 'rgba(255,160,40,0)');
    g.fillStyle = r;
    g.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * TAU;
      const rr = i % 2 === 0 ? 32 : 13;
      g.lineTo(32 + Math.cos(a) * rr, 32 + Math.sin(a) * rr);
    }
    g.fill();
    void w;
    void h;
  });
  // Hexagon pattern for shield bubbles.
  ART.tex.hex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#000';
    g.fillRect(0, 0, w, h);
    g.strokeStyle = '#fff';
    g.lineWidth = 3;
    const s = 16;
    for (let row = -1; row < 10; row++)
      for (let col = -1; col < 6; col++) {
        const cx = col * s * 1.5 * 1.0 + (row % 2 ? s * 0.75 : 0) * 1;
        const cy = row * s * 0.866;
        g.beginPath();
        for (let k = 0; k <= 6; k++) {
          const a = (k / 6) * TAU;
          g.lineTo(cx * 1.5 + Math.cos(a) * s * 0.55, cy + Math.sin(a) * s * 0.55);
        }
        g.stroke();
      }
  }, { repeat: 1, data: true });
  ART.tex.hex.wrapS = ART.tex.hex.wrapT = THREE.RepeatWrapping;
  // Scorch mark.
  ART.tex.scorch = canvasTex(64, 64, (g) => {
    const r = g.createRadialGradient(32, 32, 2, 32, 32, 32);
    r.addColorStop(0, 'rgba(40,28,18,0.85)');
    r.addColorStop(0.7, 'rgba(50,36,22,0.45)');
    r.addColorStop(1, 'rgba(50,36,22,0)');
    g.fillStyle = r;
    g.fillRect(0, 0, 64, 64);
  });
  // A ring (target markers).
  ART.tex.ring = canvasTex(64, 64, (g) => {
    g.strokeStyle = '#ffffff';
    g.lineWidth = 6;
    g.beginPath();
    g.arc(32, 32, 26, 0, TAU);
    g.stroke();
  });
  // Dust puff.
  ART.tex.puff = canvasTex(32, 32, (g) => {
    const r = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    r.addColorStop(0, 'rgba(255,255,255,0.9)');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r;
    g.fillRect(0, 0, 32, 32);
  });
}

// ---- Shared shader bits ---------------------------------------------------------------------

/**
 * Enemy limb animation in the vertex shader. Per vertex, aLimb = (kind, side, pivotY, pivotX):
 * kind 1 = leg, 2 = arm, 3 = wing. Per instance, aAnim = (walk phase, swing amount, flap phase,
 * hit flash). Legs and arms rotate about the X axis at their pivot height; wings about Z.
 */
const LIMB_GLSL = `
vec3 transformed = vec3(position);
if (aLimb.x > 0.5) {
  float ang;
  if (aLimb.x < 1.5) ang = sin(aAnim.x) * aAnim.y * aLimb.y;
  else if (aLimb.x < 2.5) ang = -sin(aAnim.x) * aAnim.y * aLimb.y * 0.85;
  else ang = sin(aAnim.z) * 0.65 * aLimb.y;
  float c = cos(ang), s = sin(ang);
  if (aLimb.x < 2.5) {
    vec3 p = transformed - vec3(0.0, aLimb.z, 0.0);
    p = vec3(p.x, p.y * c - p.z * s, p.y * s + p.z * c);
    transformed = p + vec3(0.0, aLimb.z, 0.0);
  } else {
    vec3 p = transformed - vec3(aLimb.w, aLimb.z, 0.0);
    p = vec3(p.x * c - p.y * s, p.x * s + p.y * c, p.z);
    transformed = p + vec3(aLimb.w, aLimb.z, 0.0);
  }
}
`;

function enemyMaterial(outline) {
  const m = outline
    ? new THREE.MeshBasicMaterial({ color: CONFIG.palette.outline, side: THREE.BackSide })
    : new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: ART.gradient });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uOutline = ART.outlineWidth;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec4 aLimb;\nattribute vec4 aAnim;\nuniform float uOutline;\nvarying float vFlash;')
      .replace('#include <begin_vertex>', `${LIMB_GLSL}\n${outline ? 'transformed += normal * uOutline * 1.2;' : ''}\nvFlash = aAnim.w;`);
    if (!outline) {
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying float vFlash;')
        .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.0), vFlash);');
    }
  };
  m.customProgramCacheKey = () => (outline ? 'enemy-outline' : 'enemy-body');
  return m;
}

/** Gentle wind for grass: the tip moves with a time uniform and the instance position. */
function swayMaterial(base) {
  base.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = ART.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `vec3 transformed = vec3(position);
      #ifdef USE_INSTANCING
        vec2 ip = instanceMatrix[3].xz;
        float w = sin(uTime * 1.8 + ip.x * 0.35 + ip.y * 0.27) * 0.12 + sin(uTime * 3.1 + ip.x) * 0.04;
        transformed.x += w * position.y;
        transformed.z += w * 0.6 * position.y;
      #endif`);
  };
  base.customProgramCacheKey = () => 'sway';
  return base;
}

// ---- Model builders -------------------------------------------------------------------------

/** Player: a blocky figure built from separate parts so they can be animated. */
function buildPlayerRig() {
  const P = CONFIG.palette;
  const root = new THREE.Group();
  const body = new THREE.Group(); // lean, bob, squash
  root.add(body);
  const mk = (geo, hex, parent, x, y, z) => {
    const m = new THREE.Mesh(geo, toon(hex));
    m.position.set(x, y, z);
    m.castShadow = true;
    parent.add(m);
    addOutline(m);
    return m;
  };
  const hips = new THREE.Group();
  hips.position.y = 1.0;
  body.add(hips);
  const torso = mk(rbox(1.0, 1.1, 0.56, 0.14), P.playerTorso, hips, 0, 0.55, 0);
  const headPivot = new THREE.Group();
  headPivot.position.set(0, 1.12, 0);
  hips.add(headPivot);
  const head = mk(rbox(0.82, 0.78, 0.78, 0.18), P.playerHead, headPivot, 0, 0.42, 0);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), new THREE.MeshBasicMaterial({ map: ART.tex.face, transparent: true }));
  face.position.set(0, 0.42, 0.395);
  headPivot.add(face);
  const limb = (geo, hex, x, y, parent) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    parent.add(pivot);
    const m = mk(geo, hex, pivot, 0, -0.45, 0);
    return { pivot, m };
  };
  const armL = limb(rbox(0.34, 0.95, 0.36, 0.12), P.playerHead, 0.68, 1.0, hips);
  const armR = limb(rbox(0.34, 0.95, 0.36, 0.12), P.playerHead, -0.68, 1.0, hips);
  // Sleeves in the torso colour.
  mk(rbox(0.38, 0.34, 0.4, 0.1), P.playerTorso, armL.pivot, 0, -0.1, 0);
  mk(rbox(0.38, 0.34, 0.4, 0.1), P.playerTorso, armR.pivot, 0, -0.1, 0);
  const legL = limb(rbox(0.44, 0.98, 0.48, 0.12), P.playerLegs, 0.25, 0.02, hips);
  const legR = limb(rbox(0.44, 0.98, 0.48, 0.12), P.playerLegs, -0.25, 0.02, hips);
  // Gun on the right hand, pointing forward.
  const gun = new THREE.Group();
  gun.position.set(0, -0.82, 0.08);
  gun.rotation.x = Math.PI / 2;
  armR.pivot.add(gun);
  const g1 = mk(rbox(0.22, 0.26, 0.75, 0.06), P.gun, gun, 0, 0, 0.2);
  const g2 = mk(rbox(0.12, 0.12, 0.5, 0.04), 0x2b2d42, gun, 0, 0.04, 0.75);
  mk(rbox(0.12, 0.3, 0.16, 0.04), P.gun, gun, 0, -0.18, -0.02);
  const glow = new THREE.Mesh(rbox(0.13, 0.05, 0.3, 0.02), toon(0x3ee0ff, { emissive: 0x3ee0ff, ei: 1.6 }));
  glow.position.set(0, 0.16, 0.2);
  gun.add(glow);
  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0.04, 1.05);
  gun.add(muzzle);
  const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: ART.tex.flash, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  flash.scale.set(0.9, 0.9, 0.9);
  flash.visible = false;
  muzzle.add(flash);
  void torso; void head; void g1; void g2;
  return { root, body, hips, headPivot, armL: armL.pivot, armR: armR.pivot, legL: legL.pivot, legR: legR.pivot, gun, muzzle, flash };
}

/**
 * Enemy geometries: one merged geometry per type, vertex coloured, with limbs tagged for the
 * shader. Units: about 2 tall for a grunt. The body origin is on the ground.
 */
function buildEnemyGeometry(type) {
  const P = CONFIG.palette;
  const b = new GeoBuilder();
  const base = color(P[type]);
  const dark = base.clone().multiplyScalar(0.62).getHex();
  const light = base.clone().lerp(new THREE.Color(0xffffff), 0.25).getHex();
  const eye = 0x1b1b2f;
  const LEG = (side, pivotY) => [1, side, pivotY, 0];
  const ARM = (side, pivotY) => [2, side, pivotY, 0];
  switch (type) {
    case 'grunt':
    case 'shielded': {
      const body = type === 'shielded' ? 0x6c7a89 : P.grunt;
      const bodyDark = color(body).multiplyScalar(0.62).getHex();
      b.add(rbox(1.0, 1.0, 0.62, 0.16), body, 0, 1.3, 0);
      b.add(rbox(0.78, 0.72, 0.72, 0.18), color(body).lerp(color(0xffffff), 0.2).getHex(), 0, 2.15, 0);
      b.add(rbox(0.16, 0.18, 0.06, 0.03), eye, -0.17, 2.2, 0.36);
      b.add(rbox(0.16, 0.18, 0.06, 0.03), eye, 0.17, 2.2, 0.36);
      b.add(rbox(0.36, 0.82, 0.4, 0.1), bodyDark, -0.24, 0.42, 0, 0, 0, 0, 1, 1, 1, LEG(1, 0.82));
      b.add(rbox(0.36, 0.82, 0.4, 0.1), bodyDark, 0.24, 0.42, 0, 0, 0, 0, 1, 1, 1, LEG(-1, 0.82));
      b.add(rbox(0.3, 0.86, 0.32, 0.1), body, -0.66, 1.32, 0, 0, 0, 0, 1, 1, 1, ARM(1, 1.72));
      b.add(rbox(0.3, 0.86, 0.32, 0.1), body, 0.66, 1.32, 0, 0, 0, 0, 1, 1, 1, ARM(-1, 1.72));
      if (type === 'shielded') b.add(rbox(0.9, 0.18, 0.66, 0.06), 0x7fdbff, 0, 1.82, 0, 0, 0, 0, 1, 1, 1, null, 1.6);
      break;
    }
    case 'runner': {
      b.add(rbox(0.74, 0.9, 0.48, 0.14), P.runner, 0, 1.55, 0.1, 0.32, 0, 0);
      b.add(rbox(0.66, 0.6, 0.62, 0.16), light, 0, 2.28, 0.35, 0.2, 0, 0);
      b.add(rbox(0.14, 0.12, 0.06, 0.03), eye, -0.14, 2.32, 0.66);
      b.add(rbox(0.14, 0.12, 0.06, 0.03), eye, 0.14, 2.32, 0.66);
      b.add(rbox(0.28, 1.12, 0.3, 0.09), dark, -0.19, 0.56, 0, 0, 0, 0, 1, 1, 1, LEG(1, 1.1));

/**
 * Tower models per type and level: a static base and a turning head (both merged, vertex
 * coloured). Level 2 adds parts and a cyan trim; level 3 adds glowing parts and a gold flag.

 */
function buildTowerGeometry(type, level) {
  const P = CONFIG.palette;
  const T = CONFIG.towers[type];
  const main = T.color;
  const dark = color(main).multiplyScalar(0.6).getHex();
  const trim = P.trimL2;
  const gold = P.glowL3;
  const base = new GeoBuilder();
  const head = new GeoBuilder();
  let muzzle = new THREE.Vector3(0, 0, 1.2);

  // A shared stone plinth.
  base.add(rbox(3.0, 0.5, 3.0, 0.18), 0xa8b3c2, 0, 0.25, 0);
  base.add(rbox(2.4, 0.6, 2.4, 0.16), 0xc5ced9, 0, 0.75, 0);
  if (level >= 2) {
    base.add(rbox(2.52, 0.12, 2.52, 0.05), trim, 0, 1.04, 0, 0, 0, 0, 1, 1, 1, null, 1.25);
    for (const [x, z] of [[-1.25, -1.25], [1.25, -1.25], [-1.25, 1.25], [1.25, 1.25]]) base.add(rbox(0.35, 0.7, 0.35, 0.08), 0x8d99aa, x, 0.6, z);

  if (level >= 3) {
    base.add(new THREE.CylinderGeometry(0.04, 0.04, 1.6, 6), 0x6b5b4b, 1.15, 1.6, -1.15);

  const glowMul = level >= 3 ? 2.6 : 1.2;

      if (level >= 2) for (const s of [-1, 1]) head.add(new THREE.ConeGeometry(0.15, 0.5, 6), trim, s * 0.55, 0.9, -0.1, 0, 0, s * 0.5, 1, 1, 1, null, 1.3);

    case 'pylon': {

      if (level >= 3) head.add(new THREE.TorusGeometry(1.35, 0.06, 4, 14), gold, 0, 1.75, 0, Math.PI / 2 - 0.6, 0.5, 0, 1, 1, 1, null, 2.6);
      muzzle = new THREE.Vector3(0, 1.75, 0);

    }
    case 'tesla': {
      headY = 1.3;
      base.add(new THREE.CylinderGeometry(0.35, 0.55, 1.2, 8), dark, 0, 1.6, 0);
      for (let k = 0; k < 3; k++) base.add(new THREE.TorusGeometry(0.5 - k * 0.08, 0.07, 4, 14), 0xd9a441, 0, 1.25 + k * 0.32, 0, Math.PI / 2, 0, 0);
      head.add(new THREE.SphereGeometry(0.55, 10, 7), main, 0, 1.15, 0, 0, 0, 0, 1, 1, 1, null, glowMul * 0.9);

  return { base: base.build(), head: head.build(), muzzle, headY };
}

/** The citadel: walls, corner towers with cone roofs, gate; plus the crystal and flag. */
function buildCitadelGeometry() {
  const P = CONFIG.palette;
  const s = LEVEL.base.size;
  const h = s / 2;
  const b = new GeoBuilder();
  b.add(rbox(s + 1, 0.5, s + 1, 0.2), 0xa8b3c2, 0, 0.25, 0);
  // Walls (with a gate gap facing the lane, +z).
  const wallH = 2.4;
  b.add(rbox(s, wallH, 0.9, 0.16), P.stone, 0, 0.5 + wallH / 2, -h + 0.45);
  b.add(rbox(0.9, wallH, s, 0.16), P.stone, -h + 0.45, 0.5 + wallH / 2, 0);
  b.add(rbox(0.9, wallH, s, 0.16), P.stone, h - 0.45, 0.5 + wallH / 2, 0);
  b.add(rbox(s * 0.32, wallH, 0.9, 0.16), P.stone, -s * 0.34, 0.5 + wallH / 2, h - 0.45);
  b.add(rbox(s * 0.32, wallH, 0.9, 0.16), P.stone, s * 0.34, 0.5 + wallH / 2, h - 0.45);
  // Battlements.
  for (let i = -3; i <= 3; i++) {
    b.add(rbox(0.6, 0.5, 0.9, 0.1), P.stoneDark, i * (s / 8), 3.15, -h + 0.45);
    if (Math.abs(i) >= 2) b.add(rbox(0.6, 0.5, 0.9, 0.1), P.stoneDark, i * (s / 8), 3.15, h - 0.45);
    b.add(rbox(0.9, 0.5, 0.6, 0.1), P.stoneDark, -h + 0.45, 3.15, i * (s / 8));
    b.add(rbox(0.9, 0.5, 0.6, 0.1), P.stoneDark, h - 0.45, 3.15, i * (s / 8));
  }
  // Gate arch.
  b.add(rbox(3.6, 0.7, 1.0, 0.14), P.stoneDark, 0, 3.0, h - 0.45);
  b.add(rbox(2.4, 1.8, 0.3, 0.1), P.woodDark, 0, 1.4, h - 0.2);
  // Corner towers with cone roofs.
  for (const [x, z] of [[-h, -h], [h, -h], [-h, h], [h, h]]) {
    b.add(new THREE.CylinderGeometry(1.15, 1.3, 4.2, 12), P.stone, x, 2.6, z);
    b.add(new THREE.CylinderGeometry(1.35, 1.35, 0.4, 12), P.stoneDark, x, 4.75, z);
    b.add(new THREE.ConeGeometry(1.5, 2.0, 12), P.roof, x, 5.95, z);
  }
  // Keep in the middle.
  b.add(rbox(3.4, 3.2, 3.4, 0.2), 0xd6dae3, 0, 2.1, -0.6);
  b.add(new THREE.ConeGeometry(2.4, 1.8, 4), P.roof, 0, 4.6, -0.6, 0, Math.PI / 4, 0);
  return b.build();
}

function buildPropsGeometry(rng, colliders) {
  const P = CONFIG.palette;
  const b = new GeoBuilder();
  const blocked = (x, z, r) => {
    if (distToPath(x, z) < LEVEL.pathHalfWidth + r + 1.5) return true;
    for (const [px, pz] of LEVEL.pads) if (Math.hypot(px - x, pz - z) < LEVEL.padSize / 2 + r + 1.6) return true;
    const B = LEVEL.base;
    if (Math.abs(x - B.x) < B.size / 2 + r + 2 && Math.abs(z - B.z) < B.size / 2 + r + 2) return true;
    if (Math.hypot(x - LEVEL.portal.x, z - LEVEL.portal.z) < 6 + r) return true;
    if (Math.hypot(x - LEVEL.pond.x, z - LEVEL.pond.z) < LEVEL.pond.r + r + 0.5) return true;
    if (Math.hypot(x - LEVEL.playerSpawn.x, z - LEVEL.playerSpawn.z) < 4) return true;
    return false;
  };
  const tree = (x, z, s, y = 0, pal = P.leaf) => {
    const kind = rng.int(0, 2);
    b.add(new THREE.CylinderGeometry(0.22 * s, 0.32 * s, 1.4 * s, 7), P.trunk, x, y + 0.7 * s, z);
    if (kind === 0) {
      for (let k = 0; k < 3; k++) b.add(new THREE.ConeGeometry((1.6 - k * 0.38) * s, 1.5 * s, 8), pal[k % pal.length], x, y + (1.6 + k * 0.85) * s, z, 0, rng.next() * 3, 0);
    } else {
      b.add(new THREE.IcosahedronGeometry(1.25 * s, 0), rng.pick(pal), x, y + 2.2 * s, z, rng.next(), rng.next(), 0, 1, 0.9, 1);
      if (kind === 2) b.add(new THREE.IcosahedronGeometry(0.85 * s, 0), rng.pick(pal), x + 0.6 * s, y + 2.9 * s, z + 0.2 * s);
    }
  };
  const rock = (x, z, s, y = 0) => b.add(new THREE.DodecahedronGeometry(s, 0), rng.pick(P.rock), x, y + s * 0.3, z, rng.next(), rng.next() * 3, 0, 1.3, 0.55, 1);
  // Inside the playable area: sparse trees, rocks, crates and barrels (with colliders).
  let placed = 0;
  for (let tries = 0; tries < 600 && placed < 34; tries++) {
    const x = rng.range(-52, 52);
    const z = rng.range(-52, 52);
    const kind = rng.next();
    const r = kind < 0.45 ? 1.2 : kind < 0.75 ? 1.0 : 0.7;
    if (blocked(x, z, r + 1)) continue;
    const gy = groundHeight(x, z);
    if (kind < 0.45) tree(x, z, rng.range(0.85, 1.25), gy);
    else if (kind < 0.75) rock(x, z, rng.range(0.7, 1.2), gy);
    else if (kind < 0.88) {
      b.add(rbox(1.1, 1.1, 1.1, 0.08), P.wood, x, gy + 0.55, z, 0, rng.next() * 3, 0);
      b.add(rbox(1.14, 0.12, 0.2, 0.03), P.woodDark, x, gy + 0.55, z, 0, rng.next() * 3, 0.8);
    } else {
      b.add(new THREE.CylinderGeometry(0.5, 0.5, 1.1, 10), P.wood, x, gy + 0.55, z);
      b.add(new THREE.TorusGeometry(0.5, 0.05, 4, 12), P.woodDark, x, gy + 0.3, z, Math.PI / 2, 0, 0);
      b.add(new THREE.TorusGeometry(0.5, 0.05, 4, 12), P.woodDark, x, gy + 0.8, z, Math.PI / 2, 0, 0);
    }
    colliders.push({ x, z, r });
    placed++;
  }
  // A fence run beside the citadel.
  for (let i = 0; i < 6; i++) {
    const x = 46 + i * 1.6;
    b.add(rbox(0.2, 1.0, 0.2, 0.05), P.woodDark, x, 0.5, -20);
    if (i < 5) b.add(rbox(1.6, 0.16, 0.12, 0.04), P.wood, x + 0.8, 0.7, -20);
  }
  colliders.push({ box: true, x0: 45.8, x1: 54.2, z0: -20.3, z1: -19.7 });
  // Pond rim stones.
  const pd = LEVEL.pond;
  for (let k = 0; k < 18; k++) {
    const a = (k / 18) * TAU;
    rock(pd.x + Math.cos(a) * (pd.r + 0.4), pd.z + Math.sin(a) * (pd.r + 0.4), rng.range(0.35, 0.6), -0.1);
  }
  colliders.push({ x: pd.x, z: pd.z, r: pd.r });
  // Outside the playable area: a dense, dark jungle on the hills, and bushes along the edge.
  for (let k = 0; k < 420; k++) {
    const a = rng.next() * TAU;
    const d = rng.range(61, 108);
    const x = Math.cos(a) * d * 1.05;
    const z = Math.sin(a) * d;
    if (Math.abs(x) < 59 && Math.abs(z) < 59) continue;
    const y = terrainHeight(x, z);
    const r = rng.next();
    if (r < 0.82) tree(x, z, rng.range(1.0, 1.9), y, rng.next() < 0.7 ? P.jungle : P.leaf);
    else rock(x, z, rng.range(1.0, 2.2), y);
  }
  for (let k = 0; k < 150; k++) {
    // Bushes on the rim: the edge of the field reads as a wall of greenery.
    const along = rng.range(-62, 62);
    const out = rng.range(57.5, 64);
    const side = rng.int(0, 3);
    const x = side === 0 ? out : side === 1 ? -out : along;
    const z = side === 2 ? out : side === 3 ? -out : along;
    const y = terrainHeight(x, z);
    const s = rng.range(0.8, 1.5);
    for (let q = 0; q < 3; q++) b.add(new THREE.IcosahedronGeometry(s * (0.9 - q * 0.18), 0), rng.pick(P.jungle), x + (q - 1) * 0.7 * s, y + s * 0.45, z + rng.range(-0.5, 0.5), rng.next(), rng.next(), 0, 1, 0.72, 1);
  }
  return b.build();
}

/**
 * A unit grass block (1×1×1, origin at the bottom centre): a flat top, a bevelled rim and
 * straight sides that fade from grass green to earth. Flat-shaded for a crisp, chunky look.
 */
function bevelBlockGeometry() {
  const P = CONFIG.palette;
  const inset = 0.07, bevel = 0.16;
  const yTop = 1, yRim = 1 - bevel;
  const top = color(P.grass), side = color(P.blockSide), dirt = color(P.dirt);
  const pos = [], nor = [], col = [];
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3();
  const quad = (a, b, c, d, out, ca, cb, cc, cd) => {
    A.fromArray(b).sub(TMP.v1.fromArray(a));
    B.fromArray(c).sub(TMP.v1.fromArray(a));
    N.crossVectors(A, B).normalize();
    if (N.dot(TMP.v2.fromArray(out)) < 0) {
      [b, d] = [d, b];
      [cb, cd] = [cd, cb];
      N.negate();
    }
    for (const [v, c2] of [[a, ca], [b, cb], [c, cc], [a, ca], [c, cc], [d, cd]]) {
      pos.push(...v);
      nor.push(N.x, N.y, N.z);
      col.push(c2.r, c2.g, c2.b);
    }
  };
  const i = 0.5 - inset, o = 0.5;
  const t = (x, z) => [x, yTop, z];
  const r = (x, z) => [x, yRim, z];
  const g = (x, z) => [x, 0, z];
  quad(t(-i, -i), t(-i, i), t(i, i), t(i, -i), [0, 1, 0], top, top, top, top);
  const sides = [
    [[1, 0], [o, -o], [o, o], [i, -i], [i, i]],
    [[-1, 0], [-o, -o], [-o, o], [-i, -i], [-i, i]],
    [[0, 1], [-o, o], [o, o], [-i, i], [i, i]],
    [[0, -1], [-o, -o], [o, -o], [-i, -i], [i, -i]],
  ];
  for (const [[nx, nz], o1, o2, i1, i2] of sides) {
    quad(r(o1[0], o1[1]), r(o2[0], o2[1]), t(i2[0], i2[1]), t(i1[0], i1[1]), [nx, 0.7, nz], top, top, top, top);
    quad(g(o1[0], o1[1]), g(o2[0], o2[1]), r(o2[0], o2[1]), r(o1[0], o1[1]), [nx, 0, nz], dirt, dirt, side, side);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return geo;
}

/**
 * Raised grass blocks over the field (4-unit blocks, split into 2-unit ones near the lane, pads
 * and buildings), with a few height steps. Fills the HMAP height map. One instanced mesh.
 */
function buildTiles(rng) {
  const half = 56, T = 4, n = 28;
  const H = LEVEL.pathHalfWidth + 0.45 + 0.4;
  const blocked = (cx, cz, hs) => {
    if (distToPath(cx, cz) < H + hs * 1.42) return true;
    for (const [px, pz] of LEVEL.pads) if (Math.abs(px - cx) < LEVEL.padSize / 2 + 0.6 + hs && Math.abs(pz - cz) < LEVEL.padSize / 2 + 0.6 + hs) return true;
    const B = LEVEL.base;
    if (Math.abs(B.x - cx) < B.size / 2 + 1.4 + hs && Math.abs(B.z - cz) < B.size / 2 + 1.4 + hs) return true;
    if (Math.hypot(cx - LEVEL.portal.x, cz - LEVEL.portal.z) < 6.5 + hs) return true;
    if (Math.hypot(cx - LEVEL.pond.x, cz - LEVEL.pond.z) < LEVEL.pond.r + 0.9 + hs) return true;
    return false;
  };
  const heightAt = (cx, cz) => {
    const v = Math.sin(cx * 0.085 + Math.cos(cz * 0.07) * 1.7) * 0.5 + Math.sin(cz * 0.11 - cx * 0.05 + 1.3) * 0.5;
    return 0.26 + Math.round(clamp(v * 0.5 + 0.5, 0, 1) * 3) * 0.17;
  };
  const list = [];
  for (let gz = 0; gz < n; gz++)
    for (let gx = 0; gx < n; gx++) {
      const x0 = -half + gx * T, z0 = -half + gz * T;
      if (!blocked(x0 + 2, z0 + 2, 2)) {
        list.push([x0 + 2, z0 + 2, 4, heightAt(x0 + 2, z0 + 2)]);
        continue;
      }
      for (const [ox, oz] of [[1, 1], [3, 1], [1, 3], [3, 3]]) {
        const sx = x0 + ox, sz = z0 + oz;
        if (!blocked(sx, sz, 1)) list.push([sx, sz, 2, heightAt(sx, sz)]);
      }
    }
  HMAP.h.fill(0);
  for (const [cx, cz, s, h] of list) {
    const i0 = Math.round((cx - s / 2 + HMAP.half) / HMAP.cell);
    const j0 = Math.round((cz - s / 2 + HMAP.half) / HMAP.cell);
    for (let j = j0; j < j0 + s / HMAP.cell; j++)
      for (let i = i0; i < i0 + s / HMAP.cell; i++) if (i >= 0 && j >= 0 && i < HMAP.n && j < HMAP.n) HMAP.h[j * HMAP.n + i] = h;
  }
  const mesh = new THREE.InstancedMesh(bevelBlockGeometry(), ART.mats.vc, list.length);
  const m = TMP.m1;
  list.forEach(([cx, cz, s, h], k) => {
    m.compose(TMP.v1.set(cx, 0, cz), TMP.q2.identity(), TMP.s1.set(s - 0.12, h, s - 0.12));
    mesh.setMatrixAt(k, m);
    // Patchy greens: mostly the base grass, some deeper, some sunnier tiles.
    const b = 0.86 + rng.next() * 0.16;
    const r = rng.next();
    if (r < 0.22) mesh.setColorAt(k, TMP.c1.setRGB(b * 0.78, b * 0.9, b * 0.78));
    else if (r < 0.36) mesh.setColorAt(k, TMP.c1.setRGB(b * 1.06, b * 1.02, b * 0.8));
    else mesh.setColorAt(k, TMP.c1.setRGB(b, b * 0.99, b * 0.93));
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  mesh.userData.count = list.length;
  return mesh;
}

/** Ground height: flat in the playable area, rolling hills outside it. */
function terrainHeight(x, z) {
  const e = Math.max(Math.abs(x), Math.abs(z)) - 58;
  if (e <= 0) return 0;
  const k = Math.min(1, e / 25);
  return k * k * (4 + Math.sin(x * 0.11) * 2.2 + Math.cos(z * 0.09) * 2.4 + Math.sin((x + z) * 0.05) * 3);
}

function buildTerrain() {
  const P = CONFIG.palette;
  const size = 300;
  const seg = 90;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.getAttribute('position');
  const cols = new Float32Array(pos.count * 3);
  const g1 = color(P.grass), g2 = color(P.grassPatch), g3 = color(P.grassFar);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainHeight(x, z) - 0.02);
    // Patches of lighter and darker grass from a couple of sine waves.
    const n = Math.sin(x * 0.13 + Math.cos(z * 0.07) * 2) * 0.5 + Math.sin(z * 0.11 - x * 0.05) * 0.5;
    c.copy(g1).lerp(g2, clamp(n * 0.6 + 0.2, 0, 1));
    const far = clamp((Math.max(Math.abs(x), Math.abs(z)) - 58) / 30, 0, 1);
    c.lerp(g3, far);
    cols[i * 3] = c.r;
    cols[i * 3 + 1] = c.g;
    cols[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: ART.gradient, map: ART.tex.stripes });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  return mesh;
}

/** The lane: a darker border strip and a raised sandy ribbon on top, one merged mesh. */
function buildPathMesh() {
  const P = CONFIG.palette;
  const strip = (half, y, hex) => {
    const { xz, count } = PATH;
    const pos = [];
    const col = [];
    const nor = [];
    const uv = [];
    const c = color(hex);
    for (let i = 0; i < count; i++) {
      const j = Math.min(count - 1, i + 1), k = Math.max(0, i - 1);
      let dx = xz[j * 2] - xz[k * 2], dz = xz[j * 2 + 1] - xz[k * 2 + 1];
      const l = Math.hypot(dx, dz) || 1;
      dx /= l;
      dz /= l;
      const nx = -dz, nz = dx;
      const x = xz[i * 2], z = xz[i * 2 + 1];
      pos.push(x + nx * half, y, z + nz * half, x - nx * half, y, z - nz * half);
      for (let q = 0; q < 2; q++) {
        col.push(c.r, c.g, c.b);
        nor.push(0, 1, 0);
      }
      uv.push(0, i / count, 1, i / count);
    }
    const idx = [];
    for (let i = 0; i < count - 1; i++) {
      const a = i * 2, b2 = i * 2 + 1, c2 = i * 2 + 2, d = i * 2 + 3;
      idx.push(a, c2, b2, b2, c2, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    return g.toNonIndexed();
  };
  // Round end caps so the lane doesn't end in a hard edge.
  const cap = (x, z, r, y, hex) => {
    const g = new THREE.CircleGeometry(r, 20);
    g.rotateX(-Math.PI / 2);
    g.translate(x, y, z);
    const n = g.getAttribute('position').count;
    const c = color(hex);
    const cols = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) cols.set([c.r, c.g, c.b], i * 3);
    g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    return g.toNonIndexed();
  };
  const H = LEVEL.pathHalfWidth;
  const last = PATH.count - 1;
  const parts = [
    strip(H + 0.45, 0.035, P.pathBorder),
    strip(H, 0.07, P.path),
    cap(PATH.xz[0], PATH.xz[1], H + 0.45, 0.034, P.pathBorder),
    cap(PATH.xz[last * 2], PATH.xz[last * 2 + 1], H + 0.45, 0.034, P.pathBorder),
  ];
  const g = BufferGeometryUtils.mergeGeometries(parts, false);
  for (const p of parts) p.dispose();
  const mesh = new THREE.Mesh(g, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: ART.gradient }));
  mesh.receiveShadow = true;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  return mesh;
}

function buildPadsGeometry() {
  const P = CONFIG.palette;
  const b = new GeoBuilder();
  const s = LEVEL.padSize;
  for (const [x, z] of LEVEL.pads) {
    b.add(rbox(s + 0.35, 0.18, s + 0.35, 0.08), P.padOutline, x, 0.09, z);
    b.add(rbox(s, 0.34, s, 0.14), P.pad, x, 0.2, z);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) b.add(new THREE.CylinderGeometry(0.16, 0.16, 0.12, 8), P.padStud, x + sx * (s / 2 - 0.4), 0.42, z + sz * (s / 2 - 0.4));
  }
  return b.build();
}

/** Gradient sky dome (vertex colours on a big sphere, drawn behind everything). */
function buildSky() {
  const g = new THREE.SphereGeometry(500, 24, 12);
  const pos = g.getAttribute('position');
  const cols = new Float32Array(pos.count * 3);
  const top = color(CONFIG.palette.skyTop), hor = color(CONFIG.palette.skyHorizon), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = clamp(pos.getY(i) / 500, 0, 1);
    c.copy(hor).lerp(top, Math.pow(t, 0.6));
    cols.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -10;
  return m;
}

function buildPortal() {
  const P = CONFIG.palette;
  const group = new THREE.Group();
  group.position.set(LEVEL.portal.x, 0, LEVEL.portal.z);
  group.rotation.y = Math.PI / 2;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.42, 12, 36), toon(P.portal, { emissive: P.portal, ei: 1.4 }));
  ring.position.y = 3.0;
  group.add(ring);
  addOutline(ring);
  const swirlMat = new THREE.ShaderMaterial({
    uniforms: { uTime: ART.time },
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform float uTime; varying vec2 vUv;
      void main(){
        vec2 p = vUv - 0.5; float r = length(p) * 2.0; float a = atan(p.y, p.x);
        float s = sin(a * 4.0 + r * 10.0 - uTime * 4.0) * 0.5 + 0.5;
        vec3 c = mix(vec3(0.55, 0.05, 0.6), vec3(1.0, 0.35, 0.9), s);
        c = mix(c, vec3(1.0, 0.9, 1.0), smoothstep(0.35, 0.0, r) * 0.7);
        gl_FragColor = vec4(c * 1.6, smoothstep(1.0, 0.85, r));
      }`,
  });
  const disc = new THREE.Mesh(new THREE.CircleGeometry(2.4, 36), swirlMat);
  disc.position.y = 3.0;
  group.add(disc);
  const plinth = new THREE.Mesh(rbox(3.4, 0.5, 6.6, 0.18), toon(0x8b8fa3));
  plinth.position.y = 0.25;
  group.add(plinth);
  addOutline(plinth);
  for (const s of [-1, 1]) {
    const pillar = new THREE.Mesh(rbox(0.9, 3.2, 0.9, 0.16), toon(0x9ea3b8));
    pillar.position.set(0, 1.9, s * 2.9);
    group.add(pillar);
    addOutline(pillar);
  }
  return { group, ring };
}

function buildPond() {
  const pd = LEVEL.pond;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: ART.time },
    transparent: true,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform float uTime; varying vec2 vUv;
      void main(){
        vec2 p = (vUv - 0.5) * 2.0; float r = length(p);
        float w = sin(r * 22.0 - uTime * 2.0) * 0.5 + 0.5;
        vec3 deep = vec3(0.16, 0.55, 0.78), shallow = vec3(0.42, 0.85, 0.98);
        vec3 c = mix(deep, shallow, smoothstep(0.2, 1.0, r));
        c += step(0.93, w) * 0.12 * (1.0 - r);
        gl_FragColor = vec4(c, 0.92);
      }`,
  });
  const m = new THREE.Mesh(new THREE.CircleGeometry(pd.r, 36), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(pd.x, 0.04, pd.z);
  return m;
}

/** Grass tufts and flowers, instanced, with wind. Never on the lane, pads or buildings. */
function buildGrass(count, rng) {
  const P = CONFIG.palette;
  const blades = new GeoBuilder();
  for (let k = 0; k < 2; k++) {
    const g = new THREE.ConeGeometry(0.07, 0.55, 3);
    g.translate(0, 0.27, 0);
    blades.add(g, k === 1 ? 0x8fd862 : 0x6cbf47, (k - 1) * 0.1, 0, (k % 2) * 0.06, 0, k * 1.2, (k - 1) * 0.25);
  }
  const tuft = blades.build();
  const flowerG = new GeoBuilder()
    .add(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 4).translate(0, 0.2, 0), 0x4f9a33)
    .add(new THREE.IcosahedronGeometry(0.11, 0).translate(0, 0.42, 0), 0xffffff)
    .build();
  const mat = swayMaterial(new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: ART.gradient }));
  const grass = new THREE.InstancedMesh(tuft, mat, count);
  const nFlowers = Math.floor(count / 6);
  const flowers = new THREE.InstancedMesh(flowerG, mat, nFlowers);
  const fcols = [0xff6b9a, 0xffd34e, 0xffffff, 0xb28dff, 0xff8a3d];
  let gi = 0, fi = 0;
  const m = TMP.m1;
  for (let tries = 0; tries < count * 6 && (gi < count || fi < nFlowers); tries++) {
    const x = rng.range(-57, 57);
    const z = rng.range(-57, 57);
    if (distToPath(x, z) < LEVEL.pathHalfWidth + 1) continue;
    let bad = false;
    for (const [px, pz] of LEVEL.pads) if (Math.abs(px - x) < 3 && Math.abs(pz - z) < 3) bad = true;
    const B = LEVEL.base;
    if (Math.abs(x - B.x) < B.size / 2 + 1.5 && Math.abs(z - B.z) < B.size / 2 + 1.5) bad = true;
    if (Math.hypot(x - LEVEL.pond.x, z - LEVEL.pond.z) < LEVEL.pond.r + 0.8) bad = true;
    if (bad) continue;
    const s = rng.range(0.8, 1.4);
    TMP.q1.setFromAxisAngle(TMP.up, rng.next() * TAU);
    m.compose(TMP.v1.set(x, groundHeight(x, z), z), TMP.q1, TMP.s1.set(s, s, s));
    if (fi < nFlowers && rng.next() < 0.18) {
      flowers.setMatrixAt(fi, m);
      flowers.setColorAt(fi, TMP.c1.set(rng.pick(fcols)));
      fi++;
    } else if (gi < count) {
      grass.setMatrixAt(gi, m);
      gi++;
    }
  }
  grass.count = gi;
  flowers.count = fi;
  for (const im of [grass, flowers]) {
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;
  }
  void P;
  return { grass, flowers };
}

/** A flat ring with a soft gradient fill and a crisp edge (tower range indicators). */
function rangeRingMaterial(hex) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: color(hex) }, uTime: ART.time, uAlpha: { value: 1 } },
    transparent: true,
    depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 uColor; uniform float uTime; uniform float uAlpha; varying vec2 vUv;
      void main(){
        float r = length(vUv - 0.5) * 2.0;
        float fill = smoothstep(0.0, 1.0, r) * 0.22;
        float edge = smoothstep(0.93, 0.965, r) * (1.0 - smoothstep(0.985, 1.0, r));
        float a = (fill + edge * 0.95) * uAlpha;
        if (r > 1.0) discard;
        gl_FragColor = vec4(uColor, a);
      }`,
  });
}

// ---- 04-entities.js ----
// =============================================================================================
// Entities — Player, Enemy, Tower, projectiles, coins, particles and their renderers. Game
// logic lives in the systems; here are the data shapes, the pools and the code that writes
// them into instanced meshes once per rendered frame. Nothing here allocates per frame.
// =============================================================================================

/** The game: one object holding the scene and the whole run's state. Built in main. */
const G = {
  renderer: null, scene: null, camera: null, composer: null, bloomPass: null,
  sun: null, hemi: null,
  state: 'loading', // loading | menu | build | wave | paused | gameover | victory
  prevState: 'build',
  mode: 'play', // play | build (camera mode)
  bus: new EventBus(),
  rng: makeRng(1),
  time: 0, simTime: 0, speed: 1, slowMo: 0,
  money: 0, baseHp: 0, wave: 0, countdown: 0,
  stats: { kills: 0, towersBuilt: 0, moneyEarned: 0, coins: 0, startTime: 0, endTime: 0 },
  player: null,
  enemies: null, enemyHash: new SpatialHash(8, 64),
  towers: [], padTower: [],
  colliders: [],
  spawnQueue: [], waveTime: 0, waveActive: false,
  fx: {},
  tier: 'medium', renderScale: 1,
  settings: null,
  input: null,
  ui: null,
  static: {},
  shake: { t: 0, dur: 0, amp: 0 },
  selectedTower: null, ghost: null, placing: null,
};

// ---- Player ---------------------------------------------------------------------------------

function createPlayer() {
  const rig = buildPlayerRig();
  G.scene.add(rig.root);
  return {
    rig, x: 0, z: 0, y: 0, vx: 0, vz: 0, yaw: 0, aimYaw: 0, pitch: 0.28,
    hp: CONFIG.player.hp, alive: true, deathT: 0, respawnT: 0,
    ammo: CONFIG.player.gun.mag, reloading: false, reloadT: 0, fireCd: 0,
    dashCd: 0, dashT: 0, dashX: 0, dashZ: 1, invulnT: 0, flashT: 0, walkPhase: 0, recoilT: 0, speedNow: 0,
    firing: false, interactT: 0, interactTower: null, aimVert: 0, muzzleT: 0, y: 0,
  };
}

function resetPlayer(p) {
  p.x = LEVEL.playerSpawn.x;
  p.z = LEVEL.playerSpawn.z;
  p.vx = p.vz = 0;
  p.yaw = p.aimYaw = Math.PI; // facing -z... the lane comes from the left
  p.aimYaw = -Math.PI / 2;
  p.yaw = -Math.PI / 2;
  p.pitch = 0.28;
  p.hp = CONFIG.player.hp;
  p.alive = true;
  p.deathT = p.respawnT = 0;
  p.ammo = CONFIG.player.gun.mag;
  p.reloading = false;
  p.reloadT = p.fireCd = p.dashCd = p.dashT = p.invulnT = p.flashT = p.recoilT = 0;
  p.interactT = 0;
  p.interactTower = null;
  p.rig.root.rotation.set(0, 0, 0);
  p.rig.root.visible = true;
}

/** Procedural animation of the blocky rig from the player's state. */
function animatePlayer(p, dt) {
  const r = p.rig;
  r.root.position.set(p.x, p.y, p.z);
  r.root.rotation.y = p.yaw;
  const sp = p.speedNow / CONFIG.player.speed;
  p.walkPhase += dt * (4 + sp * 9);
  const swing = Math.sin(p.walkPhase) * 0.9 * clamp(sp, 0, 1.2);
  r.legL.rotation.x = swing;
  r.legR.rotation.x = -swing;
  r.armL.rotation.x = -swing * 0.8;
  // Aim pose: right arm up and forward while shooting, with recoil.
  const aiming = p.firing || p.recoilT > 0 || G.mode === 'play';
  const recoil = p.recoilT > 0 ? p.recoilT / 0.08 : 0;
  r.armR.rotation.x = aiming ? -Math.PI / 2 + 0.05 + recoil * 0.25 - p.aimVert : swing * 0.8;
  r.armR.rotation.z = aiming ? 0.12 : 0;
  r.armL.rotation.z = 0;
  // Breathing when idle, lean when running, stretch during a dash.
  const breathe = Math.sin(G.time * 2.2) * 0.02 * (1 - clamp(sp, 0, 1));
  const dashK = p.dashT > 0 ? 1 : 0;
  r.body.scale.set(1 - dashK * 0.12, 1 + breathe + dashK * 0.12, 1 + dashK * 0.25);
  r.hips.rotation.x = clamp(sp, 0, 1.3) * 0.18 + dashK * 0.3;
  r.body.position.y = Math.abs(Math.sin(p.walkPhase)) * 0.08 * clamp(sp, 0, 1);
  r.headPivot.rotation.x = -p.aimVert * 0.4;
  // Death: tip over.
  if (!p.alive) {
    const k = clamp(p.deathT / CONFIG.player.deathAnim, 0, 1);
    r.root.rotation.x = -ease.outCubic(k) * Math.PI / 2;
  } else r.root.rotation.x = 0;
  // Hit flash: tint all parts white briefly.
  const flash = p.flashT > 0;
  if (flash !== r.flashing) {
    r.flashing = flash;
    r.root.traverse((o) => {
      if (o.isMesh && o.material && o.material.isMeshToonMaterial && o.name !== 'outline') {
        if (!o.userData.mat) o.userData.mat = o.material;
        o.material = flash ? ART.mats.flashWhite : o.userData.mat;
      }
    });
  }
  r.flash.visible = p.muzzleT > 0;
  if (r.flash.visible) r.flash.material.rotation = G.time * 30;
}

// ---- Enemies --------------------------------------------------------------------------------

function createEnemyPool() {
  const size = CONFIG.pools.enemiesPerType * CONFIG.enemyOrder.length;
  return new Pool(size, (i) => ({
    id: i, type: 'grunt', def: null, hp: 1, maxHp: 1, shield: 0, maxShield: 0, shieldT: 0,
    speed: 1, d: 0, x: 0, z: 0, y: 0, yaw: 0, state: 'path', smashT: 0, smashTarget: null, smashCd: 0,
    meleeCd: 0, fireCd: 0, slowT: 0, slowAmt: 0, flashT: 0, dyingT: 0, walkPhase: 0, barShown: false,
    reward: 0, leak: 0, scale: 1, radius: 0.7, squashT: 0, shieldHitT: 0, stepT: 0, wave: 0, lastHitBy: null,
  }));
}

/** One instanced mesh (plus outline) per enemy type; limbs animate in the shader. */
function createEnemyRenderers() {
  const R = {};
  const n = CONFIG.pools.enemiesPerType;
  for (const type of CONFIG.enemyOrder) {
    const geo = buildEnemyGeometry(type);
    geo.setAttribute('aAnim', new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4));
    const mesh = new THREE.InstancedMesh(geo, ART.mats.enemyBody, n);
    mesh.castShadow = true;
    mesh.frustumCulled = false;
    const outline = new THREE.InstancedMesh(geo, ART.mats.enemyOutline, n);
    outline.frustumCulled = false;
    outline.instanceMatrix = mesh.instanceMatrix; // shared matrices
    for (let i = 0; i < n; i++) mesh.setColorAt(i, TMP.c1.setRGB(1, 1, 1));
    mesh.count = outline.count = 0;
    G.scene.add(mesh);
    G.scene.add(outline);
    R[type] = { mesh, outline, anim: geo.getAttribute('aAnim'), count: 0 };
  }
  // Shield bubbles for Shielded enemies (and a boss halo is not needed).
  const bubbleMat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: ART.tex.hex }, uTime: ART.time, uColor: { value: new THREE.Color(CONFIG.palette.shield) } },
    transparent: true,
    depthWrite: false,
    vertexShader: `varying vec2 vUv; varying vec3 vI; varying float vRim;
      void main(){
        vUv = uv;
        #ifdef USE_INSTANCING_COLOR
          vI = instanceColor;
        #else
          vI = vec3(1.0);
        #endif
        vec4 p = vec4(position, 1.0);
        #ifdef USE_INSTANCING
          p = instanceMatrix * p;
          vec3 n = normalize(normalMatrix * mat3(instanceMatrix) * normal);
        #else
          vec3 n = normalize(normalMatrix * normal);
        #endif
        vec4 mv = modelViewMatrix * p;
        vRim = 1.0 - abs(dot(n, normalize(-mv.xyz)));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform sampler2D uTex; uniform float uTime; uniform vec3 uColor; varying vec2 vUv; varying vec3 vI; varying float vRim;
      void main(){
        float hex = texture2D(uTex, vUv * vec2(4.0, 2.0) + vec2(uTime * 0.05, 0.0)).r;
        float rim = pow(vRim, 2.2);
        float flick = vI.g * (0.6 + 0.4 * sin(uTime * 60.0));
        float a = (0.12 + rim * 0.65 + hex * 0.22 + flick * 0.5) * vI.r;
        gl_FragColor = vec4(uColor * (1.2 + flick), a);
      }`,
  });
  const bubbleN = CONFIG.pools.enemiesPerType;
  const bubble = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 20, 14), bubbleMat, bubbleN);
  for (let i = 0; i < bubbleN; i++) bubble.setColorAt(i, TMP.c1.setRGB(1, 0, 0));
  bubble.count = 0;
  bubble.frustumCulled = false;
  bubble.renderOrder = 5;
  G.scene.add(bubble);
  R.bubble = bubble;
  return R;
}

/** Writes every live enemy into its type's instanced mesh. */
function renderEnemies(dt) {
  const R = G.fx.enemyR;
  for (const t of CONFIG.enemyOrder) R[t].count = 0;
  let bubbles = 0;
  const m = TMP.m1;
  for (const e of G.enemies.items) {
    if (!e.alive) continue;
    const r = R[e.type];
    const i = r.count++;
    if (i >= CONFIG.pools.enemiesPerType) {
      r.count--;
      continue;
    }
    // Squash on hit, stomp bob for brutes and bosses, hover bob for flyers.
    let sx = e.scale, sy = e.scale, sz = e.scale;
    if (e.squashT > 0) {
      const k = e.squashT / 0.12;

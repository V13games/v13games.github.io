      sx *= 1 + 0.12 * k;
      sz *= 1 + 0.12 * k;
      sy *= 1 - 0.14 * k;
    }
    let y = e.y;
    if (e.def.fly) y += Math.sin(G.time * 3 + e.id) * 0.25;
    else if (e.type === 'brute' || e.type === 'boss') y += Math.abs(Math.sin(e.walkPhase)) * 0.12 * e.scale;
    let yaw = e.yaw;
    let tilt = 0;
    if (e.state === 'dying') {
      const k = clamp(e.dyingT / CONFIG.enemyAI.deathTime, 0, 1);
      const s = 1 - ease.inCubic(k);
      sx *= s;
      sy *= s;
      sz *= s;
      yaw += k * 8;
    }
    if (e.state === 'smash') tilt = -Math.sin(clamp(e.smashT, 0, 1) * Math.PI) * 0.35;
    if (e.type === 'runner') tilt += 0.05;
    TMP.e1.set(tilt, yaw, 0, 'YXZ');
    TMP.q1.setFromEuler(TMP.e1);
    m.compose(TMP.v1.set(e.x, y, e.z), TMP.q1, TMP.s1.set(sx, sy, sz));
    r.mesh.setMatrixAt(i, m);
    // Colour: frosty when slowed. Flash: handled by the shader through aAnim.w.
    if (e.slowT > 0) r.mesh.setColorAt(i, TMP.c1.setRGB(0.62, 0.86, 1.25));
    else r.mesh.setColorAt(i, TMP.c1.setRGB(1, 1, 1));
    const a = r.anim.array;
    const moving = e.state === 'path' || e.state === 'chase' || e.state === 'return';
    a[i * 4] = e.walkPhase;
    a[i * 4 + 1] = moving ? (e.type === 'runner' ? 0.95 : e.type === 'brute' ? 0.45 : 0.7) : e.state === 'smash' ? 0.2 : 0.1;
    a[i * 4 + 2] = G.time * 18 + e.id;
    a[i * 4 + 3] = e.flashT > 0 ? 0.85 : 0;
    if (e.type === 'shielded' && e.shield > 0 && e.state !== 'dying' && bubbles < R.bubble.instanceMatrix.count) {
      const frac = e.shield / e.maxShield;
      const s = (1.25 + 0.35 * frac) * e.scale;
      m.compose(TMP.v1.set(e.x, y + 1.35 * e.scale, e.z), TMP.q2.identity(), TMP.s1.set(s, s * 1.15, s));
      R.bubble.setMatrixAt(bubbles, m);
      R.bubble.setColorAt(bubbles, TMP.c1.setRGB(0.35 + 0.65 * frac, e.shieldHitT > 0 ? 1 : 0, 0));
      bubbles++;
    }
  }
  for (const t of CONFIG.enemyOrder) {
    const r = R[t];
    r.mesh.count = r.outline.count = r.count;
    r.mesh.visible = r.count > 0;
    r.outline.visible = r.count > 0 && G.tierCfg.outlines;
    if (r.count > 0) {
      r.mesh.instanceMatrix.needsUpdate = true;
      r.mesh.instanceColor.needsUpdate = true;
      r.anim.needsUpdate = true;
    }
  }
  R.bubble.count = bubbles;
  R.bubble.visible = bubbles > 0;
  if (bubbles > 0) {
    R.bubble.instanceMatrix.needsUpdate = true;
    R.bubble.instanceColor.needsUpdate = true;
  }
  void dt;
}

// ---- Towers ---------------------------------------------------------------------------------

const TOWER_GEO = {};
function towerGeometry(type, level) {
  const key = `${type}:${level}`;
  if (!TOWER_GEO[key]) TOWER_GEO[key] = buildTowerGeometry(type, level);
  return TOWER_GEO[key];
}

function towerStats(type, level) {
  const T = CONFIG.towers[type];
  const U = CONFIG.upgrade;
  const k = level - 1;
  return {
    dmg: T.dmg * Math.pow(U.dmg, k),
    range: T.range * Math.pow(U.range, k),
    rate: T.rate * Math.pow(U.rate, k),
    ammo: Math.round(T.ammo * Math.pow(U.ammo, k)),
    hp: Math.round(T.hp * Math.pow(U.hp, k)),
  };
}

function upgradeCost(type, level) {
  if (level >= 3) return 0;
  return Math.round(CONFIG.towers[type].cost * CONFIG.upgrade.costs[level - 1]);
}

function createTower(type, pad) {
  const [x, z] = LEVEL.pads[pad];
  const t = {
    type, level: 1, pad, x, z, hp: 0, maxHp: 0, ammo: 0, maxAmmo: 0, cd: 0, target: null, mode: 0,
    yaw: Math.PI, aimYaw: Math.PI, recoil: 0, invested: CONFIG.towers[type].cost, dropT: 0.5, stats: null,
    buffRate: 0, buffRange: 0, muzzleT: 0, scan: Math.random() * TAU, smokeT: 0, barShown: false,
    group: new THREE.Group(), base: null, headPivot: new THREE.Group(), head: null, muzzle: new THREE.Vector3(), lowWarned: false,
  };
  t.group.position.set(x, 0.35, z);
  t.group.add(t.headPivot);
  G.scene.add(t.group);
  setTowerLevel(t, 1, true);
  t.ammo = t.maxAmmo;
  t.hp = t.maxHp;
  return t;
}

function setTowerLevel(t, level, fresh) {
  t.level = level;
  const geo = towerGeometry(t.type, level);
  const st = towerStats(t.type, level);
  const hpFrac = fresh ? 1 : t.hp / (t.maxHp || 1);
  const ammoFrac = fresh ? 1 : t.ammo / (t.maxAmmo || 1);
  t.stats = st;
  t.maxHp = st.hp;
  t.maxAmmo = st.ammo;
  t.hp = Math.round(st.hp * hpFrac);
  t.ammo = Math.round(st.ammo * ammoFrac);
  if (t.base) {
    t.group.remove(t.base);
    t.headPivot.remove(t.head);
  }
  t.base = new THREE.Mesh(geo.base, ART.mats.vc);
  t.base.castShadow = true;
  t.base.receiveShadow = true;
  const ob = addOutline(t.base);
  ob.visible = G.tierCfg.outlines;
  t.group.add(t.base);
  t.head = new THREE.Mesh(geo.head, ART.mats.vc);
  t.head.castShadow = true;
  const oh = addOutline(t.head);
  oh.visible = G.tierCfg.outlines;
  t.headPivot.position.y = geo.headY;
  t.headPivot.add(t.head);
  t.muzzle.copy(geo.muzzle);
  t.group.userData.tower = t;
  t.base.userData.tower = t;
  t.head.userData.tower = t;
}

function disposeTower(t) {
  G.scene.remove(t.group);
}

/** Per-frame visual update of a tower (turning head, recoil, drop-in). */
function animateTower(t, dt) {
  t.headPivot.rotation.y = t.yaw;
  t.head.position.z = -t.recoil * CONFIG.turret.recoil;
  if (t.type === 'pylon') {
    t.head.rotation.y += dt * 1.2;
    t.head.position.y = Math.sin(G.time * 2 + t.pad) * 0.12;
  }
  if (t.type === 'tesla') t.head.position.y = Math.sin(G.time * 3 + t.pad) * 0.05;
  if (t.dropT > 0) {
    // Drop in from above with squash and stretch.
    const k = 1 - t.dropT / 0.5;
    const fall = k < 0.6 ? 1 - ease.inCubic(k / 0.6) : 0;
    const squash = k >= 0.6 ? Math.sin(((k - 0.6) / 0.4) * Math.PI) * 0.25 : 0;
    t.group.position.y = 0.35 + fall * 6;
    t.group.scale.set(1 + squash, 1 - squash, 1 + squash);
  } else {
    t.group.position.y = 0.35;
    t.group.scale.set(1, 1, 1);
  }
  // Broken towers sag a little.
  t.headPivot.rotation.z = t.hp <= 0 ? 0.35 : 0;
}

// ---- Instanced effect renderers ------------------------------------------------------------

/**
 * A pool of simple instanced "things" (bolts, coins, particles, ...). Each live item writes a
 * matrix and a colour into the mesh once per frame.
 */
class InstancedSet {
  constructor(geo, mat, max, opts = {}) {
    this.mesh = new THREE.InstancedMesh(geo, mat, max);
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = !!opts.shadow;
    if (opts.renderOrder) this.mesh.renderOrder = opts.renderOrder;
    for (let i = 0; i < max; i++) this.mesh.setColorAt(i, TMP.c1.setRGB(1, 1, 1));
    this.mesh.count = 0;
    this.n = 0;
    this.max = max;
    G.scene.add(this.mesh);
  }
  begin() {
    this.n = 0;
  }
  push(m, r, g, b) {
    if (this.n >= this.max) return;
    this.mesh.setMatrixAt(this.n, m);
    if (r !== undefined) this.mesh.setColorAt(this.n, TMP.c2.setRGB(r, g, b));
    this.n++;
  }
  end() {
    this.mesh.count = this.n;
    this.mesh.visible = this.n > 0;
    if (this.n > 0) {
      this.mesh.instanceMatrix.needsUpdate = true;
      this.mesh.instanceColor.needsUpdate = true;
    }
  }
}

function createFx() {
  const P = CONFIG.palette;
  const fx = G.fx;
  const add = THREE.AdditiveBlending;
  fx.enemyR = createEnemyRenderers();
  // Bolts: stretched glowing spheres (player, blaster and enemy shots).
  fx.bolts = new Pool(CONFIG.pools.bolts, () => ({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, dmg: 0, from: null, enemy: false, r: 1, g: 1, b: 1, size: 1, target: null }));
  fx.boltSet = new InstancedSet(new THREE.SphereGeometry(0.16, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), CONFIG.pools.bolts + CONFIG.pools.enemyShots);
  // Mortar shells and their landing markers.
  fx.shells = new Pool(CONFIG.pools.shells, () => ({ sx: 0, sy: 0, sz: 0, tx: 0, tz: 0, t: 0, dur: 1, dmg: 0, splash: 4, tower: null, x: 0, y: 0, z: 0 }));
  fx.shellSet = new InstancedSet(new THREE.SphereGeometry(0.32, 10, 8), toon(0x2b2d42), CONFIG.pools.shells, { shadow: true });
  fx.markerSet = new InstancedSet(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: ART.tex.ring, transparent: true, depthWrite: false, color: 0xff4d5e }), CONFIG.pools.shells, { renderOrder: 2 });
  fx.scorch = new Pool(16, () => ({ x: 0, z: 0, t: 0, s: 1 }));
  fx.scorchSet = new InstancedSet(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: ART.tex.scorch, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }), 16, { renderOrder: 1 });
  // Flash spheres (explosions): additive, they fade by darkening.
  fx.flashes = new Pool(40, () => ({ x: 0, y: 0, z: 0, t: 0, dur: 0.3, r: 1, color: new THREE.Color() }));
  fx.flashSet = new InstancedSet(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshBasicMaterial({ blending: add, transparent: true, depthWrite: false, toneMapped: false }), 40, { renderOrder: 6 });
  // Soft glow halos around every bolt (cheap stand-in for bloom on Medium and Low).
  fx.haloSet = new InstancedSet(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: ART.tex.puff, transparent: true, depthWrite: false, blending: add, toneMapped: false }), CONFIG.pools.bolts + CONFIG.pools.enemyShots, { renderOrder: 8 });
  // Particles: little cubes.
  fx.particles = new Pool(600, () => ({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 1, size: 0.2, r: 1, g: 1, b: 1, grav: 9, drag: 0, spin: 0, glow: false }));
  fx.partSet = new InstancedSet(rbox(1, 1, 1, 0.15, 1), toon(0xffffff), 600);
  fx.glowSet = new InstancedSet(new THREE.OctahedronGeometry(0.6, 0), new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true, blending: add, depthWrite: false }), 300, { renderOrder: 6 });
  // Beams: tracers, lightning and pylon links (thin boxes between two points).
  fx.beams = new Pool(300, () => ({ x0: 0, y0: 0, z0: 0, x1: 0, y1: 0, z1: 0, t: 0, dur: 0.15, w: 0.08, r: 1, g: 1, b: 1, jag: 0, seed: 0 }));
  fx.beamSet = new InstancedSet(new THREE.BoxGeometry(1, 1, 1).translate(0, 0, 0.5), new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true, blending: add, depthWrite: false }), 900, { renderOrder: 7 });
  // Coins.
  fx.coins = new Pool(CONFIG.pools.coins, () => ({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, value: 1, life: 0, phase: 0, landed: false }));
  const coinGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.1, 16).rotateX(Math.PI / 2);
  fx.coinSet = new InstancedSet(coinGeo, toon(P.coin, { emissive: P.coin, ei: 0.55 }), CONFIG.pools.coins, { shadow: false });
  // Blob shadows under everything that moves.
  fx.shadowSet = new InstancedSet(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: ART.tex.blob, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 }), CONFIG.pools.shadows, { renderOrder: 1 });
  // Health bars: background and fill quads that always face the camera.
  const barGeo = new THREE.PlaneGeometry(1, 1);
  const fillGeo = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);
  fx.barBg = new InstancedSet(barGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true, opacity: 0.85, toneMapped: false }), CONFIG.pools.healthBars, { renderOrder: 20 });
  fx.barFill = new InstancedSet(fillGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true, toneMapped: false }), CONFIG.pools.healthBars, { renderOrder: 21 });
  // Ammo rings around tower bases.
  const ringMat = new THREE.ShaderMaterial({
    uniforms: { uTime: ART.time },
    transparent: true,
    depthWrite: false,
    vertexShader: `varying vec2 vUv; varying vec3 vI;
      void main(){
        vUv = uv;
        #ifdef USE_INSTANCING_COLOR
          vI = instanceColor;
        #else
          vI = vec3(1.0);
        #endif
        vec4 p = vec4(position, 1.0);
        #ifdef USE_INSTANCING
          p = instanceMatrix * p;
        #endif
        gl_Position = projectionMatrix * modelViewMatrix * p;
      }`,
    fragmentShader: `uniform float uTime; varying vec2 vUv; varying vec3 vI;
      void main(){
        vec2 p = vUv - 0.5; float r = length(p) * 2.0;
        if (r < 0.78 || r > 1.0) discard;
        float a = atan(p.x, -p.y) / 6.2831853 + 0.5;
        float fill = vI.r;
        vec3 full = mix(vec3(1.0, 0.3, 0.35), vec3(0.36, 1.0, 0.54), smoothstep(0.15, 0.5, fill));
        vec3 c = a < fill ? full : vec3(0.12, 0.14, 0.2);
        float alpha = 0.92;
        if (fill <= 0.001) { c = vec3(1.0, 0.3, 0.35); alpha = 0.5 + 0.5 * step(0.5, fract(uTime * 2.0)); }
        gl_FragColor = vec4(c, alpha);
      }`,
  });
  fx.ringSet = new InstancedSet(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), ringMat, 24, { renderOrder: 3 });
  // Muzzle flashes for towers.
  fx.muzzles = [];
  for (let i = 0; i < 10; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: ART.tex.flash, blending: add, depthWrite: false, transparent: true }));
    s.visible = false;
    s.userData.t = 0;
    G.scene.add(s);
    fx.muzzles.push(s);
  }
  // Range rings (selected tower / placement ghost / pylon aura).
  fx.range = new THREE.Mesh(new THREE.PlaneGeometry(2, 2).rotateX(-Math.PI / 2), rangeRingMaterial(P.range));
  fx.range.renderOrder = 4;
  fx.range.visible = false;
  G.scene.add(fx.range);
  fx.aura = new THREE.Mesh(new THREE.PlaneGeometry(2, 2).rotateX(-Math.PI / 2), rangeRingMaterial(P.pylon));
  fx.aura.renderOrder = 4;
  fx.aura.visible = false;
  G.scene.add(fx.aura);
}

/** Resets all effect pools at restart. */
function clearFx() {
  const fx = G.fx;
  for (const k of ['bolts', 'shells', 'scorch', 'flashes', 'particles', 'beams', 'coins']) fx[k].releaseAll();
  for (const s of fx.muzzles) s.visible = false;
}

// ---- Spawning effects (allocation-free) ------------------------------------------------------

function spawnParticles(n, x, y, z, hex, opts = {}) {
  const cap = G.tierCfg.particles;
  const c = TMP.c1.set(hex);
  for (let i = 0; i < n; i++) {
    if (G.fx.particles.used >= cap) return;
    const p = G.fx.particles.get();
    if (!p) return;
    const sp = opts.speed ?? 5;
    const a = Math.random() * TAU;
    const up = opts.up ?? 0.7;
    const h = Math.random();
    p.x = x + (Math.random() - 0.5) * (opts.spread ?? 0.4);
    p.y = y + (Math.random() - 0.5) * (opts.spread ?? 0.4) * 0.5;
    p.z = z + (Math.random() - 0.5) * (opts.spread ?? 0.4);
    p.vx = Math.cos(a) * sp * (0.4 + h * 0.6) + (opts.vx ?? 0);
    p.vz = Math.sin(a) * sp * (0.4 + h * 0.6) + (opts.vz ?? 0);
    p.vy = (opts.vy ?? 0) + sp * up * (0.5 + Math.random() * 0.8);
    p.max = p.life = (opts.life ?? 0.6) * (0.7 + Math.random() * 0.6);
    p.size = (opts.size ?? 0.22) * (0.6 + Math.random() * 0.8);
    p.r = c.r;
    p.g = c.g;
    p.b = c.b;
    p.grav = opts.grav ?? 14;
    p.drag = opts.drag ?? 1.5;
    p.spin = (Math.random() - 0.5) * 12;
    p.glow = !!opts.glow;
  }
}

function spawnFlash(x, y, z, r, hex, dur = 0.3) {
  const f = G.fx.flashes.get();
  if (!f) return;
  f.x = x;
  f.y = y;
  f.z = z;
  f.r = r;
  f.t = 0;
  f.dur = dur;
  f.color.set(hex);
}

function spawnBeam(x0, y0, z0, x1, y1, z1, hex, dur, w, jag = 0) {
  const b = G.fx.beams.get();
  if (!b) return null;
  b.x0 = x0; b.y0 = y0; b.z0 = z0; b.x1 = x1; b.y1 = y1; b.z1 = z1;
  b.t = 0;
  b.dur = dur;
  b.w = w;
  b.jag = jag;
  b.seed = Math.random() * 1000;
  const c = TMP.c1.set(hex);
  b.r = c.r;
  b.g = c.g;
  b.b = c.b;
  return b;
}

function spawnCoin(x, z, value) {
  const c = G.fx.coins.get();
  if (!c) return;
  const a = Math.random() * TAU;
  const s = 2 + Math.random() * 3;
  c.x = x;
  c.z = z;
  c.y = 1.2;
  c.vx = Math.cos(a) * s;
  c.vz = Math.sin(a) * s;
  c.vy = 5 + Math.random() * 2;
  c.value = value;
  c.life = CONFIG.coins.life;
  c.phase = Math.random() * TAU;
  c.landed = false;
}

function towerMuzzleFlash(t, scale = 1) {
  const s = G.fx.muzzles.find((m) => !m.visible) ?? G.fx.muzzles[0];
  t.head.updateWorldMatrix(true, false);
  s.position.copy(t.muzzle).applyMatrix4(t.head.matrixWorld);
  s.scale.setScalar(1.4 * scale);
  s.userData.t = CONFIG.fx.muzzleFlash * 1.6;
  s.visible = true;
}

// ---- Effect simulation and rendering (called every rendered frame) --------------------------

function updateEffects(dt, simDt) {
  const fx = G.fx;
  const m = TMP.m1;
  const cam = G.camera;
  // Particles.
  fx.partSet.begin();
  fx.glowSet.begin();
  for (const p of fx.particles.items) {
    if (!p.alive) continue;
    p.life -= simDt;
    if (p.life <= 0) {
      fx.particles.release(p);
      continue;
    }
    p.vy -= p.grav * simDt;
    const dr = Math.exp(-p.drag * simDt);
    p.vx *= dr;
    p.vz *= dr;
    p.x += p.vx * simDt;
    p.y += p.vy * simDt;
    p.z += p.vz * simDt;
    if (p.y < 0.08 && p.grav > 0) {
      p.y = 0.08;
      p.vy *= -0.35;
      p.vx *= 0.6;
      p.vz *= 0.6;
    }
    const k = p.life / p.max;
    const s = p.size * (p.glow ? k : Math.min(1, k * 2.2));
    TMP.e1.set(p.spin * k, p.spin * 0.7 * k, 0);
    TMP.q1.setFromEuler(TMP.e1);
    m.compose(TMP.v1.set(p.x, p.y, p.z), TMP.q1, TMP.s1.set(s, s, s));
    if (p.glow) fx.glowSet.push(m, p.r * k * 1.6, p.g * k * 1.6, p.b * k * 1.6);
    else fx.partSet.push(m, p.r, p.g, p.b);
  }
  fx.partSet.end();
  fx.glowSet.end();
  // Flash spheres.
  fx.flashSet.begin();
  for (const f of fx.flashes.items) {
    if (!f.alive) continue;
    f.t += simDt;
    if (f.t >= f.dur) {
      fx.flashes.release(f);
      continue;
    }
    const k = f.t / f.dur;
    const s = f.r * (0.4 + ease.outCubic(k) * 0.8);
    m.compose(TMP.v1.set(f.x, f.y, f.z), TMP.q2.identity(), TMP.s1.set(s, s, s));
    const a = (1 - k) * 1.4;
    fx.flashSet.push(m, f.color.r * a, f.color.g * a, f.color.b * a);
  }
  fx.flashSet.end();
  // Beams (lightning is re-randomised every frame).
  fx.beamSet.begin();
  for (const b of fx.beams.items) {
    if (!b.alive) continue;
    b.t += simDt;
    if (b.t >= b.dur) {
      fx.beams.release(b);
      continue;
    }
    const k = 1 - b.t / b.dur;
    if (b.jag > 0) {
      const steps = 6;
      let px = b.x0, py = b.y0, pz = b.z0;
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        let nx = b.x0 + (b.x1 - b.x0) * t;
        let ny = b.y0 + (b.y1 - b.y0) * t;
        let nz = b.z0 + (b.z1 - b.z0) * t;
        if (s < steps) {
          nx += (Math.random() - 0.5) * b.jag;
          ny += (Math.random() - 0.5) * b.jag;
          nz += (Math.random() - 0.5) * b.jag;
        }
        pushBeam(fx.beamSet, px, py, pz, nx, ny, nz, b.w, b.r * k * 1.8, b.g * k * 1.8, b.b * k * 1.8);
        px = nx; py = ny; pz = nz;
      }
    } else pushBeam(fx.beamSet, b.x0, b.y0, b.z0, b.x1, b.y1, b.z1, b.w * (0.4 + 0.6 * k), b.r * k * 1.6, b.g * k * 1.6, b.b * k * 1.6);
  }
  fx.beamSet.end();
  // Scorch marks fade (shrink) over time.
  fx.scorchSet.begin();
  for (const s of fx.scorch.items) {
    if (!s.alive) continue;
    s.t += simDt;
    if (s.t > CONFIG.fx.scorchTime) {
      fx.scorch.release(s);
      continue;
    }
    const k = 1 - s.t / CONFIG.fx.scorchTime;
    const sc = s.s * (0.6 + 0.4 * k);
    m.compose(TMP.v1.set(s.x, 0.1, s.z), TMP.q2.identity(), TMP.s1.set(sc, 1, sc));
    fx.scorchSet.push(m, 1, 1, 1);
  }
  fx.scorchSet.end();
  // Tower muzzle flashes.
  for (const s of fx.muzzles) {
    if (!s.visible) continue;
    s.userData.t -= dt;
    if (s.userData.t <= 0) s.visible = false;
    s.material.rotation = G.time * 25;
  }
  void cam;
}

function pushBeam(set, x0, y0, z0, x1, y1, z1, w, r, g, b) {
  const v = TMP.v2.set(x1 - x0, y1 - y0, z1 - z0);
  const len = v.length();
  if (len < 0.001) return;
  v.divideScalar(len);
  TMP.q1.setFromUnitVectors(TMP.v3.set(0, 0, 1), v);
  TMP.m1.compose(TMP.v1.set(x0, y0, z0), TMP.q1, TMP.s1.set(w, w, len));
  set.push(TMP.m1, r, g, b);
}

/** Bolts, shells, coins, shadows, health bars and ammo rings: written each rendered frame. */
function renderInstanced() {
  const fx = G.fx;
  const m = TMP.m1;
  const cam = G.camera;
  // Bolts: stretched along their velocity, each with a camera-facing glow.
  fx.boltSet.begin();
  fx.haloSet.begin();
  for (const b of fx.bolts.items) {
    if (!b.alive) continue;
    const v = TMP.v2.set(b.vx, b.vy, b.vz);
    const sp = v.length() || 1;
    v.divideScalar(sp);
    TMP.q1.setFromUnitVectors(TMP.v3.set(0, 0, 1), v);
    const stretch = b.enemy ? 1 : Math.min(4.5, 1 + sp * 0.06);
    m.compose(TMP.v1.set(b.x, b.y, b.z), TMP.q1, TMP.s1.set(b.size, b.size, b.size * stretch));
    fx.boltSet.push(m, b.r, b.g, b.b);
    const hs = b.size * (b.enemy ? 1.5 : 1.15);
    m.compose(TMP.v1.set(b.x, b.y, b.z), cam.quaternion, TMP.s1.set(hs, hs, hs));
    fx.haloSet.push(m, b.r * 0.42, b.g * 0.42, b.b * 0.42);
  }
  fx.boltSet.end();
  fx.haloSet.end();
  // Shells and their target markers.
  fx.shellSet.begin();
  fx.markerSet.begin();
  for (const s of fx.shells.items) {
    if (!s.alive) continue;
    m.compose(TMP.v1.set(s.x, s.y, s.z), TMP.q2.identity(), TMP.s1.set(1, 1, 1));
    fx.shellSet.push(m, 1, 1, 1);
    const k = 1 - s.t / s.dur;
    const ms = s.splash * 2 * (0.35 + 0.65 * k);
    m.compose(TMP.v1.set(s.tx, 0.12, s.tz), TMP.q2.identity(), TMP.s1.set(ms, 1, ms));
    fx.markerSet.push(m, 1, 1, 1);
  }
  fx.shellSet.end();
  fx.markerSet.end();
  // Coins: spin and bob, blink before vanishing.
  fx.coinSet.begin();
  for (const c of fx.coins.items) {
    if (!c.alive) continue;
    if (c.life < CONFIG.coins.blink && Math.floor(c.life * 8) % 2 === 0) continue;
    TMP.e1.set(0, G.time * 3 + c.phase, 0);
    TMP.q1.setFromEuler(TMP.e1);
    const y = c.y + (c.landed ? 0.35 + Math.sin(G.time * 3 + c.phase) * 0.15 : 0);
    m.compose(TMP.v1.set(c.x, y, c.z), TMP.q1, TMP.s1.set(1, 1, 1));
    fx.coinSet.push(m, 1, 1, 1);
  }
  fx.coinSet.end();
  // Blob shadows.
  fx.shadowSet.begin();
  const shadow = (x, z, s) => {
    m.compose(TMP.v1.set(x, groundHeight(x, z) + 0.11, z), TMP.q2.identity(), TMP.s1.set(s, 1, s));
    fx.shadowSet.push(m, 1, 1, 1);
  };
  const p = G.player;
  if (p.alive || p.deathT < 1.5) shadow(p.x, p.z, 1.9);
  for (const e of G.enemies.items) if (e.alive) shadow(e.x, e.z, e.radius * 2.6 * (e.state === 'dying' ? 1 - clamp(e.dyingT / 0.35, 0, 1) : 1));
  for (const c of fx.coins.items) if (c.alive) shadow(c.x, c.z, 0.8);
  for (const s of fx.shells.items) if (s.alive) shadow(s.x, s.z, 0.9);
  fx.shadowSet.end();
  // Health bars (enemies after their first hit, damaged towers).
  fx.barBg.begin();
  fx.barFill.begin();
  const q = cam.quaternion;
  const right = TMP.v4.set(1, 0, 0).applyQuaternion(q);
  const bar = (x, y, z, w, frac, shieldFrac) => {
    // Bars grow a little with distance so they stay readable far away.
    const far = clamp(cam.position.distanceTo(TMP.v1.set(x, y, z)) / 22, 1, 2.2);
    w *= far;
    m.compose(TMP.v1.set(x, y, z), q, TMP.s1.set(w + 0.14 * far, 0.36 * far, 1));
    fx.barBg.push(m, 0.08, 0.09, 0.14);
    const f = clamp(frac, 0, 1);
    const c = TMP.c1.setRGB(1, 0.3, 0.33).lerp(TMP.c2.setRGB(1, 0.85, 0.2), clamp(f * 2, 0, 1));
    if (f > 0.5) c.lerp(TMP.c2.setRGB(0.36, 1, 0.45), (f - 0.5) * 2);
    const r = c.r, g = c.g, b = c.b;
    TMP.v1.set(x, y, z).addScaledVector(right, -w / 2);
    m.compose(TMP.v1, q, TMP.s1.set(Math.max(0.001, w * f), 0.24 * far, 1));
    fx.barFill.push(m, r, g, b);
    if (shieldFrac > 0) {
      TMP.v1.set(x, y + 0.3 * far, z).addScaledVector(right, -w / 2);
      m.compose(TMP.v1, q, TMP.s1.set(Math.max(0.001, w * shieldFrac), 0.14 * far, 1));
      fx.barFill.push(m, 0.5, 0.86, 1);
    }
  };
  for (const e of G.enemies.items) {
    if (!e.alive || !e.barShown || e.state === 'dying') continue;
    const h = (e.def.fly ? e.def.fly + 1.4 : 2.9) * (e.type === 'boss' ? 1.05 : 1) * (e.def.fly ? 1 : e.scale);
    bar(e.x, e.y + h, e.z, e.type === 'boss' ? 3.4 : 1.5, e.hp / e.maxHp, e.maxShield > 0 ? e.shield / e.maxShield : 0);
  }
  for (const t of G.towers) if (t && t.hp < t.maxHp) bar(t.x, 4.6, t.z, 2.2, t.hp / t.maxHp, 0);
  fx.barBg.end();
  fx.barFill.end();
  // Ammo rings.
  fx.ringSet.begin();
  for (const t of G.towers) {
    if (!t || t.maxAmmo === 0) continue;
    m.compose(TMP.v1.set(t.x, 0.42, t.z), TMP.q2.identity(), TMP.s1.set(4.0, 1, 4.0));
    fx.ringSet.push(m, t.ammo / t.maxAmmo, 0, 0);
  }
  fx.ringSet.end();
}

// ---- Damage numbers (DOM, pooled) -----------------------------------------------------------

function createDamageNumbers(layer) {
  const pool = [];
  for (let i = 0; i < CONFIG.fx.damageNumbers; i++) {
    const el = document.createElement('div');
    el.className = 'dmg';
    el.style.display = 'none';
    layer.appendChild(el);
    pool.push({ el, alive: false, x: 0, y: 0, z: 0, t: 0, text: '', crit: false });
  }
  return pool;
}

function spawnDamageNumber(x, y, z, value, colorCss) {
  const pool = G.fx.dmg;
  let d = null;
  for (const it of pool) if (!it.alive) {
    d = it;
    break;
  }
  if (!d) d = pool.reduce((a, b) => (a.t > b.t ? a : b));
  d.alive = true;
  d.x = x + (Math.random() - 0.5) * 0.6;
  d.y = y;
  d.z = z + (Math.random() - 0.5) * 0.6;
  d.t = 0;
  const text = String(Math.round(value));
  if (d.text !== text) {
    d.text = text;
    d.el.textContent = text;
  }
  d.el.style.color = colorCss;
  d.el.style.display = 'block';
}

function updateDamageNumbers(dt) {
  const cam = G.camera;
  const w = G.ui.w;
  const h = G.ui.h;
  for (const d of G.fx.dmg) {
    if (!d.alive) continue;
    d.t += dt;
    if (d.t > 0.75) {
      d.alive = false;
      d.el.style.display = 'none';
      continue;
    }
    const v = TMP.v1.set(d.x, d.y + ease.outCubic(Math.min(1, d.t / 0.75)) * 1.2, d.z).project(cam);
    if (v.z > 1) {
      d.el.style.display = 'none';
      continue;
    }
    d.el.style.display = 'block';
    const sx = (v.x * 0.5 + 0.5) * w;
    const sy = (-v.y * 0.5 + 0.5) * h;
    const pop = d.t < 0.12 ? ease.outBack(d.t / 0.12) : 1;
    const op = d.t > 0.5 ? 1 - (d.t - 0.5) / 0.25 : 1;
    d.el.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) translate(-50%, -50%) scale(${pop.toFixed(2)})`;
    d.el.style.opacity = op.toFixed(2);
  }
}

// ---- 05-systems.js ----
// =============================================================================================
// Systems — waves, enemies, towers (targeting and combat), the player, projectiles, coins,
// economy, placement, collision, camera, audio and quality. `simStep(dt)` runs at a fixed
// 60 Hz (scaled by game speed); `frameUpdate(dt)` runs once per rendered frame.
// =============================================================================================

// ---- Economy --------------------------------------------------------------------------------

function earn(amount) {
  if (amount <= 0) return;
  G.money += amount;
  G.stats.moneyEarned += amount;
  G.bus.emit('money', amount);
}

function spend(amount) {
  if (G.money < amount) {
    toast('Not enough money');
    sfx('error');
    return false;
  }
  G.money -= amount;
  G.bus.emit('money', -amount);
  return true;
}

// ---- Waves ----------------------------------------------------------------------------------

function startBuildPhase() {
  G.state = 'build';
  G.countdown = G.wave === 0 ? CONFIG.economy.firstBuildPhase : CONFIG.economy.buildPhase;
  G.bus.emit('phase');
}

function startWave(early) {
  if (G.state !== 'build') return;
  if (early && G.countdown > 1) {
    const bonus = Math.floor(G.countdown) * CONFIG.economy.earlyBonusPerSec;
    earn(bonus);
    toast(`Early start bonus +$${bonus}`);
  }
  G.wave++;
  G.spawnQueue.length = 0;
  const groups = CONFIG.waves[G.wave - 1] ?? [];
  for (const gr of groups) for (let i = 0; i < gr.count; i++) G.spawnQueue.push({ t: gr.delay + i * gr.interval, type: gr.type });
  G.spawnQueue.sort((a, b) => b.t - a.t); // pop from the end = earliest first
  G.waveTime = 0;
  G.state = 'wave';
  const boss = CONFIG.bossWaves.includes(G.wave);
  G.bus.emit('waveStart', G.wave, boss);
  sfx(boss ? 'horn' : 'wave');
}

function waveProgress(dt) {
  if (G.state === 'build') {
    G.countdown -= dt;
    if (G.countdown <= 0) startWave(false);
    return;
  }
  if (G.state !== 'wave') return;
  G.waveTime += dt;
  while (G.spawnQueue.length > 0 && G.spawnQueue[G.spawnQueue.length - 1].t <= G.waveTime) {
    const s = G.spawnQueue.pop();
    spawnEnemy(s.type);
  }
  if (G.spawnQueue.length === 0) {
    let any = false;
    for (const e of G.enemies.items) if (e.alive && e.state !== 'dying') {
      any = true;
      break;
    }
    if (!any) {
      const bonus = CONFIG.economy.clearBonusBase + CONFIG.economy.clearBonusPerWave * G.wave;
      earn(bonus);
      G.bus.emit('waveClear', G.wave, bonus);
      if (G.wave >= CONFIG.waves.length) endGame(true);
      else startBuildPhase();
    }
  }
}

/** The next wave's composition, for the preview. */
function wavePreview(w) {
  const groups = CONFIG.waves[w - 1] ?? [];
  const counts = {};
  for (const g of groups) counts[g.type] = (counts[g.type] ?? 0) + g.count;
  return counts;
}

// ---- Enemies --------------------------------------------------------------------------------

function spawnEnemy(type) {
  const e = G.enemies.get();
  if (!e) return;
  const def = CONFIG.enemies[type];
  const w = G.wave;
  const S = CONFIG.scaling;
  // Bosses grow linearly only; everyone else also gets the squared term.
  let hpMul = 1 + S.linear * (w - 1) + (type === 'boss' ? 0 : S.square * (w - 1) * (w - 1));
  if (CONFIG.bossWaves.includes(w)) hpMul *= S.bossWave;
  if (type === 'boss' && w === CONFIG.waves.length) hpMul *= S.finalBossHp;
  e.type = type;
  e.def = def;
  e.maxHp = e.hp = Math.round(def.hp * hpMul);
  e.maxShield = e.shield = def.shield ? Math.round(def.shield * hpMul) : 0;
  e.shieldT = 0;
  e.speed = def.speed * (1 + S.speed * (w - 1));
  e.d = 0;
  pathAt(0, TMP.p);
  e.x = TMP.p.x;
  e.z = TMP.p.z;
  e.y = def.fly ?? 0;
  e.yaw = Math.atan2(TMP.p.dx, TMP.p.dz);
  e.state = 'path';
  e.smashT = 0;
  e.smashTarget = null;
  e.smashCd = 1;
  e.meleeCd = 0;
  e.fireCd = 1 + Math.random();
  e.slowT = 0;
  e.slowAmt = 0;
  e.flashT = 0;
  e.dyingT = 0;
  e.walkPhase = Math.random() * TAU;
  e.barShown = false;
  e.reward = Math.round(def.reward * (1 + S.reward * (w - 1)));
  e.leak = def.leak;
  e.scale = def.scale;
  e.radius = def.radius;
  e.squashT = 0;
  e.shieldHitT = 0;
  e.stepT = 0;
  e.wave = w;
  if (type === 'boss') G.bus.emit('boss');
  spawnParticles(10, e.x, 2.5, e.z, CONFIG.palette.portal, { glow: true, speed: 4, life: 0.5, grav: 0 });
}

function enemyCenterY(e) {
  return e.def.fly ? e.y : e.y + 1.25 * e.scale;
}

function updateEnemies(dt) {
  const AI = CONFIG.enemyAI;
  const p = G.player;
  const hash = G.enemyHash;
  hash.clear();
  for (const e of G.enemies.items) {
    if (!e.alive) continue;
    if (e.flashT > 0) e.flashT -= dt;
    if (e.squashT > 0) e.squashT -= dt;
    if (e.shieldHitT > 0) e.shieldHitT -= dt;
    if (e.state === 'dying') {
      e.dyingT += dt;
      if (e.dyingT >= AI.deathTime) G.enemies.release(e);
      continue;
    }
    // Shields come back after a few seconds without damage.
    if (e.maxShield > 0 && e.shield < e.maxShield) {
      e.shieldT += dt;
      if (e.shieldT >= e.def.shieldRegen) e.shield = Math.min(e.maxShield, e.shield + e.maxShield * 0.5 * dt);
    }
    let mul = 1;
    if (e.slowT > 0) {
      e.slowT -= dt;
      mul = 1 - e.slowAmt;
      if (e.def.minSlow) mul = Math.max(mul, e.def.minSlow);
    }
    const speed = e.speed * mul;
    e.walkPhase += dt * (3 + speed * 1.7) * (e.type === 'boss' ? 0.6 : 1);
    if (e.smashCd > 0) e.smashCd -= dt;
    if (e.meleeCd > 0) e.meleeCd -= dt;
    const pd = p.alive ? Math.hypot(p.x - e.x, p.z - e.z) : 1e9;
    switch (e.state) {
      case 'path': {
        e.d += speed * dt;
        if (e.d >= PATH.total) {
          leak(e);
          continue;
        }
        pathAt(e.d, TMP.p);
        e.x = TMP.p.x;
        e.z = TMP.p.z;
        e.yaw = dampAngle(e.yaw, Math.atan2(TMP.p.dx, TMP.p.dz), 10, dt);
        if (!e.def.fly) e.y = damp(e.y, 0, 12, dt);
        if (!e.def.fly && e.def.melee > 0 && pd < AI.aggroRange + e.radius && p.invulnT <= 0) e.state = 'chase';
        // Brutes and bosses stop to smash towers near the lane.
        if (e.def.smash && e.smashCd <= 0) {
          for (const t of G.towers) {
            if (!t || t.hp <= 0) continue;
            if (Math.hypot(t.x - e.x, t.z - e.z) < CONFIG.smashDistance * (e.type === 'boss' ? 1.15 : 1)) {
              e.state = 'smash';
              e.smashT = 0;
              e.smashTarget = t;
              break;
            }
          }
        }
        break;
      }
      case 'chase': {
        pathAt(e.d, TMP.p);
        const fromLane = Math.hypot(e.x - TMP.p.x, e.z - TMP.p.z);
        if (!p.alive || pd > AI.chaseRange || fromLane > AI.leash) {
          e.state = 'return';
          break;
        }
        if (pd > AI.meleeReach + e.radius * 0.5) {
          const dx = (p.x - e.x) / pd, dz = (p.z - e.z) / pd;
          e.x += dx * speed * 1.1 * dt;
          e.z += dz * speed * 1.1 * dt;
        } else if (e.meleeCd <= 0) {
          e.meleeCd = AI.meleeEvery;
          damagePlayer(e.def.melee);
          e.squashT = 0.12;
        }
        e.yaw = dampAngle(e.yaw, Math.atan2(p.x - e.x, p.z - e.z), 12, dt);
        e.y = damp(e.y, groundHeight(e.x, e.z), 14, dt);
        break;
      }
      case 'return': {
        pathAt(e.d, TMP.p);
        const dx = TMP.p.x - e.x, dz = TMP.p.z - e.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.3) {
          e.state = 'path';
          break;
        }
        e.x += (dx / d) * speed * dt;
        e.z += (dz / d) * speed * dt;
        e.y = damp(e.y, groundHeight(e.x, e.z), 14, dt);
        e.yaw = dampAngle(e.yaw, Math.atan2(dx, dz), 10, dt);
        if (p.alive && pd < AI.aggroRange && p.invulnT <= 0) e.state = 'chase';
        break;
      }
      case 'smash': {
        const t = e.smashTarget;
        if (t) e.yaw = dampAngle(e.yaw, Math.atan2(t.x - e.x, t.z - e.z), 10, dt);
        e.smashT += dt / AI.smashTime;
        if (e.smashT >= 1) {
          if (t && G.towers[t.pad] === t && t.hp > 0) {
            damageTower(t, e.def.smash);
            spawnParticles(14, (t.x + e.x) / 2, 0.5, (t.z + e.z) / 2, 0xd9c9a8, { speed: 5, life: 0.6, size: 0.35 });
            sfx('smash');
            if (e.type === 'boss') addShake(0.2, 0.3);
          }
          e.smashCd = AI.smashCooldown;
          e.smashTarget = null;
          e.state = 'path';
        }
        break;
      }
    }
    // Flyers keep their height and shoot slow, dodgeable shots at the player.
    if (e.def.fly) {
      e.y = e.def.fly;
      e.fireCd -= dt;
      if (p.alive && pd < AI.flyerRange && e.fireCd <= 0) {
        e.fireCd = AI.flyerFireEvery;
        fireEnemyShot(e);
      }
    }
    // Boss steps shake the camera.
    if (e.type === 'boss') {
      const s = Math.sin(e.walkPhase);
      if (e.stepT * s < 0 && (e.state === 'path' || e.state === 'chase')) {
        if (Math.hypot(G.camera.position.x - e.x, G.camera.position.z - e.z) < 45) addShake(0.12, 0.18);
        spawnParticles(4, e.x, 0.2, e.z, 0xd9c9a8, { speed: 3, life: 0.5, size: 0.4 });
      }
      e.stepT = s;
    }
    if (e.type === 'brute') {
      const s = Math.sin(e.walkPhase);
      if (e.stepT * s < 0 && e.state === 'path' && Math.random() < 0.5) spawnParticles(2, e.x, 0.15, e.z, 0xd9c9a8, { speed: 2, life: 0.45, size: 0.3 });
      e.stepT = s;
    }
    hash.insert(e, e.x, e.z);
  }
}

function leak(e) {
  G.baseHp = Math.max(0, G.baseHp - e.leak);
  G.enemies.release(e);
  addShake(CONFIG.fx.shakeBase.time, CONFIG.fx.shakeBase.amp);
  spawnFlash(LEVEL.base.x, 3, LEVEL.base.z, 4, 0xff4d5e, 0.35);
  sfx('boom');
  G.bus.emit('baseHit');
  if (G.baseHp <= 0) endGame(false);
}

/** Deals damage to an enemy. Shields absorb first (snipers pierce half). */
function damageEnemy(e, amount, opts) {
  if (!e.alive || e.state === 'dying' || amount <= 0) return;
  let d = amount;
  if (e.shield > 0) {
    const pierce = opts?.pierce ?? 0;
    const toShield = d * (1 - pierce);
    const absorbed = Math.min(e.shield, toShield);
    e.shield -= absorbed;
    d -= absorbed;
    e.shieldT = 0;
    e.shieldHitT = 0.15;
  }
  e.shieldT = 0;
  e.hp -= d;
  e.flashT = CONFIG.enemyAI.hitFlash;
  e.squashT = 0.12;
  e.barShown = true;
  if (amount >= 1) spawnDamageNumber(e.x, enemyCenterY(e) + 1.2 * e.scale, e.z, amount, opts?.player ? '#ffffff' : '#ffe48a');
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.state = 'dying';
  e.dyingT = 0;
  e.hp = 0;
  G.stats.kills++;
  earn(e.reward);
  // Coins worth 20% of the reward each, 1–3 of them, however it died.
  const n = CONFIG.coins.min + Math.floor(Math.random() * (CONFIG.coins.max - CONFIG.coins.min + 1));
  const value = Math.max(1, Math.round(e.reward * CONFIG.coins.share));
  for (let i = 0; i < n; i++) spawnCoin(e.x, e.z, value);
  const big = e.type === 'boss';
  spawnParticles(big ? 60 : 15 + Math.floor(Math.random() * 10), e.x, enemyCenterY(e), e.z, CONFIG.palette[e.type], { speed: big ? 12 : 6, life: big ? 1.2 : 0.7, size: big ? 0.5 : 0.26 });
  sfx(big ? 'bossDeath' : 'pop');
  if (big) {
    G.slowMo = CONFIG.fx.bossSlowMo;
    addShake(CONFIG.fx.shakeBoss.time, CONFIG.fx.shakeBoss.amp);
    spawnFlash(e.x, 3, e.z, 7, 0xffd34e, 0.5);
  }
  G.bus.emit('kill', e);
}

function fireEnemyShot(e) {
  const b = G.fx.bolts.get();
  if (!b) return;
  const p = G.player;
  const tx = p.x, ty = 1.2 + p.y, tz = p.z;
  const dx = tx - e.x, dy = ty - e.y, dz = tz - e.z;
  const d = Math.hypot(dx, dy, dz) || 1;
  const s = CONFIG.enemyAI.flyerShotSpeed;
  b.x = e.x; b.y = e.y; b.z = e.z;
  b.vx = (dx / d) * s; b.vy = (dy / d) * s; b.vz = (dz / d) * s;
  b.life = 3;
  b.dmg = CONFIG.enemyAI.flyerShotDamage;
  b.enemy = true;
  b.from = null;
  b.size = 1.6;
  const c = TMP.c1.set(CONFIG.palette.enemyShot);
  b.r = c.r * 1.5; b.g = c.g * 1.5; b.b = c.b * 1.5;
  sfx('enemyShot');
}

// ---- Towers ---------------------------------------------------------------------------------

function findTarget(t, range) {
  const list = G.enemyHash.query(t.x, t.z, range);
  const ground = CONFIG.towers[t.type].groundOnly;
  let best = null;
  let score = -Infinity;
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    if (!e.alive || e.state === 'dying') continue;
    if (ground && e.def.fly) continue;
    const d = Math.hypot(e.x - t.x, e.z - t.z);
    if (d > range) continue;
    let s;
    switch (t.mode) {
      case 1: s = -e.d; break; // last
      case 2: s = e.hp + e.shield; break; // strongest
      case 3: s = -d; break; // closest
      default: s = e.d; // first
    }
    if (s > score) {
      score = s;
      best = e;
    }
  }
  return best;
}

const TARGET_MODES = ['First', 'Last', 'Strongest', 'Closest'];

function updateTowers(dt) {
  for (const t of G.towers) if (t) {
    t.buffRate = 0;
    t.buffRange = 0;
  }
  // Pylons buff towers in their aura (the best buff counts, they don't stack).
  for (const py of G.towers) {
    if (!py || py.type !== 'pylon' || py.hp <= 0) continue;
    const r = py.stats.range;
    const T = CONFIG.towers.pylon;
    const lv = 1 + (py.level - 1) * 0.4;
    for (const t of G.towers) {
      if (!t || t === py || t.type === 'pylon') continue;
      if (Math.hypot(t.x - py.x, t.z - py.z) > r + 2) continue;
      t.buffRate = Math.max(t.buffRate, T.buffRate * lv);
      t.buffRange = Math.max(t.buffRange, T.buffRange * lv);
    }
    py.cd -= dt;
    if (py.cd <= 0) {
      py.cd = 0.5;
      for (const t of G.towers) {
        if (!t || t === py || t.type === 'pylon' || Math.hypot(t.x - py.x, t.z - py.z) > r + 2) continue;
        spawnBeam(py.x, 2.4, py.z, t.x, 2.0, t.z, CONFIG.palette.pylon, 0.55, 0.06);
      }
    }
  }
  for (const t of G.towers) {
    if (!t) continue;
    if (t.dropT > 0) t.dropT -= dt;
    if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 6);
    if (t.hp <= 0) {
      // Broken: smoking, not firing.
      t.smokeT -= dt;
      if (t.smokeT <= 0) {
        t.smokeT = 0.18;
        spawnParticles(1, t.x + (Math.random() - 0.5), 2.4, t.z + (Math.random() - 0.5), 0x555a66, { speed: 0.5, up: 3, life: 1.4, size: 0.5, grav: -1.5, drag: 0.5 });
      }
      continue;
    }
    if (t.type === 'pylon') continue;
    const range = t.stats.range * (1 + t.buffRange);
    const rate = t.stats.rate * (1 + t.buffRate);
    t.cd -= dt;
    if (!t.target || !t.target.alive || t.target.state === 'dying' || Math.hypot(t.target.x - t.x, t.target.z - t.z) > range || (t.targetCheck = (t.targetCheck ?? 0) - dt) <= 0) {
      t.target = findTarget(t, range);
      t.targetCheck = 0.15;
    }
    const e = t.target;
    if (e) {
      t.aimYaw = Math.atan2(e.x - t.x, e.z - t.z);
      t.yaw = dampAngle(t.yaw, t.aimYaw, CONFIG.turret.turnSpeed, dt);
      if (t.ammo > 0 && t.cd <= 0 && Math.abs(wrapAngle(t.yaw - t.aimYaw)) < 0.3) {
        t.cd = 1 / rate;
        t.ammo--;
        towerFire(t, e, range);
        if (t.ammo === 0) G.bus.emit('towerEmpty', t);
      }
    } else {
      // Idle: a slow scan back and forth.
      t.scan += dt * CONFIG.turret.scanSpeed;
      t.yaw = dampAngle(t.yaw, t.aimYaw + Math.sin(t.scan) * 0.9, 2, dt);
    }
  }
}

function muzzleWorld(t, out) {
  t.head.updateWorldMatrix(true, false);
  return out.copy(t.muzzle).applyMatrix4(t.head.matrixWorld);
}

function towerFire(t, e, range) {
  const st = t.stats;
  const P = CONFIG.palette;
  t.recoil = 1;
  const mz = muzzleWorld(t, TMP.v3);
  const ey = enemyCenterY(e);
  switch (t.type) {
    case 'blaster': {
      const b = G.fx.bolts.get();
      if (!b) break;
      // Lead the target a little so fast enemies don't outrun the bolt.
      const sp = CONFIG.towers.blaster.speed;
      const dist = Math.hypot(e.x - mz.x, e.z - mz.z);
      const tt = dist / sp;
      let tx = e.x, tz = e.z;
      if (e.state === 'path') {
        pathAt(e.d + e.speed * (e.slowT > 0 ? 1 - e.slowAmt : 1) * tt, TMP.p2);
        tx = TMP.p2.x;
        tz = TMP.p2.z;
      }
      const dx = tx - mz.x, dy = ey - mz.y, dz = tz - mz.z;
      const d = Math.hypot(dx, dy, dz) || 1;
      b.x = mz.x; b.y = mz.y; b.z = mz.z;
      b.vx = (dx / d) * sp; b.vy = (dy / d) * sp; b.vz = (dz / d) * sp;
      b.life = range / sp + 0.3;
      b.dmg = st.dmg;
      b.enemy = false;
      b.player = false;
      b.size = 1.1;
      b.target = e;
      b.r = 0.35 * 2; b.g = 0.85 * 2; b.b = 1.0 * 2;
      towerMuzzleFlash(t, 0.8);
      sfx('blaster');
      break;
    }
    case 'mortar': {
      const s = G.fx.shells.get();
      if (!s) break;
      const dur = CONFIG.towers.mortar.shellTime;
      let tx = e.x, tz = e.z;
      if (e.state === 'path') {
        pathAt(e.d + e.speed * (e.slowT > 0 ? 1 - e.slowAmt : 1) * dur, TMP.p2);
        tx = TMP.p2.x;
        tz = TMP.p2.z;
      }
      s.sx = mz.x; s.sy = mz.y; s.sz = mz.z;
      s.tx = tx; s.tz = tz;
      s.x = mz.x; s.y = mz.y; s.z = mz.z;
      s.t = 0;
      s.dur = dur;
      s.dmg = st.dmg;
      s.splash = CONFIG.towers.mortar.splash * (1 + (t.level - 1) * 0.1);
      s.tower = t;
      towerMuzzleFlash(t, 1.2);
      spawnParticles(5, mz.x, mz.y, mz.z, 0xcfd3dc, { speed: 2, up: 1.5, life: 0.7, size: 0.4, grav: -1 });
      sfx('mortar');
      break;
    }
    case 'sniper': {
      spawnBeam(mz.x, mz.y, mz.z, e.x, ey, e.z, 0xfff1a8, CONFIG.fx.tracerTime, 0.1);
      damageEnemy(e, st.dmg, { pierce: CONFIG.towers.sniper.shieldPierce });
      towerMuzzleFlash(t, 1.1);
      sfx('sniper');
      break;
    }
    case 'frost': {
      const cone = (CONFIG.towers.frost.cone * Math.PI) / 180 / 2;
      const list = G.enemyHash.query(t.x, t.z, range);
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        if (!o.alive || o.state === 'dying') continue;
        const dx = o.x - t.x, dz = o.z - t.z;
        const d = Math.hypot(dx, dz);
        if (d > range) continue;
        if (Math.abs(wrapAngle(Math.atan2(dx, dz) - t.yaw)) > cone && d > 2) continue;
        damageEnemy(o, st.dmg, null);
        o.slowT = CONFIG.towers.frost.slowTime;
        o.slowAmt = CONFIG.towers.frost.slow + (t.level - 1) * 0.05;
      }
      // A cone of icy particles.
      for (let k = 0; k < 14; k++) {
        const a = t.yaw + (Math.random() - 0.5) * cone * 2;
        const sp = range * (0.9 + Math.random() * 0.5);
        spawnParticles(1, mz.x, mz.y, mz.z, k % 3 ? P.frost : 0xffffff, { speed: 0, life: 0.65, size: 0.25, grav: 1, drag: 1.2, vx: Math.sin(a) * sp, vz: Math.cos(a) * sp, vy: 0.4, glow: k % 2 === 0 });
      }
      sfx('frost');
      break;
    }
    case 'tesla': {
      const hit = TESLA_HIT;
      hit.length = 0;
      let cur = e;
      let fx = mz.x, fy = mz.y, fz = mz.z;
      for (let k = 0; k <= CONFIG.towers.tesla.bounces && cur; k++) {
        const cy = enemyCenterY(cur);
        spawnBeam(fx, fy, fz, cur.x, cy, cur.z, P.tesla, CONFIG.fx.lightningTime, 0.09, 0.9);
        damageEnemy(cur, st.dmg * (k === 0 ? 1 : 0.8), null);
        spawnParticles(3, cur.x, cy, cur.z, P.tesla, { speed: 4, life: 0.3, size: 0.18, glow: true, grav: 0 });
        hit.push(cur);
        fx = cur.x; fy = cy; fz = cur.z;
        // Next: the nearest enemy not hit yet.
        const list = G.enemyHash.query(cur.x, cur.z, CONFIG.towers.tesla.bounceRange);
        let next = null, nd = Infinity;
        for (let i = 0; i < list.length; i++) {
          const o = list[i];
          if (!o.alive || o.state === 'dying' || hit.includes(o)) continue;
          const d = Math.hypot(o.x - cur.x, o.z - cur.z);
          if (d < CONFIG.towers.tesla.bounceRange && d < nd) {
            nd = d;
            next = o;
          }
        }
        cur = next;
      }
      sfx('tesla');
      break;
    }
  }
  G.bus.emit('towerFire', t);
}
const TESLA_HIT = [];

function damageTower(t, amount) {
  t.hp = Math.max(0, t.hp - amount);
  if (t.hp <= 0) {
    G.bus.emit('towerBroken', t);
    toast(`${CONFIG.towers[t.type].name} broken! Walk over and repair it`);
  }
}

// ---- Projectiles ------------------------------------------------------------------------------

function updateProjectiles(dt) {
  const fx = G.fx;
  const p = G.player;
  for (const b of fx.bolts.items) {
    if (!b.alive) continue;
    b.life -= dt;
    const ox = b.x, oz = b.z;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    if (b.life <= 0 || b.y < 0) {
      if (b.y < 0.2 && !b.enemy) spawnParticles(2, b.x, 0.2, b.z, 0xe8c07d, { speed: 2, life: 0.3, size: 0.12 });
      fx.bolts.release(b);
      continue;
    }
    if (b.enemy) {
      if (p.alive && Math.hypot(b.x - p.x, b.z - p.z) < 0.8 && b.y < 2.4 + p.y) {
        damagePlayer(b.dmg);
        spawnParticles(6, b.x, b.y, b.z, CONFIG.palette.enemyShot, { glow: true, speed: 3, life: 0.3, grav: 0 });
        fx.bolts.release(b);
      }
      continue;
    }
    // Swept hit test against nearby enemies (a vertical capsule each).
    const list = G.enemyHash.query(b.x, b.z, 3);
    let hit = null;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive || e.state === 'dying') continue;
      const cy = enemyCenterY(e);
      const hh = e.def.fly ? 0.9 : 1.3 * e.scale;
      if (b.y < cy - hh || b.y > cy + hh + 0.4) continue;
      // Closest point on the bolt's step to the enemy's axis.
      const vx = b.x - ox, vz = b.z - oz;
      const l2 = vx * vx + vz * vz || 1;
      let tt = ((e.x - ox) * vx + (e.z - oz) * vz) / l2;
      tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
      const cx = ox + vx * tt - e.x, cz = oz + vz * tt - e.z;
      if (cx * cx + cz * cz < (e.radius + 0.25) * (e.radius + 0.25)) {
        hit = e;
        break;
      }
    }
    if (hit) {
      damageEnemy(hit, b.dmg, { player: b.player });
      spawnFlash(b.x, b.y, b.z, 0.5, b.player ? 0xfff1a8 : 0x8fe9ff, 0.12);
      spawnParticles(4, b.x, b.y, b.z, b.player ? 0xfff1a8 : 0x8fe9ff, { glow: true, speed: 4, life: 0.25, grav: 0, size: 0.18 });
      if (b.player) sfx('hit');
      fx.bolts.release(b);
    }
  }
  // Mortar shells: a parabola from muzzle to target; splash on landing (ground enemies only).
  for (const s of fx.shells.items) {
    if (!s.alive) continue;
    s.t += dt;
    const k = Math.min(1, s.t / s.dur);
    s.x = lerp(s.sx, s.tx, k);
    s.z = lerp(s.sz, s.tz, k);
    // Height: straight line from start height to the ground plus an arc of 7 units at the top.
    s.y = lerp(s.sy, 0.3, k) + 4 * 7 * k * (1 - k) * 0.25 * 4;
    if (k >= 1) {
      const list = G.enemyHash.query(s.tx, s.tz, s.splash + 1);
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (!e.alive || e.state === 'dying' || e.def.fly) continue;
        const d = Math.hypot(e.x - s.tx, e.z - s.tz);
        if (d <= s.splash + e.radius * 0.5) damageEnemy(e, s.dmg * (d < s.splash * 0.5 ? 1 : 0.7), null);
      }
      spawnFlash(s.tx, 0.8, s.tz, s.splash * 0.75, CONFIG.palette.mortarFlash, 0.35);
      spawnParticles(16, s.tx, 0.4, s.tz, 0x8b6b4a, { speed: 7, life: 0.7, size: 0.3 });
      spawnParticles(6, s.tx, 0.5, s.tz, 0xffb347, { speed: 5, life: 0.4, size: 0.25, glow: true });
      const sc = fx.scorch.get() ?? fx.scorch.items[0];
      sc.alive = true;
      sc.x = s.tx;
      sc.z = s.tz;
      sc.t = 0;
      sc.s = s.splash * 1.8;
      sfx('explode');
      fx.shells.release(s);
    }
  }
}

// ---- Coins ----------------------------------------------------------------------------------

function updateCoins(dt) {
  const C = CONFIG.coins;
  const p = G.player;
  for (const c of G.fx.coins.items) {
    if (!c.alive) continue;
    c.life -= dt;
    if (c.life <= 0) {
      G.fx.coins.release(c);
      continue;
    }
    if (!c.landed) {
      c.vy -= 20 * dt;
      c.x += c.vx * dt;
      c.z += c.vz * dt;
      c.y += c.vy * dt;
      const floor = groundHeight(c.x, c.z) + 0.3;
      if (c.y <= floor) {
        c.y = floor;
        if (Math.abs(c.vy) < 2.5) {
          c.landed = true;
          c.vx = c.vz = 0;
        } else {
          c.vy *= -0.4;
          c.vx *= 0.6;
          c.vz *= 0.6;
        }
      }
    }
    if (!p.alive) continue;
    const dx = p.x - c.x, dz = p.z - c.z;
    const d = Math.hypot(dx, dz);
    if (d < C.pickup) {
      G.stats.coins += c.value;
      earn(c.value);
      G.bus.emit('coin', c);
      sfx('coin');
      G.fx.coins.release(c);
    } else if (d < C.magnet) {
      // Pulled toward the player, faster as it gets close.
      const sp = C.magnetSpeed * (1 - d / C.magnet) + 4;
      c.x += (dx / d) * sp * dt;
      c.z += (dz / d) * sp * dt;
    }
  }
}

// ---- Player ---------------------------------------------------------------------------------

function damagePlayer(amount) {
  const p = G.player;
  if (!p.alive || p.invulnT > 0 || G.state === 'gameover' || G.state === 'victory') return;
  p.hp -= amount;
  p.flashT = CONFIG.player.hitFlash;
  G.bus.emit('playerHit', amount);
  sfx('hurt');
  if (p.hp <= 0) {
    p.hp = 0;
    p.alive = false;
    p.deathT = 0;
    p.respawnT = CONFIG.player.respawn + CONFIG.player.deathAnim;
    p.reloading = false;
    G.bus.emit('playerDied');
    toast('You were knocked out! Back in 5 seconds');
  }
}

/** Finds the nearest enemy within a cone of the given yaw (for aim assist and auto-elevation). */
function enemyInCone(x, z, yaw, coneDeg, range) {
  const cone = (coneDeg * Math.PI) / 180;
  const list = G.enemyHash.query(x, z, range);
  let best = null, bd = Infinity;
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    if (!e.alive || e.state === 'dying') continue;
    const dx = e.x - x, dz = e.z - z;
    const d = Math.hypot(dx, dz);
    if (d > range || d < 0.5) continue;
    const off = Math.abs(wrapAngle(Math.atan2(dx, dz) - yaw));
    if (off > cone) continue;
    const s = d * (1 + off * 3);
    if (s < bd) {
      bd = s;
      best = e;
    }
  }
  return best;
}

function updatePlayer(dt) {
  const p = G.player;
  const A = G.input.actions;
  const PC = CONFIG.player;
  if (p.flashT > 0) p.flashT -= dt;
  if (p.invulnT > 0) p.invulnT -= dt;
  if (p.recoilT > 0) p.recoilT -= dt;
  if (p.muzzleT > 0) p.muzzleT -= dt;
  if (p.dashCd > 0) p.dashCd -= dt;
  if (!p.alive) {
    p.deathT += dt;
    p.respawnT -= dt;
    p.speedNow = 0;
    if (p.respawnT <= 0) {
      p.alive = true;
      p.hp = PC.hp;
      p.x = LEVEL.playerSpawn.x;
      p.z = LEVEL.playerSpawn.z;
      p.invulnT = 1.5;
      p.ammo = PC.gun.mag;
      G.bus.emit('playerRespawn');
    }
    return;
  }
  const building = G.mode === 'build';
  // Movement relative to the camera's yaw (build mode: stand still).
  let mx = building ? 0 : A.moveX;
  let mz = building ? 0 : A.moveY;
  const ml = Math.hypot(mx, mz);
  if (ml > 1) {
    mx /= ml;
    mz /= ml;
  }
  const yaw = p.aimYaw;
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  const rx = -Math.cos(yaw), rz = Math.sin(yaw);
  // Forward is "up" on the stick (moveY > 0).
  const wx = (fx * mz + rx * mx) * PC.speed;
  const wz = (fz * mz + rz * mx) * PC.speed;
  if (A.dashPressed && p.dashCd <= 0 && !building) {
    p.dashCd = PC.dash.cooldown;
    p.dashT = PC.dash.duration;
    p.invulnT = Math.max(p.invulnT, PC.dash.invuln);
    const dl = Math.hypot(wx, wz);
    if (dl > 0.1) {
      p.dashX = wx / dl;
      p.dashZ = wz / dl;
    } else {
      p.dashX = fx;
      p.dashZ = fz;
    }
    G.bus.emit('dash');
    sfx('dash');
  }
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.vx = p.dashX * PC.dash.speed;
    p.vz = p.dashZ * PC.dash.speed;
    spawnParticles(1, p.x, 1, p.z, 0xffffff, { speed: 0.5, life: 0.3, size: 0.35, grav: 0, glow: true });
  } else {
    const k = 1 - Math.exp(-PC.accel / PC.speed * dt * 2);
    p.vx += (wx - p.vx) * k;
    p.vz += (wz - p.vz) * k;
  }
  p.x += p.vx * dt;
  p.z += p.vz * dt;
  resolveCollisions(p);
  // Step up and down the grass blocks smoothly.
  p.y = damp(p.y, groundHeight(p.x, p.z), 18, dt);
  p.speedNow = Math.hypot(p.vx, p.vz);
  // Facing: toward the aim when shooting or aiming, else toward movement.
  const fire = A.fireHeld && !building;
  p.firing = fire;
  if (fire || G.input.lastInput === 'mouse') p.yaw = dampAngle(p.yaw, yaw, 18, dt);
  else if (p.speedNow > 0.5) p.yaw = dampAngle(p.yaw, Math.atan2(p.vx, p.vz), 12, dt);
  // Aim assist: ease the aim toward the nearest enemy in a 12° cone while firing.
  const assist = aimAssistStrength();
  if (fire && assist > 0) {
    const e = enemyInCone(p.x, p.z, p.aimYaw, CONFIG.aim.cone, CONFIG.aim.range);
    if (e) p.aimYaw += wrapAngle(Math.atan2(e.x - p.x, e.z - p.z) - p.aimYaw) * clamp(assist * 8 * dt, 0, 1);
  }
  // Gun: reload, fire.
  const gun = PC.gun;
  if (p.fireCd > 0) p.fireCd -= dt;
  if (p.reloading) {
    p.reloadT -= dt;
    if (p.reloadT <= 0) {
      p.reloading = false;
      p.ammo = gun.mag;
      sfx('reload');
    }
  } else if ((A.reloadPressed && p.ammo < gun.mag) || (p.ammo <= 0)) {
    p.reloading = true;
    p.reloadT = gun.reload;
  }
  p.aimVert = 0;
  if (fire && !p.reloading && p.ammo > 0 && p.fireCd <= 0) {
    p.fireCd = 1 / gun.rate;
    p.ammo--;
    playerShoot(p);
  }
  // Interact with the nearest tower (reload or repair by holding).
  updateInteract(p, dt, A.interactHeld && !building);
}

function aimAssistStrength() {
  const s = G.settings.aimAssist;
  if (s >= 0) return s;
  return G.input.lastInput === 'touch' ? CONFIG.aim.touchDefault : CONFIG.aim.mouseDefault;
}

function playerShoot(p) {
  const b = G.fx.bolts.get();
  if (!b) return;
  const gun = CONFIG.player.gun;
  const yaw = p.aimYaw;
  p.yaw = yaw;
  // Start at the gun, roughly: right shoulder height, a bit forward.
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  const rx = -Math.cos(yaw), rz = Math.sin(yaw);
  const sx = p.x + fx * 1.1 + rx * 0.62;
  const sz = p.z + fz * 1.1 + rz * 0.62;
  const sy = gun.height + p.y;
  // Aim up or down at an enemy roughly in line (flyers are up high), else straight ahead.
  let vy = 0;
  const e = enemyInCone(p.x, p.z, yaw, CONFIG.aim.autoElevateCone, gun.range);
  if (e) {
    const d = Math.hypot(e.x - sx, e.z - sz) || 1;
    vy = (enemyCenterY(e) - sy) / d;
  }
  const n = Math.hypot(1, vy);
  b.x = sx; b.y = sy; b.z = sz;
  b.vx = (fx / n) * gun.boltSpeed;
  b.vy = (vy / n) * gun.boltSpeed;
  b.vz = (fz / n) * gun.boltSpeed;
  b.life = gun.range / gun.boltSpeed;
  b.dmg = gun.damage;
  b.enemy = false;
  b.player = true;
  b.size = 0.8;
  b.r = 2.0; b.g = 1.7; b.b = 0.6;
  p.recoilT = 0.08;
  p.muzzleT = CONFIG.fx.muzzleFlash;
  p.aimVert = clamp(vy, -0.5, 0.8);
  sfx('shot');
}

/** The nearest tower in reach, and what holding Interact would do there. */
function interactInfo(p) {
  let best = null, bd = Infinity;
  for (const t of G.towers) {
    if (!t) continue;
    const d = Math.hypot(t.x - p.x, t.z - p.z);
    if (d < CONFIG.interact.range + LEVEL.padSize / 2 && d < bd) {
      bd = d;
      best = t;
    }
  }
  if (!best) return null;
  if (best.hp < best.maxHp) return { tower: best, action: 'repair', label: `Repair $${CONFIG.interact.repairCost}`, time: CONFIG.interact.repairStep };
  if (best.maxAmmo > 0 && best.ammo < best.maxAmmo) return { tower: best, action: 'reload', label: 'Reload', time: CONFIG.interact.reloadTime };
  return { tower: best, action: 'none', label: 'Full', time: 0 };
}

function updateInteract(p, dt, held) {
  const info = interactInfo(p);
  G.interact = info;
  if (!info || info.action === 'none' || !held) {
    p.interactT = 0;
    p.interactTower = info?.tower ?? null;
    return;
  }
  if (p.interactTower !== info.tower) p.interactT = 0;
  p.interactTower = info.tower;
  p.interactT += dt;
  if (Math.random() < 0.3) spawnParticles(1, info.tower.x, 1.5, info.tower.z, info.action === 'repair' ? 0xffd34e : 0x5cff8a, { speed: 1.5, up: 2, life: 0.5, size: 0.18, grav: 0, glow: true });
  if (p.interactT >= info.time) {
    p.interactT = 0;
    const t = info.tower;
    if (info.action === 'reload') {
      t.ammo = t.maxAmmo;
      toast('Tower reloaded');
      sfx('reloadTower');
      G.bus.emit('towerReloaded', t);
    } else if (info.action === 'repair') {
      if (spend(CONFIG.interact.repairCost)) {
        t.hp = Math.min(t.maxHp, t.hp + Math.ceil(t.maxHp * CONFIG.interact.repairPct));
        sfx('repair');
        spawnParticles(8, t.x, 2, t.z, 0xffd34e, { speed: 3, life: 0.5, size: 0.2, glow: true });
        if (t.hp >= t.maxHp) toast('Tower repaired');
      }
    }
  }
}

// ---- Collision --------------------------------------------------------------------------------

/** Pushes a circle out of props, towers, the citadel and the pond, and keeps it on the map. */
function resolveCollisions(o) {
  const r = CONFIG.player.radius;
  const H = CONFIG.map.half;
  for (const c of G.colliders) {
    if (c.box) {
      const cx = clamp(o.x, c.x0, c.x1), cz = clamp(o.z, c.z0, c.z1);
      const dx = o.x - cx, dz = o.z - cz;
      const d = Math.hypot(dx, dz);
      if (d < r) {
        if (d > 1e-4) {
          o.x = cx + (dx / d) * r;
          o.z = cz + (dz / d) * r;
        } else o.z = c.z1 + r;
      }
    } else {
      const dx = o.x - c.x, dz = o.z - c.z;
      const d = Math.hypot(dx, dz);
      const min = c.r + r;
      if (d < min && d > 1e-4) {
        o.x = c.x + (dx / d) * min;
        o.z = c.z + (dz / d) * min;
      }
    }
  }
  for (const t of G.towers) {
    if (!t) continue;
    const dx = o.x - t.x, dz = o.z - t.z;
    const d = Math.hypot(dx, dz);
    const min = 1.55 + r;
    if (d < min && d > 1e-4) {
      o.x = t.x + (dx / d) * min;
      o.z = t.z + (dz / d) * min;
    }
  }
  // The citadel (a box) and the map edge.
  const B = LEVEL.base;
  const bh = B.size / 2 + 0.5;
  const cx = clamp(o.x, B.x - bh, B.x + bh), cz = clamp(o.z, B.z - bh, B.z + bh);
  const dx = o.x - cx, dz = o.z - cz;
  const d = Math.hypot(dx, dz);
  if (d < r) {
    if (d > 1e-4) {
      o.x = cx + (dx / d) * r;
      o.z = cz + (dz / d) * r;
    } else o.z = B.z + bh + r;
  }
  o.x = clamp(o.x, -H, H);
  o.z = clamp(o.z, -H, H);
}

// ---- Placement ----------------------------------------------------------------------------------

function padFree(pad) {
  return !G.towers[pad];
}

function placeTower(type, pad) {
  if (!padFree(pad)) return false;
  const cost = CONFIG.towers[type].cost;
  if (!spend(cost)) return false;
  const t = createTower(type, pad);
  G.towers[pad] = t;
  G.stats.towersBuilt++;
  spawnParticles(18, t.x, 0.4, t.z, 0xd9c9a8, { speed: 6, up: 0.4, life: 0.6, size: 0.35 });
  setTimeout(() => spawnParticles(14, t.x, 0.3, t.z, 0xffffff, { speed: 7, up: 0.2, life: 0.4, size: 0.3 }), 300);
  sfx('place');
  G.bus.emit('towerPlaced', t);
  return true;
}

function upgradeTower(t) {
  if (t.level >= 3) return false;
  const cost = upgradeCost(t.type, t.level);
  if (!spend(cost)) return false;
  t.invested += cost;
  setTowerLevel(t, t.level + 1, false);
  t.hp = t.maxHp;
  t.dropT = 0.25;
  spawnParticles(20, t.x, 2, t.z, t.level === 3 ? 0xffd34e : 0x3ee0ff, { speed: 5, life: 0.7, size: 0.25, glow: true });
  sfx('upgrade');
  G.bus.emit('towerUpgraded', t);
  return true;
}

function sellTower(t) {
  const refund = Math.round(t.invested * CONFIG.sellRefund);
  earn(refund);
  G.towers[t.pad] = null;
  disposeTower(t);
  spawnParticles(14, t.x, 1, t.z, 0xb0b8c4, { speed: 5, life: 0.6, size: 0.3 });
  toast(`Sold for $${refund}`);
  sfx('sell');
  if (G.selectedTower === t) G.selectedTower = null;
  G.bus.emit('towerSold', t);
}

// ---- Camera ------------------------------------------------------------------------------------

const CAM = {
  pos: new THREE.Vector3(30, 20, 30),
  look: new THREE.Vector3(),
  fov: CONFIG.camera.fov,
  buildX: 0, buildZ: 0, buildZoom: 1,
  blend: 0, // 0 = play camera, 1 = build camera
};

function addShake(time, amp) {
  if (G.settings.reduceMotion) return;
  if (amp >= G.shake.amp * (G.shake.t / (G.shake.dur || 1))) {
    G.shake.t = time;
    G.shake.dur = time;
    G.shake.amp = amp;
  }
}

/** Distance for the build camera so the whole map fits for this aspect ratio. */
function buildCamDistance() {
  const cam = G.camera;
  const vfov = (CONFIG.camera.fov * Math.PI) / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * cam.aspect);
  const half = 60;
  const pitch = CONFIG.camera.buildPitch;
  // Seen from above at an angle, the map's depth is foreshortened by sin(pitch).
  const dV = (half * Math.sin(pitch) + 6) / Math.tan(vfov / 2);
  const dH = (half + 4) / Math.tan(hfov / 2);
  return Math.max(dV, dH) * 0.92;
}

function updateCamera(dt) {
  const cam = G.camera;
  const p = G.player;
  const C = CONFIG.camera;
  CAM.blend = damp(CAM.blend, G.mode === 'build' ? 1 : 0, 6, dt);
  // Play camera: behind and over the shoulder, with a little lead in the move direction.
  const yaw = p.aimYaw;
  const pitch = p.pitch;
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  const rx = -Math.cos(yaw), rz = Math.sin(yaw);
  const dist = C.distance;
  const leadX = clamp(p.vx, -9, 9) / 9 * C.lead;
  const leadZ = clamp(p.vz, -9, 9) / 9 * C.lead;
  const px = p.x - fx * dist * Math.cos(pitch) + rx * C.shoulder + leadX;
  const py = C.height + dist * Math.sin(pitch) + p.y;
  const pz = p.z - fz * dist * Math.cos(pitch) + rz * C.shoulder + leadZ;
  const lx = p.x + fx * 6 + rx * C.shoulder * 0.6 + leadX;
  const ly = 1.6 + Math.sin(pitch) * -2 + p.y;
  const lz = p.z + fz * 6 + rz * C.shoulder * 0.6 + leadZ;
  // Build camera: looking down over the whole map from the south.
  const bd = buildCamDistance() * CAM.buildZoom;
  const bp = C.buildPitch;
  const bx = CAM.buildX, bz = CAM.buildZ + 2;
  const tx = lerp(px, bx, CAM.blend);
  const ty = lerp(py, bd * Math.sin(bp), CAM.blend);
  const tz = lerp(pz, bz + bd * Math.cos(bp), CAM.blend);
  const tlx = lerp(lx, bx, CAM.blend);
  const tly = lerp(ly, 0, CAM.blend);
  const tlz = lerp(lz, bz, CAM.blend);
  if (CAM.blend < 0.5) {
    const hit = cameraBlock(p.x, p.z, tx, tz, ty);
    if (hit < 1) {
      const f = Math.max(0.25, hit - 0.06);
      // Slide the camera toward the player and a bit higher.
      CAM_PULL.x = p.x + (tx - p.x) * f;
      CAM_PULL.z = p.z + (tz - p.z) * f;
      CAM_PULL.y = ty + (1 - f) * 2.5;
      return finishCamera(dt, CAM_PULL.x, CAM_PULL.y, CAM_PULL.z, tlx, tly, tlz, C);
    }
  }
  finishCamera(dt, tx, ty, tz, tlx, tly, tlz, C);
}

const CAM_PULL = { x: 0, y: 0, z: 0 };

/** First blocked fraction (0..1) along the line from the player to the camera, or 1 if clear. */
function cameraBlock(px, pz, cx, cz, cy) {
  const B = LEVEL.base;
  const bh = B.size / 2 + 1.6;
  for (let i = 1; i <= 12; i++) {
    const f = i / 12;
    const x = px + (cx - px) * f, z = pz + (cz - pz) * f;
    const y = 1.6 + (cy - 1.6) * f;
    if (y < 7.5 && Math.abs(x - B.x) < bh && Math.abs(z - B.z) < bh) return f;
    for (const t of G.towers) if (t && y < 5 && Math.hypot(x - t.x, z - t.z) < 2.2) return f;
  }
  return 1;
}

function finishCamera(dt, tx, ty, tz, tlx, tly, tlz, C) {
  const cam = G.camera;
  const p = G.player;
  const k = G.mode === 'build' || CAM.blend > 0.02 ? 8 : C.followDamp;
  CAM.pos.x = damp(CAM.pos.x, tx, k, dt);
  CAM.pos.y = damp(CAM.pos.y, ty, k, dt);
  CAM.pos.z = damp(CAM.pos.z, tz, k, dt);
  CAM.look.x = damp(CAM.look.x, tlx, k * 1.4, dt);
  CAM.look.y = damp(CAM.look.y, tly, k * 1.4, dt);
  CAM.look.z = damp(CAM.look.z, tlz, k * 1.4, dt);
  // Keep the play camera above the ground and inside the hills.
  CAM.pos.y = Math.max(CAM.pos.y, terrainHeight(CAM.pos.x, CAM.pos.z) + 1.2);
  cam.position.copy(CAM.pos);
  // Shake as a small offset.
  if (G.shake.t > 0) {
    G.shake.t -= dt;
    const a = G.shake.amp * (G.shake.t / G.shake.dur);
    cam.position.x += (Math.random() - 0.5) * 2 * a;
    cam.position.y += (Math.random() - 0.5) * 2 * a;
    cam.position.z += (Math.random() - 0.5) * 2 * a;
  }
  cam.lookAt(CAM.look);
  const fov = C.fov + (p.dashT > 0 && !G.settings.reduceMotion ? C.dashFovKick : 0);
  CAM.fov = damp(CAM.fov, fov, 10, dt);
  if (Math.abs(cam.fov - CAM.fov) > 0.01) {
    cam.fov = CAM.fov;
    cam.updateProjectionMatrix();
  }
  // Keep the sun's shadow box around what we see.
  const sun = G.sun;
  const focusX = lerp(p.x, CAM.buildX, CAM.blend), focusZ = lerp(p.z, CAM.buildZ, CAM.blend);
  sun.target.position.set(focusX, 0, focusZ);
  sun.position.set(focusX + 30, 40, focusZ + 22);
  const span = lerp(32, 70, CAM.blend);
  const sc = sun.shadow.camera;
  if (Math.abs(sc.right - span) > 0.5) {
    sc.left = -span;
    sc.right = span;
    sc.top = span;
    sc.bottom = -span;
    sc.updateProjectionMatrix();
  }
}

// ---- Audio (WebAudio synth only) --------------------------------------------------------------

const AUDIO = { ctx: null, master: null, noise: null, last: {} };

function audioInit() {
  if (AUDIO.ctx) {
    if (AUDIO.ctx.state !== 'running') AUDIO.ctx.resume().catch(() => {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    AUDIO.ctx = new AC();
  } catch {
    return;
  }
  AUDIO.master = AUDIO.ctx.createGain();
  AUDIO.master.connect(AUDIO.ctx.destination);
  audioVolume();
  const len = AUDIO.ctx.sampleRate;
  const buf = AUDIO.ctx.createBuffer(1, len, AUDIO.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AUDIO.noise = buf;
  AUDIO.ctx.addEventListener('statechange', () => {
    if (AUDIO.ctx.state === 'interrupted' || AUDIO.ctx.state === 'suspended') {
      if (document.visibilityState === 'visible' && G.state !== 'paused') AUDIO.ctx.resume().catch(() => {});
    }
  });
  if (AUDIO.ctx.state !== 'running') AUDIO.ctx.resume().catch(() => {});
}

function audioVolume() {
  if (!AUDIO.master) return;
  AUDIO.master.gain.value = G.settings.muted ? 0 : G.settings.volume * 0.6;
}

function tone(f, dur, type, vol, when = 0, slide = 0) {
  const c = AUDIO.ctx;
  if (!c || c.state !== 'running') return;
  const t = c.currentTime + when;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AUDIO.master);
  o.start(t);
  o.stop(t + dur + 0.03);
}

function noise(dur, vol, cutoff, when = 0, endCut = 120) {
  const c = AUDIO.ctx;
  if (!c || c.state !== 'running' || !AUDIO.noise) return;
  const t = c.currentTime + when;
  const s = c.createBufferSource();
  s.buffer = AUDIO.noise;
  const f = c.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(cutoff, t);
  f.frequency.exponentialRampToValueAtTime(endCut, t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AUDIO.master);
  s.start(t, Math.random() * 0.5);
  s.stop(t + dur + 0.05);
}

function sfx(name) {
  if (!AUDIO.ctx || AUDIO.ctx.state !== 'running') return;
  const now = performance.now();
  const gap = name === 'shot' ? 40 : name === 'coin' ? 45 : name === 'hit' ? 50 : 70;
  if (now - (AUDIO.last[name] ?? 0) < gap) return;
  AUDIO.last[name] = now;
  switch (name) {
    case 'shot': tone(880, 0.06, 'square', 0.05, 0, 420); break;
    case 'hit': tone(300, 0.05, 'triangle', 0.06, 0, 160); break;
    case 'blaster': tone(620, 0.07, 'sawtooth', 0.035, 0, 260); break;
    case 'mortar': noise(0.25, 0.25, 900); tone(90, 0.2, 'sine', 0.2, 0, 50); break;
    case 'explode': noise(0.5, 0.3, 1400); tone(70, 0.35, 'sine', 0.25, 0, 35); break;
    case 'sniper': tone(1600, 0.08, 'square', 0.04, 0, 200); noise(0.15, 0.12, 4000); break;
    case 'frost': noise(0.3, 0.07, 5000, 0, 2000); break;
    case 'tesla': noise(0.12, 0.1, 6000, 0, 3000); tone(220, 0.1, 'sawtooth', 0.04, 0, 900); break;
    case 'coin': tone(1320, 0.05, 'square', 0.05); tone(1980, 0.1, 'square', 0.04, 0.05); break;
    case 'boom': tone(60, 0.5, 'sine', 0.4, 0, 30); noise(0.4, 0.2, 600); break;
    case 'wave': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'triangle', 0.09, i * 0.08)); break;
    case 'horn': tone(110, 1.0, 'sawtooth', 0.12, 0, 98); tone(165, 1.0, 'sawtooth', 0.08, 0, 147); break;
    case 'pop': tone(520, 0.08, 'triangle', 0.07, 0, 900); break;
    case 'bossDeath': noise(1.2, 0.4, 2000); [392, 523, 659, 784].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, 0.2 + i * 0.1)); break;
    case 'smash': noise(0.25, 0.25, 700); tone(80, 0.2, 'square', 0.12, 0, 40); break;
    case 'hurt': tone(220, 0.15, 'square', 0.08, 0, 110); break;
    case 'dash': noise(0.2, 0.12, 3000, 0, 400); break;
    case 'reload': tone(300, 0.05, 'square', 0.05); tone(500, 0.06, 'square', 0.05, 0.08); break;
    case 'reloadTower': [400, 600, 800].forEach((f, i) => tone(f, 0.07, 'square', 0.05, i * 0.06)); break;
    case 'repair': tone(700, 0.06, 'triangle', 0.07); tone(900, 0.08, 'triangle', 0.07, 0.07); break;
    case 'place': tone(140, 0.18, 'sine', 0.25, 0, 60); noise(0.2, 0.15, 900); break;
    case 'upgrade': [523, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.05, i * 0.07)); break;
    case 'sell': tone(660, 0.08, 'triangle', 0.06); tone(440, 0.12, 'triangle', 0.06, 0.08); break;
    case 'click': tone(1000, 0.03, 'square', 0.03); break;
    case 'error': tone(160, 0.12, 'square', 0.06); break;
    case 'enemyShot': tone(500, 0.12, 'sine', 0.04, 0, 300); break;
    case 'victory': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.07, i * 0.14)); break;
    case 'defeat': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'triangle', 0.09, i * 0.25)); break;
  }
}

// ---- Quality tiers and frame-rate watchdog ------------------------------------------------------

const PERF = { acc: 0, frames: 0, low: 0, high: 0, fps: 60, ms: 16 };

function applyTier(name, opts = {}) {
  const cfg = CONFIG.tiers[name];
  const prev = G.tierCfg;
  G.tier = name;
  G.tierCfg = cfg;
  if (!opts.keepScale) G.renderScale = 1;
  // MSAA is fixed when the WebGL context is made: switch renderer only if it differs.
  if (prev && prev.msaa !== cfg.msaa && !opts.initial) recreateRenderer(cfg.msaa);
  const r = G.renderer;
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, cfg.pixelRatio) * G.renderScale);
  const shadows = cfg.shadows !== 'blob';
  r.shadowMap.enabled = shadows;
  r.shadowMap.type = name === 'high' ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  G.sun.castShadow = shadows;
  if (shadows) {
    const size = cfg.shadows;
    if (G.sun.shadow.mapSize.x !== size) {
      G.sun.shadow.mapSize.set(size, size);
      if (G.sun.shadow.map) {
        G.sun.shadow.map.dispose();
        G.sun.shadow.map = null;
      }
    }
  }
  // Materials need recompiling when shadows switch on or off.
  G.scene.traverse((o) => {
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) m.needsUpdate = true;
    }
    if (o.name === 'outline') o.visible = cfg.outlines;
  });
  // Real shadows from the crowd only on High (blob shadows are always there).
  if (G.fx.enemyR) for (const t of CONFIG.enemyOrder) G.fx.enemyR[t].mesh.castShadow = name === 'high';
  const g = G.static.grass;
  if (g) {
    g.grass.count = Math.min(cfg.grass, g.grassMax);
    g.flowers.count = Math.min(Math.floor(cfg.grass / 6), g.flowersMax);
  }
  setupComposer();
  resize();
}

function setupComposer() {
  if (G.composer) {
    G.composer.dispose();
    G.composer = null;
  }
  if (!G.tierCfg.bloom) return;
  const size = G.renderer.getSize(new THREE.Vector2());
  const composer = new EffectComposer(G.renderer);
  composer.addPass(new RenderPass(G.scene, G.camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(size.x, size.y), 0.45, 0.35, 0.92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  G.composer = composer;
  G.bloomPass = bloom;
}

/** Watches the frame rate and lowers (or carefully raises) the render scale and tier. */
function perfWatch(dt) {
  PERF.acc += dt;
  PERF.frames++;
  if (PERF.acc < 1) return;
  PERF.fps = PERF.frames / PERF.acc;
  PERF.ms = (PERF.acc / PERF.frames) * 1000;
  PERF.acc = 0;
  PERF.frames = 0;
  if (G.settings.quality !== 'auto' || G.state === 'paused' || G.state === 'menu' || document.hidden) return;
  const P = CONFIG.perf;
  if (PERF.fps < P.lowFps) {
    PERF.low++;
    PERF.high = 0;
  } else if (PERF.fps > P.upFps) {
    PERF.high++;
    PERF.low = 0;
  } else {
    PERF.low = 0;
    PERF.high = 0;
  }
  const order = CONFIG.tierOrder;
  const i = order.indexOf(G.tier);
  if (PERF.low >= P.window) {
    PERF.low = 0;
    if (G.renderScale > P.minScale + 0.01) {
      G.renderScale = Math.max(P.minScale, G.renderScale - P.scaleStep);
      applyScale();
    } else if (i > 0) applyTier(order[i - 1]);
  } else if (PERF.high >= P.upWindow) {
    PERF.high = 0;
    if (G.renderScale < 1) {
      G.renderScale = Math.min(1, G.renderScale + P.scaleStep);
      applyScale();
    }
  }
}

function applyScale() {
  G.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, G.tierCfg.pixelRatio) * G.renderScale);
  resize();
}

// ---- 06-input.js ----
// =============================================================================================
// INPUT — touch, mouse, keyboard and gamepad turned into one action state. Systems only read
// `G.input.actions` (moveX/moveY, look deltas, fireHeld, dashPressed, ...), never raw events.
// Every finger is tracked by pointerId; pointercancel releases everything that finger held,
// so a system gesture can never leave the character stuck walking or firing.
// =============================================================================================

function createInput(canvas) {
  const I = {
    actions: {
      moveX: 0, moveY: 0, lookDX: 0, lookDY: 0,
      fireHeld: false, dashPressed: false, reloadPressed: false, interactHeld: false,
    },
    lastInput: matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse',
    keys: new Set(),
    joy: { id: -1, ox: 0, oy: 0, x: 0, y: 0 },
    look: { id: -1, x: 0, y: 0, sx: 0, sy: 0, t: 0, moved: false },
    buildTouches: new Map(),
    pinch: 0,
    held: { fire: new Set(), interact: new Set() },
    mouseFire: false,
    locked: false,
    padPrev: { a: false, x: false, y: false, b: false, start: false },
  };
  G.input = I;
  const setInput = (kind) => {
    if (I.lastInput !== kind) {
      I.lastInput = kind;
      G.bus.emit('inputKind', kind);
    }
  };

  const leftZone = (x) => (G.settings.leftHanded ? x > G.ui.w * 0.6 : x < G.ui.w * 0.4);

  // ---- Canvas pointers (joystick, look, build camera, taps) ---------------------------------
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    audioInit();
    if (G.state === 'menu' || G.state === 'loading') return;
    if (e.pointerType === 'mouse') {
      setInput('mouse');
      onMouseDown(e);
      return;
    }
    setInput('touch');
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch {
      // Ignore.
    }
    if (G.mode === 'build') {
      I.buildTouches.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() });
      if (I.buildTouches.size === 2) I.pinch = pinchDist();
      return;
    }
    if (leftZone(e.clientX) && I.joy.id < 0 && G.player.alive) {
      I.joy.id = e.pointerId;
      I.joy.ox = e.clientX;
      I.joy.oy = e.clientY;
      I.joy.x = I.joy.y = 0;
      G.ui.showJoystick(true, e.clientX, e.clientY);
    } else if (I.look.id < 0) {
      I.look.id = e.pointerId;
      I.look.x = I.look.sx = e.clientX;
      I.look.y = I.look.sy = e.clientY;
      I.look.t = performance.now();
      I.look.moved = false;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') {
      onMouseMove(e);
      return;
    }
    if (G.mode === 'build') {
      const t = I.buildTouches.get(e.pointerId);
      if (!t) return;
      const dx = e.clientX - t.x, dy = e.clientY - t.y;
      t.x = e.clientX;
      t.y = e.clientY;
      if (I.buildTouches.size >= 2) {
        const d = pinchDist();
        if (I.pinch > 0 && d > 0) buildZoom(I.pinch / d);
        I.pinch = d;
      } else buildPan(dx, dy);
      return;
    }
    if (e.pointerId === I.joy.id) {
      const R = 62 * G.ui.scale;
      let dx = (e.clientX - I.joy.ox) / R, dy = (e.clientY - I.joy.oy) / R;
      const l = Math.hypot(dx, dy);
      if (l > 1) {
        dx /= l;
        dy /= l;
      }
      I.joy.x = dx;
      I.joy.y = dy;
      G.ui.moveJoystick(dx, dy);
    } else if (e.pointerId === I.look.id) {
      I.actions.lookDX += e.clientX - I.look.x;
      I.actions.lookDY += e.clientY - I.look.y;
      I.look.x = e.clientX;
      I.look.y = e.clientY;
      if (Math.hypot(e.clientX - I.look.sx, e.clientY - I.look.sy) > 10) I.look.moved = true;
    }
  });

  const release = (e, cancelled) => {
    if (e.pointerType === 'mouse') {
      onMouseUp(e);
      return;
    }
    if (G.mode === 'build' || I.buildTouches.has(e.pointerId)) {
      const t = I.buildTouches.get(e.pointerId);
      I.buildTouches.delete(e.pointerId);
      if (I.buildTouches.size < 2) I.pinch = 0;
      if (t && !cancelled && Math.hypot(e.clientX - t.sx, e.clientY - t.sy) < 12 && performance.now() - t.t < 450) tapAt(e.clientX, e.clientY, true);
    }
    if (e.pointerId === I.joy.id) {
      I.joy.id = -1;
      I.joy.x = I.joy.y = 0;
      G.ui.showJoystick(false);
    }
    if (e.pointerId === I.look.id) {
      if (!cancelled && !I.look.moved && performance.now() - I.look.t < 300) tapAt(e.clientX, e.clientY, true);
      I.look.id = -1;
    }
  };
  canvas.addEventListener('pointerup', (e) => release(e, false));

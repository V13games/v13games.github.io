  canvas.addEventListener('pointercancel', (e) => release(e, true));
  canvas.addEventListener('lostpointercapture', (e) => {
    if (e.pointerType !== 'mouse') release(e, true);
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (G.mode === 'build') buildZoom(Math.exp(e.deltaY * 0.0012));
  }, { passive: false });

  function pinchDist() {
    const pts = [...I.buildTouches.values()];
    if (pts.length < 2) return 0;
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }

  // ---- Mouse ---------------------------------------------------------------------------------
  let mouseDrag = null;
  function onMouseDown(e) {
    if (e.button === 2) {
      cancelAction();
      return;
    }
    if (G.mode === 'build') {
      mouseDrag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
      return;
    }
    if (!I.locked && canvas.requestPointerLock && !G.ui.isTouchDevice) {
      try {
        const r = canvas.requestPointerLock();
        if (r && r.catch) r.catch(() => {});
      } catch {
        // Not allowed here: fall back to drag-to-look.
      }
    }
    if (e.button === 0) I.mouseFire = true;
    mouseDrag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, look: true };
  }
  function onMouseMove(e) {
    if (I.locked) {
      I.actions.lookDX += e.movementX || 0;
      I.actions.lookDY += e.movementY || 0;
      return;
    }
    if (!mouseDrag) {
      if (G.mode === 'build') G.ui.hoverAt(e.clientX, e.clientY);
      return;
    }
    const dx = e.clientX - mouseDrag.x, dy = e.clientY - mouseDrag.y;
    mouseDrag.x = e.clientX;
    mouseDrag.y = e.clientY;
    if (G.mode === 'build') buildPan(dx, dy);
    else {
      I.actions.lookDX += dx;
      I.actions.lookDY += dy;
    }
  }
  function onMouseUp(e) {
    if (e.button === 0) I.mouseFire = false;
    if (mouseDrag && Math.hypot(e.clientX - mouseDrag.sx, e.clientY - mouseDrag.sy) < 6) {
      if (G.mode === 'build' || !I.locked) tapAt(e.clientX, e.clientY, false);
    }
    mouseDrag = null;
  }
  document.addEventListener('pointerlockchange', () => {
    I.locked = document.pointerLockElement === canvas;
    if (!I.locked) I.mouseFire = false;
  });
  window.addEventListener('mouseup', () => {
    I.mouseFire = false;
    mouseDrag = null;
  });

  // ---- Keyboard ------------------------------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT') return;
    setInput('keyboard');
    const k = e.code;
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    I.keys.add(k);
    audioInit();
    if (G.state === 'menu') {
      if (k === 'Enter' || k === 'Space') G.ui.startGame();
      return;
    }
    switch (k) {
      case 'Space': I.actions.dashPressed = true; break;
      case 'KeyR': I.actions.reloadPressed = true; break;
      case 'Tab':
      case 'KeyB': toggleBuildMode(); break;
      case 'KeyF': toggleSpeed(); break;
      case 'Escape':
        if (G.placing || G.selectedTower || G.ghost) cancelAction();
        else if (G.mode === 'build') toggleBuildMode();
        else togglePause();
        break;
      case 'KeyH': togglePause(true); break;
      case 'Enter': if (G.state === 'build') startWave(true); break;
      default:
        if (k.startsWith('Digit')) {
          const n = Number(k.slice(5));
          if (n >= 1 && n <= 6) {
            if (G.mode !== 'build') toggleBuildMode();
            G.ui.chooseCard(CONFIG.towerOrder[n - 1]);
          }
        }
    }
  });
  window.addEventListener('keyup', (e) => I.keys.delete(e.code));
  window.addEventListener('blur', () => {
    I.keys.clear();
    I.mouseFire = false;
    releaseAll();
  });

  function releaseAll() {
    I.joy.id = -1;
    I.joy.x = I.joy.y = 0;
    I.look.id = -1;
    I.buildTouches.clear();
    I.held.fire.clear();
    I.held.interact.clear();
    G.ui?.showJoystick(false);
  }
  I.releaseAll = releaseAll;

  /** Hold-buttons (Fire, Interact) track the fingers holding them. */
  I.bindHold = (el, set) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      audioInit();
      if (e.pointerType !== 'mouse') setInput('touch');
      set.add(e.pointerId);
      el.classList.add('down');
      try {
        el.setPointerCapture(e.pointerId);
      } catch {
        // Ignore.
      }
    });
    const up = (e) => {
      set.delete(e.pointerId);
      if (set.size === 0) el.classList.remove('down');
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  };
  /** Tap buttons react on pointerdown (with a pressed state), not on click. */
  I.bindTap = (el, fn) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      audioInit();
      if (e.pointerType !== 'mouse') setInput('touch');
      el.classList.add('down');
      sfx('click');
      fn(e);
    });
    const up = () => el.classList.remove('down');
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  };

  /** Combines all sources into the action state (once per rendered frame). */
  I.poll = () => {
    const A = I.actions;
    let mx = 0, my = 0;
    // Keyboard.
    if (G.mode !== 'build') {
      if (I.keys.has('KeyA') || I.keys.has('ArrowLeft')) mx -= 1;
      if (I.keys.has('KeyD') || I.keys.has('ArrowRight')) mx += 1;
      if (I.keys.has('KeyW') || I.keys.has('ArrowUp')) my += 1;
      if (I.keys.has('KeyS') || I.keys.has('ArrowDown')) my -= 1;
    } else {
      const sp = 16;
      let px = 0, pz = 0;
      if (I.keys.has('KeyA') || I.keys.has('ArrowLeft')) px -= sp;
      if (I.keys.has('KeyD') || I.keys.has('ArrowRight')) px += sp;
      if (I.keys.has('KeyW') || I.keys.has('ArrowUp')) pz -= sp;
      if (I.keys.has('KeyS') || I.keys.has('ArrowDown')) pz += sp;
      if (px || pz) buildPanWorld(px / 60, pz / 60);
    }
    // Joystick with a 12% dead zone and analogue speed.
    const jl = Math.hypot(I.joy.x, I.joy.y);
    if (jl > 0.12) {
      const k = (jl - 0.12) / 0.88 / jl;
      mx += I.joy.x * k;
      my -= I.joy.y * k;
    }
    let fire = I.held.fire.size > 0 || (I.mouseFire && (I.locked || G.ui.isTouchDevice === false));
    let interact = I.held.interact.size > 0 || I.keys.has('KeyE');
    // Gamepad.
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp || !gp.connected) continue;
      const dz = (v) => (Math.abs(v) < 0.15 ? 0 : v);
      const lx = dz(gp.axes[0] ?? 0), ly = dz(gp.axes[1] ?? 0), rx = dz(gp.axes[2] ?? 0), ry = dz(gp.axes[3] ?? 0);
      if (lx || ly || rx || ry || gp.buttons.some((b) => b.pressed)) setInput('gamepad');
      mx += lx;
      my -= ly;
      A.lookDX += rx * 14;
      A.lookDY += ry * 10;
      if ((gp.buttons[7]?.value ?? 0) > 0.3) fire = true;
      if (gp.buttons[2]?.pressed) interact = true;
      const a = !!gp.buttons[0]?.pressed, y = !!gp.buttons[3]?.pressed, b = !!gp.buttons[1]?.pressed, st = !!gp.buttons[9]?.pressed;
      if (a && !I.padPrev.a) A.dashPressed = true;
      if (y && !I.padPrev.y) toggleBuildMode();
      if (b && !I.padPrev.b) cancelAction();
      if (st && !I.padPrev.start) togglePause();
      I.padPrev.a = a;
      I.padPrev.y = y;
      I.padPrev.b = b;
      I.padPrev.start = st;
      break;
    }
    A.moveX = clamp(mx, -1, 1);
    A.moveY = clamp(my, -1, 1);
    A.fireHeld = fire && G.player.alive;
    A.interactHeld = interact;
  };

  /** Edge-triggered actions last for one simulation step. */
  I.consume = () => {
    I.actions.dashPressed = false;
    I.actions.reloadPressed = false;
  };
  return I;
}

// ---- Build camera control ------------------------------------------------------------------

function buildPan(dxPx, dyPx) {
  // Screen pixels to world units at the current zoom.
  const k = (buildCamDistance() * CAM.buildZoom) / (G.ui.h * 0.9);
  buildPanWorld(-dxPx * k, -dyPx * k * 1.25);
}

function buildPanWorld(dx, dz) {
  CAM.buildX = clamp(CAM.buildX + dx, -45, 45);
  CAM.buildZ = clamp(CAM.buildZ + dz, -45, 45);
}

function buildZoom(f) {
  CAM.buildZoom = clamp(CAM.buildZoom * f, CONFIG.camera.buildMinZoom, CONFIG.camera.buildMaxZoom);
}

// ---- Picking ----------------------------------------------------------------------------------

const RAY = new THREE.Raycaster();
const NDC = new THREE.Vector2();
const GROUND = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function screenRay(x, y) {
  NDC.set((x / G.ui.w) * 2 - 1, -(y / G.ui.h) * 2 + 1);
  RAY.setFromCamera(NDC, G.camera);
  return RAY;
}

function padAt(x, y) {
  const r = screenRay(x, y);
  const hit = r.ray.intersectPlane(GROUND, TMP.v1);
  if (!hit) return -1;
  const s = LEVEL.padSize / 2 + 0.6;
  let best = -1, bd = Infinity;
  LEVEL.pads.forEach(([px, pz], i) => {
    const d = Math.max(Math.abs(hit.x - px), Math.abs(hit.z - pz));
    if (d < s && d < bd) {
      bd = d;
      best = i;
    }
  });
  if (best < 0) {
    // Towers stand tall: also accept a hit on the tower body.
    const meshes = [];
    for (const t of G.towers) if (t) meshes.push(t.base, t.head);
    const hits = r.intersectObjects(meshes, false);
    if (hits.length > 0) {
      const t = hits[0].object.userData.tower;
      if (t) best = t.pad;
    }
  }
  return best;
}

/** A tap or click on the world: select a pad (to build) or a tower (to inspect). */
function tapAt(x, y, touch) {
  if (G.state === 'paused' || G.state === 'gameover' || G.state === 'victory' || G.state === 'menu') return;
  const pad = padAt(x, y);
  if (G.mode === 'build' && G.placing) {
    if (pad < 0) return;
    if (!padFree(pad)) {
      selectTower(G.towers[pad]);
      return;
    }
    if (touch) {
      // Touch always needs a confirm tap: show the ghost with ✓ / ✕.
      G.ghost = { type: G.placing, pad };
      G.bus.emit('ghost');
    } else {
      if (placeTower(G.placing, pad) && G.money < CONFIG.towers[G.placing].cost) G.placing = null;
      G.bus.emit('ghost');
    }
    return;
  }
  if (pad >= 0 && G.towers[pad]) selectTower(G.towers[pad]);
  else if (G.selectedTower) selectTower(null);
}

function selectTower(t) {
  G.selectedTower = t;
  G.bus.emit('select', t);
}

function cancelAction() {
  if (G.ghost) {
    G.ghost = null;
    G.bus.emit('ghost');
    return;
  }
  if (G.placing) {
    G.placing = null;
    G.bus.emit('ghost');
    G.ui.chooseCard(null);
    return;
  }
  if (G.selectedTower) selectTower(null);
}

function toggleBuildMode(force) {
  if (G.state !== 'build' && G.state !== 'wave') return;
  const next = force ?? (G.mode === 'build' ? 'play' : 'build');
  if (next === G.mode) return;
  G.mode = next;
  if (next === 'build') {
    CAM.buildX = clamp(G.player.x * 0.3, -20, 20);
    CAM.buildZ = 0;
    CAM.buildZoom = 1;
    if (document.pointerLockElement) document.exitPointerLock();
    G.input.releaseAll();
  } else {
    G.placing = null;
    G.ghost = null;
    G.input.releaseAll();
  }
  G.bus.emit('mode', next);
}

function toggleSpeed() {
  G.speed = G.speed === 1 ? 2 : 1;
  G.bus.emit('speed', G.speed);
}

function togglePause(help) {
  if (G.state === 'paused') {
    G.ui.resume();
    return;
  }
  if (G.state === 'build' || G.state === 'wave') G.ui.pause(!!help);
}

/** Small DOM helper: element with class, optional static SVG/HTML and text. */
function el(tag, cls, parent, opts = {}) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (opts.svg) e.innerHTML = opts.svg; // static icon markup only
  if (opts.text !== undefined) e.textContent = opts.text;
  if (opts.title) e.title = opts.title;
  if (parent) parent.appendChild(e);
  return e;
}

/** Sets text only when it changed. */
function setText(node, value) {
  if (node._v !== value) {
    node._v = value;
    node.textContent = value;
  }
}

function setShow(node, on) {
  const v = on ? '' : 'none';
  if (node._d !== v) {
    node._d = v;
    node.style.display = v;
  }
}

      const d = document;
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
    });

  I.bindTap(U.speedBtn, () => toggleSpeed());
  I.bindTap(gearBtn, () => {

  });
  I.bindTap(pauseBtn, () => togglePause());

  const bl = el('div', 'bl', hud);

  const hpRow = el('div', 'row', pbox);
  el('span', 'ico', hpRow, { svg: ICON.heart });

  U.hpFill = el('div', 'fill hp', hpTrack);
  U.hpText = el('span', 'val', hpRow);

  // ---- Tower panel -------------------------------------------------------------------------

      setText(U.tpUpgrade, `Upgrade $${c}`);
      U.tpUpgrade.disabled = G.money < c;
      U.tpUpgrade.classList.toggle('off', G.money < c);
    } else {
      setText(U.tpUpgrade, 'Max level');
      U.tpUpgrade.disabled = true;
      U.tpUpgrade.classList.add('off');
    }
    setText(U.tpSell, `Sell $${Math.round(t.invested * CONFIG.sellRefund)}`);
  };

  // ---- Screens -----------------------------------------------------------------------------
  const screens = {};
  const screen = (name, cls = '') => {
    const s = el('div', `screen ${cls}`, root);
    s.style.display = 'none';
    screens[name] = s;
    return s;
  };
  const showScreen = (name) => {
    for (const [k, s] of Object.entries(screens)) s.style.display = k === name ? 'flex' : 'none';
    U.current = name;
    root.classList.toggle('modal', !!name);
    if (name === 'help') U.fillHelp();
    if (name === 'settings') U.fillSettings();
  };
  U.showScreen = showScreen;

  // Start.
  const start = screen('start', 'start');
  const logo = el('div', 'logo', start);
  el('span', 'l1', logo, { text: 'BLOCK' });
  el('span', 'l2', logo, { text: 'HOLD' });
  el('div', 'tagline', start, { text: 'Walk the field. Build the towers. Hold the citadel.' });
  U.bestText = el('div', 'best', start);
  const startBtn = el('button', 'btn accent huge', start);
  el('span', '', startBtn, { svg: ICON.play });
  U.startLabel = el('span', '', startBtn, { text: U.isTouchDevice ? 'Tap to Play' : 'Click to Play' });
  U.loadingText = el('div', 'loading', start, { text: 'Getting ready…' });
  const startRow = el('div', 'rowbtns', start);
  const qBtn = el('button', 'btn small', startRow);
  U.qBtn = qBtn;
  const sBtn = el('button', 'btn small', startRow, { text: 'Settings' });
  const hBtn = el('button', 'btn small', startRow, { text: 'How to play' });
  I.bindTap(startBtn, () => U.startGame());
  I.bindTap(qBtn, () => {
    const order = ['auto', 'low', 'medium', 'high'];
    G.settings.quality = order[(order.indexOf(G.settings.quality) + 1) % order.length];
    saveSettings();
    applyQualitySetting();
    U.syncQualityBtn();
  });
  U.syncQualityBtn = () => setText(qBtn, `Quality: ${G.settings.quality === 'auto' ? `Auto (${G.tier})` : G.settings.quality[0].toUpperCase() + G.settings.quality.slice(1)}`);
  I.bindTap(sBtn, () => {
    U.back = 'start';
    showScreen('settings');
  });
  I.bindTap(hBtn, () => {
    U.back = 'start';
    showScreen('help');
  });
  if (location.pathname.includes('/play/')) {
    const back = el('a', 'allgames', start, { text: '‹ All games' });
    back.href = '../../';
  }

  // Pause.
  const pause = screen('pause');
  const pp = el('div', 'panel dialog', pause);
  el('h2', '', pp, { text: 'Paused' });
  const pr = el('button', 'btn accent wide', pp, { text: 'Resume' });
  const prs = el('button', 'btn wide', pp, { text: 'Restart' });
  const pst = el('button', 'btn wide', pp, { text: 'Settings' });
  const phl = el('button', 'btn wide', pp, { text: 'Help' });
  if (location.pathname.includes('/play/')) {
    const back = el('a', 'btn wide linkbtn', pp, { text: '‹ All games' });
    back.href = '../../';
  }
  I.bindTap(pr, () => U.resume());
  I.bindTap(prs, () => restartGame());
  I.bindTap(pst, () => {
    U.back = 'pause';
    showScreen('settings');
  });
  I.bindTap(phl, () => {
    U.back = 'pause';
    showScreen('help');
  });

  // Settings.
  const set = screen('settings');
  const sp = el('div', 'panel dialog wide', set);
  el('h2', '', sp, { text: 'Settings' });
  U.setBody = el('div', 'setbody', sp);
  const sBack = el('button', 'btn accent wide', sp, { text: 'Back' });
  I.bindTap(sBack, () => showScreen(U.back ?? 'pause'));
  U.fillSettings = () => {
    const b = U.setBody;
    while (b.firstChild) b.removeChild(b.firstChild);
    const S = G.settings;
    const toggle = (label, key, after) => {
      const r = el('label', 'setrow', b);
      el('span', '', r, { text: label });
      const c = el('input', '', r);
      c.type = 'checkbox';
      c.checked = !!S[key];
      c.addEventListener('change', () => {
        S[key] = c.checked;
        saveSettings();
        after?.();
      });
    };
    const slider = (label, key, min, max, step, after) => {
      const r = el('label', 'setrow', b);
      el('span', '', r, { text: label });
      const c = el('input', '', r);
      c.type = 'range';
      c.min = String(min);
      c.max = String(max);
      c.step = String(step);
      c.value = String(S[key] < 0 ? aimAssistStrength() : S[key]);
      c.addEventListener('input', () => {
        S[key] = Number(c.value);
        saveSettings();
        after?.();
      });
    };
    const choice = (label, key, options, after) => {
      const r = el('div', 'setrow', b);
      el('span', '', r, { text: label });
      const seg = el('div', 'seg', r);
      for (const [v, l] of options) {
        const o = el('button', `btn small ${S[key] === v ? 'on' : ''}`, seg, { text: l });
        I.bindTap(o, () => {
          S[key] = v;
          saveSettings();
          after?.();
          U.fillSettings();
        });
      }
    };
    toggle('Left-handed layout', 'leftHanded', () => U.layout());
    slider('Look sensitivity', 'lookSens', 0.3, 2.5, 0.05);
    slider('Aim assist', 'aimAssist', 0, 1, 0.05);
    toggle('Invert look up/down', 'invertY');
    choice('Button size', 'buttonSize', [['S', 'S'], ['M', 'M'], ['L', 'L']], () => resize());
    toggle('Reduce motion (no shaking)', 'reduceMotion');
    slider('Volume', 'volume', 0, 1, 0.05, () => audioVolume());
    toggle('Mute', 'muted', () => audioVolume());
    choice('Quality', 'quality', [['auto', 'Auto'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High']], () => {
      applyQualitySetting();
      U.syncQualityBtn();
    });
  };

  // Help.
  const help = screen('help');
  const hp = el('div', 'panel dialog wide', help);
  el('h2', '', hp, { text: 'How to play' });
  U.helpBody = el('div', 'helpbody', hp);
  const hBack = el('button', 'btn accent wide', hp, { text: 'Back' });
  I.bindTap(hBack, () => showScreen(U.back ?? 'pause'));
  U.fillHelp = () => {
    const b = U.helpBody;
    while (b.firstChild) b.removeChild(b.firstChild);
    el('p', '', b, { text: 'Enemies march from the purple portal along the sandy lane to your citadel. Stop them for 20 waves. Build towers on the grey pads, shoot with your own blaster, and walk over coins to collect them.' });
    el('p', '', b, { text: 'Towers run out of ammo and get smashed by big enemies. Walk up to a tower and hold Reload (free) or Repair ($10 a step) to keep it fighting.' });
    const touch = G.input.lastInput === 'touch';
    const rows = touch ? [
      ['Move', 'Put your thumb anywhere on the left side: a joystick appears'],
      ['Look and aim', 'Drag on the right side'],
      ['Shoot', 'Hold the big Fire button'],
      ['Dash', 'Dash button (above Fire)'],
      ['Reload / repair a tower', 'Stand next to it and hold the button that appears'],
      ['Build', 'Hammer button, pick a tower card, tap a pad, then ✓'],
      ['Tower info', 'Tap a tower'],
      ['Build camera', 'Drag to pan, pinch to zoom'],
    ] : [
      ['Move', 'W A S D'],
      ['Look and aim', 'Mouse (click to lock it, Esc to release)'],
      ['Shoot', 'Hold left click'],
      ['Dash', 'Space'],
      ['Reload gun', 'R'],
      ['Reload / repair a tower', 'Hold E next to it'],
      ['Build', 'B or Tab, then 1–6 or a card, then click a pad'],
      ['Cancel', 'Right click or Esc'],
      ['Game speed', 'F'],
      ['Start the wave early', 'Enter'],
    ];
    const tbl = el('div', 'helptbl', b);
    for (const [k, v] of rows) {
      el('span', 'k', tbl, { text: k });
      el('span', 'v', tbl, { text: v });
    }
    el('p', 'muted', b, { text: 'Tip: starting a wave early pays $2 for every second left on the clock.' });
  };

  // Game over and victory.
  const over = screen('over');
  const op = el('div', 'panel dialog', over);
  U.overTitle = el('h2', 'big', op);
  U.overStats = el('div', 'endstats', op);
  const again = el('button', 'btn accent huge', op, { text: 'Restart' });
  I.bindTap(again, () => restartGame());
  if (location.pathname.includes('/play/')) {
    const back = el('a', 'btn wide linkbtn', op, { text: '‹ All games' });
    back.href = '../../';
  }
  U.showEnd = (won) => {
    root.classList.toggle('won', won);
    U.vignette.classList.remove('on');
    setText(U.overTitle, won ? 'VICTORY!' : 'THE CITADEL FELL');
    while (U.overStats.firstChild) U.overStats.removeChild(U.overStats.firstChild);
    const secs = Math.round((G.stats.endTime - G.stats.startTime) / 1000);
    const rows = [
      ['Waves', `${won ? CONFIG.waves.length : G.wave} / ${CONFIG.waves.length}`],
      ['Enemies defeated', G.stats.kills],
      ['Towers built', G.stats.towersBuilt],
      ['Money earned', fmtMoney(G.stats.moneyEarned)],
      ['Coins collected', fmtMoney(G.stats.coins)],
      ['Time', `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`],
      ['Best wave', String(store.get(CONFIG.storageKeys.best, 0))],
    ];
    for (const [k, v] of rows) {
      el('span', 'k', U.overStats, { text: k });
      el('span', 'v', U.overStats, { text: String(v) });
    }
    showScreen('over');
  };

  // Overlays.
  U.rotate = el('div', 'overlay', root);
  el('div', 'rotico', U.rotate, { text: '⟳' });
  el('div', '', U.rotate, { text: 'Rotate your iPad to landscape' });
  U.small = el('div', 'overlay', root);
  el('div', '', U.small, { text: 'This window is too small. Make it a bit wider to play.' });
  U.restoring = el('div', 'overlay', root);
  el('div', '', U.restoring, { text: 'Restoring graphics…' });
  for (const o of [U.rotate, U.small, U.restoring]) o.style.display = 'none';

  // Toasts, banners, vignette, hints, coin flyers, damage numbers.
  U.toasts = el('div', 'toasts', root);
  U.banner = el('div', 'banner', root);
  U.bannerText = el('div', 't', U.banner);
  U.bannerSub = el('div', 's', U.banner);
  U.vignette = el('div', 'vignette', root);
  U.hint = el('div', 'panel hint', root);
  U.hint.style.display = 'none';
  U.flyLayer = el('div', 'flylayer', root);
  U.dmgLayer = el('div', 'dmglayer', root);
  G.fx.dmg = createDamageNumbers(U.dmgLayer);
  U.debug = el('div', 'debug', root);
  U.debug.style.display = 'none';

  // ---- Behaviour -----------------------------------------------------------------------------
  U.pause = (help) => {
    G.prevState = G.state;
    G.state = 'paused';
    I.releaseAll();
    if (document.pointerLockElement) document.exitPointerLock();
    U.back = 'pause';
    showScreen(help ? 'help' : 'pause');
  };
  U.resume = () => {
    if (G.state !== 'paused') return;
    G.state = G.prevState;
    showScreen(null);
  };
  U.startGame = () => {
    if (G.state !== 'menu' || !G.ready) return;
    audioInit();
    showScreen(null);
    beginRun();
  };
  U.layout = () => root.classList.toggle('lefty', !!G.settings.leftHanded);
  U.layout();

  U.toast = (text) => {
    const t = el('div', 'toast', U.toasts, { text });
    while (U.toasts.children.length > 3) U.toasts.removeChild(U.toasts.firstChild);
    setTimeout(() => t.classList.add('out'), 1700);
    setTimeout(() => t.remove(), 2100);
  };
  U.showBanner = (text, sub, boss) => {
    U.banner.classList.remove('show', 'boss');
    void U.banner.offsetWidth;
    setText(U.bannerText, text);
    setText(U.bannerSub, sub);
    U.banner.classList.toggle('boss', !!boss);
    U.banner.classList.add('show');
    U.vignette.classList.toggle('on', !!boss);
    if (boss) setTimeout(() => U.vignette.classList.remove('on'), 4500);
  };
  U.coinFly = (x, y, z) => {
    if (G.settings.reduceMotion) return;
    const v = TMP.v1.set(x, y, z).project(G.camera);
    const sx = (v.x * 0.5 + 0.5) * U.w, sy = (-v.y * 0.5 + 0.5) * U.h;
    const r = U.moneyEl.getBoundingClientRect();
    const c = el('div', 'coinfly', U.flyLayer, { svg: ICON.coin });
    c.style.transform = `translate(${sx}px, ${sy}px)`;
    requestAnimationFrame(() => {
      c.style.transform = `translate(${r.left + 12}px, ${r.top + r.height / 2}px) scale(0.6)`;
    });
    setTimeout(() => {
      c.remove();
      U.moneyEl.classList.remove('bump');
      void U.moneyEl.offsetWidth;
      U.moneyEl.classList.add('bump');
    }, 520);
  };
  const hintsSeen = new Set(store.get(CONFIG.storageKeys.hints, []));
  U.hintShow = (id, text) => {
    if (hintsSeen.has(id) || G.wave > 3) return;
    hintsSeen.add(id);
    store.set(CONFIG.storageKeys.hints, [...hintsSeen]);
    U.hint.textContent = text;
    U.hint.style.display = 'block';
    clearTimeout(U.hintTimer);
    U.hintTimer = setTimeout(() => {
      U.hint.style.display = 'none';
    }, 5500);
  };
  U.hoverAt = (x, y) => {
    if (!G.placing) return;
    const pad = padAt(x, y);
    const g = pad >= 0 && padFree(pad) ? { type: G.placing, pad, hover: true } : null;
    if ((g?.pad ?? -1) !== (G.ghost?.pad ?? -1)) {
      G.ghost = g;
      G.bus.emit('ghost');
    }
  };

  // Events from the game.
  G.bus.on('waveStart', (w, boss) => {
    U.showBanner(boss ? `BOSS WAVE ${w}` : `WAVE ${w}`, boss ? 'A giant is coming. Keep your towers loaded!' : `${CONFIG.waves.length - w} to go after this`, boss);
    if (w === 1) U.hintShow('shoot', U.isTouchDevice ? 'Drag on the right to aim, hold Fire to shoot.' : 'Click to lock the mouse, hold left click to shoot.');
  });
  G.bus.on('waveClear', (w, bonus) => toast(`Wave ${w} cleared! +$${bonus}`));
  G.bus.on('coin', (c) => U.coinFly(c.x, c.y + 0.3, c.z));
  G.bus.on('towerEmpty', () => U.hintShow('reload', U.isTouchDevice ? 'A tower is out of ammo: walk next to it and hold Reload.' : 'A tower is out of ammo: walk next to it and hold E.'));
  G.bus.on('kill', () => {
    if (G.stats.kills === 3) U.hintShow('coins', 'Walk over dropped coins to collect them.');
  });
  G.bus.on('phase', () => {
    if (G.wave === 0) U.hintShow('build', U.isTouchDevice ? 'Tap the hammer to build your first tower on a grey pad.' : 'Press B to build your first tower on a grey pad.');
  });
  G.bus.on('select', () => U.refreshPanel());
  G.bus.on('towerUpgraded', () => U.refreshPanel());
  G.bus.on('speed', (s) => setText(U.speedBtn, `${s}×`));
  G.bus.on('mode', () => {
    root.classList.toggle('building', G.mode === 'build');
    if (G.mode !== 'build') U.chooseCard(null);
  });
  G.bus.on('baseHit', () => {
    U.baseFill.parentElement.classList.remove('hit');
    void U.baseFill.offsetWidth;
    U.baseFill.parentElement.classList.add('hit');
  });
  G.bus.on('playerHit', () => {
    root.classList.remove('hurt');
    void root.offsetWidth;
    root.classList.add('hurt');
  });
  G.bus.on('inputKind', (k) => {
    root.classList.toggle('kbm', k === 'mouse' || k === 'keyboard');
  });
  root.classList.toggle('kbm', !U.isTouchDevice);
  root.classList.toggle('desk', !U.isTouchDevice);

  // ---- Per-frame HUD update (only writes what changed) ------------------------------------
  let miniT = 0;
  let panelT = 0;
  U.update = (dt) => {
    const p = G.player;
    setText(U.moneyText, fmtMoney(G.money));
    setText(U.waveText, `${G.wave} / ${CONFIG.waves.length}`);
    let alive = G.spawnQueue.length;
    for (const e of G.enemies.items) if (e.alive && e.state !== 'dying') alive++;
    setText(U.enemyText, G.state === 'wave' ? String(alive) : '–');
    const bh = Math.max(0, G.baseHp) / CONFIG.economy.baseHp;
    const bw = `${(bh * 100).toFixed(1)}%`;
    if (U.cache.bw !== bw) {
      U.cache.bw = bw;
      U.baseFill.style.width = bw;
      U.baseFill.style.background = bh > 0.6 ? '#5CFF8A' : bh > 0.3 ? '#FFD34E' : '#FF4D5E';
    }
    setText(U.baseText, String(Math.ceil(G.baseHp)));
    // Build phase box.
    const building = G.state === 'build' || (G.state === 'paused' && G.prevState === 'build');
    setShow(U.buildBox, building);
    if (building) {
      setText(U.countText, `Wave ${G.wave + 1} in ${Math.max(0, Math.ceil(G.countdown))}`);
      const bonus = Math.floor(Math.max(0, G.countdown)) * CONFIG.economy.earlyBonusPerSec;
      setText(U.startText, `Start now +$${bonus}`);
      const key = String(G.wave + 1);
      if (U.cache.preview !== key) {
        U.cache.preview = key;
        while (U.preview.firstChild) U.preview.removeChild(U.preview.firstChild);
        const counts = wavePreview(G.wave + 1);
        for (const [type, n] of Object.entries(counts)) {
          const chip = el('span', 'chip', U.preview);
          const dot = el('i', '', chip);
          dot.style.background = ENEMY_DOT[type];
          if (type === 'boss') dot.classList.add('boss');
          el('span', '', chip, { text: `${CONFIG.enemies[type].name} ×${n}` });
        }
      }
    }
    // Player.
    const hpw = `${(clamp(p.hp / CONFIG.player.hp, 0, 1) * 100).toFixed(1)}%`;
    if (U.cache.hpw !== hpw) {
      U.cache.hpw = hpw;
      U.hpFill.style.width = hpw;
    }
    setText(U.hpText, p.alive ? String(Math.ceil(p.hp)) : `${Math.ceil(Math.max(0, p.respawnT))}s`);
    setText(U.ammoText, p.reloading ? '…' : `${p.ammo}/${CONFIG.player.gun.mag}`);
    const rl = p.reloading ? 1 - p.reloadT / CONFIG.player.gun.reload : 0;
    const rk = rl.toFixed(2);
    if (U.cache.rl !== rk) {
      U.cache.rl = rk;
      U.reloadRing.style.setProperty('--p', `${rl * 360}deg`);
      U.reloadRing.style.opacity = p.reloading ? '1' : '0';
    }
    const dk = p.dashCd > 0 ? 1 - p.dashCd / CONFIG.player.dash.cooldown : 1;
    const dks = dk.toFixed(2);
    if (U.cache.dk !== dks) {
      U.cache.dk = dks;
      U.dashFill.style.width = `${dk * 100}%`;
      U.dashCd.style.setProperty('--p', `${(1 - dk) * 360}deg`);
      U.dashBtn.classList.toggle('cooling', dk < 1);
    }
    // Context interact button.
    const info = G.interact;
    const showCtx = !!info && info.action !== 'none' && G.mode === 'play' && p.alive;
    setShow(U.interactBtn, showCtx);
    if (showCtx) {
      setText(U.interactText, info.action === 'repair' ? `Hold: ${info.label}` : 'Hold: Reload');
      const key = info.action;
      if (U.cache.ia !== key) {
        U.cache.ia = key;
        U.interactIcon.innerHTML = info.action === 'repair' ? ICON.wrench : ICON.reload;
        U.interactBtn.classList.toggle('repair', info.action === 'repair');
      }
      const prog = info.time > 0 ? clamp(p.interactT / info.time, 0, 1) : 0;
      U.interactRing.style.setProperty('--p', `${prog * 360}deg`);
    }
    setShow(U.joyHint, G.mode === 'play' && G.input.lastInput === 'touch' && G.wave <= 1 && G.input.joy.id < 0 && G.state !== 'menu');
    // Build mode: card affordability, hint, ghost confirm buttons.
    if (G.mode === 'build') {
      for (const t of CONFIG.towerOrder) {
        let n = 0;
        for (const tw of G.towers) if (tw && tw.type === t) n++;
        setText(U.cardCount[t], String(n));
        setShow(U.cardCount[t], n > 0);
        const poor = G.money < CONFIG.towers[t].cost;
        const c = U.cards[t];
        if (c._poor !== poor) {
          c._poor = poor;
          c.classList.toggle('poor', poor);
        }
      }
      setText(U.buildHint, G.ghost && !G.ghost.hover ? 'Tap ✓ to build, ✕ to cancel' : G.placing ? 'Tap a free grey pad' : 'Pick a tower, or tap a tower to upgrade it');
    }
    const showGhost = !!G.ghost && !G.ghost.hover && G.mode === 'build';
    setShow(U.ghostBtns, showGhost);
    if (showGhost) {
      const [gx, gz] = LEVEL.pads[G.ghost.pad];
      const v = TMP.v1.set(gx, 5.5, gz).project(G.camera);
      U.ghostBtns.style.transform = `translate(${((v.x * 0.5 + 0.5) * U.w).toFixed(0)}px, ${((-v.y * 0.5 + 0.5) * U.h).toFixed(0)}px) translate(-50%, -100%)`;
    }
    // Tower panel stays fresh while open.
    panelT -= dt;
    if (G.selectedTower && panelT <= 0) {
      panelT = 0.25;
      U.refreshPanel();
      const inReach = G.interact && G.interact.tower === G.selectedTower && G.interact.action !== 'none';
      setShow(U.tpService, !!inReach);
      if (inReach) setText(U.tpService, `Hold: ${G.interact.label}`);
    }
    // Minimap at ~16 Hz.
    miniT -= dt;
    if (miniT <= 0) {
      miniT = 0.06;
      drawMinimap(U.mini);
    }
    if (U.debugOn) updateDebug();
  };
  return U;
}

function toast(text) {
  G.ui?.toast(text);
}

/** The circular minimap: lane, pads, towers (red when empty or broken), enemies, player. */
function drawMinimap(c) {
  const g = c.getContext('2d');
  const W = c.width;
  const S = W / 124;
  const tx = (x) => W / 2 + x * S;
  const tz = (z) => W / 2 + z * S;
  g.clearRect(0, 0, W, W);
  g.save();
  g.beginPath();
  g.arc(W / 2, W / 2, W / 2 - 3, 0, TAU);
  g.clip();
  g.fillStyle = 'rgba(80,150,60,0.92)';
  g.fillRect(0, 0, W, W);
  g.strokeStyle = '#E8C07D';
  g.lineWidth = 5;
  g.lineJoin = 'round';
  g.beginPath();
  for (let i = 0; i < PATH.count; i += 2) {
    const x = tx(PATH.xz[i * 2]), z = tz(PATH.xz[i * 2 + 1]);
    if (i === 0) g.moveTo(x, z);
    else g.lineTo(x, z);
  }
  g.stroke();
  for (const [i, [px, pz]] of LEVEL.pads.entries()) {
    const t = G.towers[i];
    g.fillStyle = !t ? 'rgba(220,230,240,0.55)' : t.hp <= 0 || (t.maxAmmo > 0 && t.ammo === 0) ? '#FF4D5E' : '#' + CONFIG.towers[t.type].color.toString(16).padStart(6, '0');
    g.fillRect(tx(px) - 4, tz(pz) - 4, 8, 8);
  }
  const B = LEVEL.base;
  g.fillStyle = '#C9CCD6';
  g.fillRect(tx(B.x) - 6, tz(B.z) - 6, 12, 12);
  g.fillStyle = '#FF3BD4';
  g.beginPath();
  g.arc(tx(LEVEL.portal.x), tz(LEVEL.portal.z), 5, 0, TAU);
  g.fill();
  for (const e of G.enemies.items) {
    if (!e.alive || e.state === 'dying') continue;
    g.fillStyle = ENEMY_DOT[e.type];
    const r = e.type === 'boss' ? 5 : 2.6;
    g.beginPath();
    g.arc(tx(e.x), tz(e.z), r, 0, TAU);
    g.fill();
  }
  // Player arrow.
  const p = G.player;
  g.save();
  g.translate(tx(p.x), tz(p.z));
  g.rotate(-p.aimYaw + Math.PI);
  g.fillStyle = p.alive ? '#FFD34E' : '#888';
  g.strokeStyle = '#1B1B2F';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(0, -8);
  g.lineTo(6, 6);
  g.lineTo(0, 3);
  g.lineTo(-6, 6);
  g.closePath();
  g.fill();
  g.stroke();
  g.restore();
  // View cone in build mode is not needed; outline ring.
  g.restore();
  g.strokeStyle = '#1B1B2F';
  g.lineWidth = 5;
  g.beginPath();
  g.arc(W / 2, W / 2, W / 2 - 3, 0, TAU);
  g.stroke();
}

function updateDebug() {
  const U = G.ui;
  const info = G.renderer.info;
  let n = 0;
  for (const e of G.enemies.items) if (e.alive) n++;
  const text = `FPS ${PERF.fps.toFixed(0)} (${PERF.ms.toFixed(1)} ms)\ncalls ${info.render.calls} · tris ${(info.render.triangles / 1000).toFixed(0)}k\ntier ${G.tier} · scale ${G.renderScale.toFixed(1)} · speed ${G.speed}×\nenemies ${n} · bolts ${G.fx.bolts.used} · particles ${G.fx.particles.used} · coins ${G.fx.coins.used}`;
  if (U.debugText._v !== text) {
    U.debugText._v = text;
    U.debugText.textContent = text;
  }
}

function setupDebug() {
  const U = G.ui;
  // Test hook (only with ?debug=1 or a three-finger tap).
  window.__bh = { G, CONFIG, LEVEL, PERF, CAM, placeTower, startWave, upgradeTower, sellTower, spawnEnemy, toggleBuildMode, damageEnemy, earn, restartGame };
  U.debugOn = true;
  U.debug.style.display = 'block';
  U.debugText = el('pre', '', U.debug);
  const row = el('div', 'rowbtns', U.debug);
  const b = (label, fn) => G.input.bindTap(el('button', 'btn small', row, { text: label }), fn);
  b('+$1000', () => earn(1000));
  b('Skip wave', () => {
    for (const e of G.enemies.items) if (e.alive) G.enemies.release(e);
    G.spawnQueue.length = 0;
    if (G.state === 'build') startWave(false);
  });
  b('Kill all', () => {
    for (const e of G.enemies.items) if (e.alive && e.state !== 'dying') damageEnemy(e, 1e9, null);
  });
  b('Tier', () => {

    G.settings.quality = o[(o.indexOf(G.tier) + 1) % o.length];

  });
}

// ---- 08-main.js ----
// =============================================================================================
// Main loop and state machine: loading | menu | build | wave | paused | gameover | victory.
// The simulation runs at a fixed 60 Hz through an accumulator (at most 5 steps per frame,
// frame time clamped to 0.1 s); rendering runs at whatever rate the display gives.
// Restart is leak-free: per-run objects (towers) are disposed and every pool is reset; the
// static world and the GPU resources are built once and reused.
// =============================================================================================

const STEP = 1 / CONFIG.sim.hz;
let accumulator = 0;
let lastFrame = performance.now();

function loadSettings() {
  const s = { ...CONFIG.settingsDefaults, ...store.get(CONFIG.storageKeys.settings, {}) };
  G.settings = s;
}

function saveSettings() {
  store.set(CONFIG.storageKeys.settings, G.settings);
}

function defaultTier() {
  const touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;
  return touch ? 'medium' : 'high';
}

function applyQualitySetting() {
  const q = G.settings.quality;
  applyTier(q === 'auto' ? defaultTier() : q);
}

// ---- Renderer -----------------------------------------------------------------------------------

function makeRenderer(msaa) {
  const r = new THREE.WebGLRenderer({ antialias: msaa, powerPreference: 'high-performance', alpha: false });
  r.info.autoReset = false; // reset once per frame, so bloom passes don't hide the scene's numbers
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.05;
  r.setClearColor(CONFIG.palette.skyHorizon);
  const c = r.domElement;
  c.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    G.contextLost = true;
    G.ui?.restoring && (G.ui.restoring.style.display = 'flex');
  });
  c.addEventListener('webglcontextrestored', () => {
    G.contextLost = false;
    if (G.ui?.restoring) G.ui.restoring.style.display = 'none';
    setupComposer();
    resize();
  });
  return r;
}

function recreateRenderer(msaa) {
  const old = G.renderer;
  const r = makeRenderer(msaa);
  G.stage.replaceChild(r.domElement, old.domElement);
  if (G.composer) {
    G.composer.dispose();
    G.composer = null;
  }
  old.dispose();
  G.renderer = r;
}

function resize() {
  const vv = window.visualViewport;
  const w = Math.round(vv ? vv.width : window.innerWidth);
  const h = Math.round(vv ? vv.height : window.innerHeight);
  if (!w || !h) return;
  const U = G.ui;
  if (U) {
    U.w = w;
    U.h = h;
    const size = { S: 0.86, M: 1, L: 1.18 }[G.settings.buttonSize] ?? 1;
    U.scale = clamp(Math.min(w / 1180, h / 820) * 1.08, 0.72, 1.3) * size;
    document.documentElement.style.setProperty('--ui', U.scale.toFixed(3));
    const portrait = U.isTouchDevice && h > w;
    const small = !portrait && w < 700;
    U.rotate.style.display = portrait ? 'flex' : 'none';
    U.small.style.display = small ? 'flex' : 'none';
    if ((portrait || small) && (G.state === 'build' || G.state === 'wave')) U.pause();
  }
  G.renderer.setSize(w, h, false);
  G.renderer.domElement.style.width = `${w}px`;
  G.renderer.domElement.style.height = `${h}px`;
  G.camera.aspect = w / h;
  G.camera.updateProjectionMatrix();
  if (G.composer) {
    G.composer.setPixelRatio(G.renderer.getPixelRatio());
    G.composer.setSize(w, h);
  }
}

// ---- Scene ----------------------------------------------------------------------------------------

function buildWorld() {
  const P = CONFIG.palette;
  const scene = G.scene;
  scene.fog = new THREE.Fog(P.skyHorizon, 125, 290);
  G.hemi = new THREE.HemisphereLight(0xcfe9ff, 0x3f6b2b, 1.05);
  scene.add(G.hemi);
  const sun = new THREE.DirectionalLight(0xffe3b8, 2.75);
  sun.position.set(30, 40, 22);
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.04;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 140;
  scene.add(sun);
  scene.add(sun.target);
  G.sun = sun;

  scene.add(buildSky());
  scene.add(buildTerrain());
  scene.add(buildPathMesh());
  // Raised grass blocks (before props and grass, which sit on top of them).
  G.static.tiles = buildTiles(makeRng(LEVEL.propSeed + 11));
  scene.add(G.static.tiles);
  // Pebbles scattered on the lane edges.
  const rng = makeRng(LEVEL.propSeed + 7);
  const peb = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.16, 0), toon(P.pebble), 160);
  for (let i = 0; i < 160; i++) {
    const d = rng.range(2, PATH.total - 2);
    pathAt(d, TMP.p);
    const side = rng.next() < 0.5 ? -1 : 1;
    const off = side * rng.range(0.6, LEVEL.pathHalfWidth + 0.2);
    TMP.q1.setFromAxisAngle(TMP.up, rng.next() * TAU);
    const s = rng.range(0.6, 1.4);
    TMP.m1.compose(TMP.v1.set(TMP.p.x - TMP.p.dz * off, 0.1, TMP.p.z + TMP.p.dx * off), TMP.q1, TMP.s1.set(s, s * 0.6, s));
    peb.setMatrixAt(i, TMP.m1);
  }
  peb.instanceMatrix.needsUpdate = true;
  scene.add(peb);
  // Pads (their own material so they can pulse in build mode).
  G.padMat = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: ART.gradient, emissive: 0x3ee0ff, emissiveIntensity: 0 });
  const pads = new THREE.Mesh(buildPadsGeometry(), G.padMat);
  pads.receiveShadow = true;
  pads.matrixAutoUpdate = false;
  pads.updateMatrix();
  scene.add(pads);
  // Citadel, crystal and flag.
  const B = LEVEL.base;
  const cit = new THREE.Mesh(buildCitadelGeometry(), ART.mats.vc);
  cit.position.set(B.x, 0, B.z);
  cit.castShadow = true;
  cit.receiveShadow = true;
  addOutline(cit);
  scene.add(cit);
  G.static.citadel = cit;
  const crystalMat = new THREE.MeshToonMaterial({ color: 0x5cff8a, emissive: 0x5cff8a, emissiveIntensity: 1.2, gradientMap: ART.gradient });
  const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1.0, 0), crystalMat);
  crystal.position.set(B.x, 7.2, B.z - 0.6);
  crystal.scale.set(1, 1.6, 1);
  addOutline(crystal);
  scene.add(crystal);
  G.static.crystal = crystal;
  const flagMat = new THREE.MeshToonMaterial({ color: 0x2f80ed, gradientMap: ART.gradient, side: THREE.DoubleSide });
  flagMat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = ART.time;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position); float k = (position.x + 0.9) / 1.8; transformed.z += sin(position.x * 3.0 - uTime * 6.0) * 0.18 * k; transformed.y += sin(position.x * 2.0 - uTime * 4.0) * 0.05 * k;');
  };
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.1, 10, 2), flagMat);
  flag.position.set(B.x + 0.9, 9.4, B.z - 0.6);
  scene.add(flag);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 3.6, 6), toon(0x6b5b4b));
  pole.position.set(B.x, 8.3, B.z - 0.6);
  scene.add(pole);
  // Cracks on the citadel when the base is low.
  const cracks = new THREE.Group();
  const crackMat = new THREE.MeshBasicMaterial({ color: 0x2b2b2b });
  for (let i = 0; i < 8; i++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.2 + Math.random(), 0.05), crackMat);
    const side = i % 2 ? 1 : -1;
    c.position.set(B.x + (Math.random() - 0.5) * 6, 1.6 + Math.random(), B.z + side * (B.size / 2 + 0.03));
    c.rotation.z = (Math.random() - 0.5) * 1.2;
    cracks.add(c);
  }
  cracks.visible = false;
  scene.add(cracks);
  G.static.cracks = cracks;
  // Portal and pond.
  G.static.portal = buildPortal();
  scene.add(G.static.portal.group);
  scene.add(buildPond());
  // Props (one merged mesh) with colliders, and grass.
  const props = new THREE.Mesh(buildPropsGeometry(makeRng(LEVEL.propSeed), G.colliders), ART.mats.vc);
  props.castShadow = true;
  props.receiveShadow = true;
  props.matrixAutoUpdate = false;
  props.updateMatrix();
  scene.add(props);
  const grass = buildGrass(CONFIG.tiers.high.grass, makeRng(LEVEL.propSeed + 3));
  grass.grassMax = grass.grass.count;
  grass.flowersMax = grass.flowers.count;
  scene.add(grass.grass);
  scene.add(grass.flowers);
  G.static.grass = grass;
  // Ghost tower for placement.
  G.ghostMat = new THREE.MeshBasicMaterial({ color: CONFIG.palette.valid, transparent: true, opacity: 0.5, depthWrite: false });
  G.ghostGroup = new THREE.Group();
  G.ghostGroup.visible = false;
  scene.add(G.ghostGroup);
}

// ---- Run lifecycle -----------------------------------------------------------------------------

function beginRun() {
  // Dispose per-run objects and reset every pool.
  for (const t of G.towers) if (t) disposeTower(t);
  G.towers = new Array(LEVEL.pads.length).fill(null);
  G.enemies.releaseAll();
  clearFx();
  for (const d of G.fx.dmg) {
    d.alive = false;
    d.el.style.display = 'none';
  }
  G.spawnQueue.length = 0;
  G.money = CONFIG.economy.startMoney;
  G.baseHp = CONFIG.economy.baseHp;
  G.wave = 0;
  G.speed = 1;
  G.slowMo = 0;
  G.mode = 'play';
  G.placing = null;
  G.ghost = null;
  G.selectedTower = null;
  G.interact = null;
  G.shake.t = 0;
  G.stats = { kills: 0, towersBuilt: 0, moneyEarned: 0, coins: 0, startTime: performance.now(), endTime: 0 };
  G.rng.reset(1);
  resetPlayer(G.player);
  CAM.blend = 0;
  accumulator = 0;
  G.ui.root.classList.remove('building', 'won');
  G.ui.showScreen(null);
  G.bus.emit('speed', 1);
  G.bus.emit('select', null);
  startBuildPhase();
}

function restartGame() {
  beginRun();
}

function endGame(won) {
  if (G.state === 'gameover' || G.state === 'victory') return;
  G.state = won ? 'victory' : 'gameover';
  G.stats.endTime = performance.now();
  const best = store.get(CONFIG.storageKeys.best, 0);
  const reached = won ? CONFIG.waves.length : G.wave;
  if (reached > best) store.set(CONFIG.storageKeys.best, reached);
  if (document.pointerLockElement) document.exitPointerLock();
  G.input.releaseAll();
  G.mode = 'play';
  G.ui.root.classList.remove('building');
  sfx(won ? 'victory' : 'defeat');
  if (!won) {
    spawnFlash(LEVEL.base.x, 4, LEVEL.base.z, 9, 0xff4d5e, 0.8);
    spawnParticles(80, LEVEL.base.x, 4, LEVEL.base.z, 0xc9ccd6, { speed: 12, life: 1.4, size: 0.6 });
  }
  setTimeout(() => G.ui.showEnd(won), won ? 600 : 1300);
}

// ---- Per-step and per-frame updates ------------------------------------------------------------

function simStep(dt) {
  waveProgress(dt);
  if (G.state !== 'build' && G.state !== 'wave') return;
  updatePlayer(dt);
  updateEnemies(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateCoins(dt);
}

function applyLook() {
  const A = G.input.actions;
  const p = G.player;
  if (G.mode === 'play' && (G.state === 'build' || G.state === 'wave')) {
    const base = G.input.lastInput === 'touch' ? CONFIG.look.touchSens : G.input.lastInput === 'gamepad' ? 0.0045 : CONFIG.look.mouseSens;
    const s = base * G.settings.lookSens;
    p.aimYaw = wrapAngle(p.aimYaw - A.lookDX * s);
    p.pitch = clamp(p.pitch + A.lookDY * s * (G.settings.invertY ? -1 : 1), CONFIG.look.minPitch, CONFIG.look.maxPitch);
  }
  A.lookDX = 0;
  A.lookDY = 0;
}

function updateWorldVisuals(dt, simDt) {
  const P = CONFIG.palette;
  // Crystal: green → yellow → red with the base's health; smoke and cracks below 30%.
  const k = clamp(G.baseHp / CONFIG.economy.baseHp, 0, 1);
  const cr = G.static.crystal;
  const c = TMP.c1.set(0xff4d5e).lerp(TMP.c2.set(0xffd34e), clamp(k * 2, 0, 1));
  if (k > 0.5) c.lerp(TMP.c2.set(0x5cff8a), (k - 0.5) * 2);
  cr.material.color.copy(c);
  cr.material.emissive.copy(c);
  cr.rotation.y += dt * 0.8;
  cr.position.y = 7.2 + Math.sin(G.time * 1.6) * 0.25;
  G.static.cracks.visible = k < 0.3;
  if (k < 0.3 && Math.random() < dt * 6) spawnParticles(1, LEVEL.base.x + (Math.random() - 0.5) * 6, 4, LEVEL.base.z + (Math.random() - 0.5) * 6, 0x50545e, { speed: 0.4, up: 3, life: 2, size: 0.7, grav: -1.2, drag: 0.4 });
  // Portal: spinning ring, particles drifting in.
  const portal = G.static.portal;
  portal.ring.rotation.z += dt * 0.6;
  if (Math.random() < dt * 14) {
    const a = Math.random() * TAU;
    const r = 4 + Math.random() * 2;
    const px = LEVEL.portal.x, pz = LEVEL.portal.z;
    const sx = px + Math.cos(a) * 0.8, sy = 3 + Math.sin(a) * r, sz = pz + Math.cos(a) * r;
    spawnParticles(1, sx, sy, sz, P.portal, { speed: 0, life: 0.9, size: 0.25, grav: 0, drag: 0, vx: (px - sx) * 1.1, vy: (3 - sy) * 1.1, vz: (pz - sz) * 1.1, glow: true });
  }
  // Pads pulse in build mode.
  G.padMat.emissiveIntensity = G.mode === 'build' ? 0.12 + Math.sin(G.time * 4) * 0.08 : 0;
  // Ghost tower and range rings.
  const fx = G.fx;
  const ghost = G.ghost;
  if (ghost) {
    const geo = towerGeometry(ghost.type, 1);
    if (G.ghostGroup.userData.type !== ghost.type) {
      while (G.ghostGroup.children.length) G.ghostGroup.remove(G.ghostGroup.children[0]);
      const b = new THREE.Mesh(geo.base, G.ghostMat);
      const h = new THREE.Mesh(geo.head, G.ghostMat);
      h.position.y = geo.headY;
      G.ghostGroup.add(b, h);
      G.ghostGroup.userData.type = ghost.type;
    }
    const [gx, gz] = LEVEL.pads[ghost.pad];
    G.ghostGroup.position.set(gx, 0.35 + Math.sin(G.time * 5) * 0.08, gz);
    G.ghostGroup.visible = true;
    const ok = padFree(ghost.pad) && G.money >= CONFIG.towers[ghost.type].cost;
    G.ghostMat.color.set(ok ? P.valid : P.invalid);
    const r = CONFIG.towers[ghost.type].range;
    fx.range.visible = true;
    fx.range.position.set(gx, 0.2, gz);
    fx.range.scale.set(r, 1, r);
    fx.range.material.uniforms.uColor.value.set(ghost.type === 'pylon' ? P.pylon : ok ? P.range : P.invalid);
    fx.aura.visible = false;
  } else {
    G.ghostGroup.visible = false;
    const t = G.selectedTower;
    if (t) {
      const r = t.stats.range * (1 + t.buffRange);
      fx.range.visible = true;
      fx.range.position.set(t.x, 0.2, t.z);
      fx.range.scale.set(r, 1, r);
      fx.range.material.uniforms.uColor.value.set(t.type === 'pylon' ? P.pylon : P.range);
      fx.aura.visible = false;
    } else {
      fx.range.visible = false;
      fx.aura.visible = false;
    }
  }
  updateEffects(dt, simDt);
}

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (document.hidden || G.contextLost) return;
  dt = Math.min(dt, CONFIG.sim.maxFrame);
  G.time += dt;
  ART.time.value = G.time;
  G.input.poll();
  applyLook();
  const playing = G.state === 'build' || G.state === 'wave';
  let simDt = 0;
  if (playing) {
    // Boss deaths slow time down briefly; game speed scales simulation time only.
    const slow = G.slowMo > 0 ? 0.25 : 1;
    if (G.slowMo > 0) G.slowMo -= dt;
    simDt = dt * G.speed * slow;
    accumulator += simDt;
    let steps = 0;
    while (accumulator >= STEP && steps < CONFIG.sim.maxSteps) {
      simStep(STEP);
      G.input.consume();
      accumulator -= STEP;
      steps++;
    }
    if (steps === CONFIG.sim.maxSteps) accumulator = 0;
  } else if (G.state === 'gameover' || G.state === 'victory') {
    simDt = dt;
  }
  // Visuals.
  if (G.state !== 'menu' && G.state !== 'loading') {
    animatePlayer(G.player, playing ? dt * G.speed : 0);
    for (const t of G.towers) if (t) animateTower(t, dt);
  } else {
    // Menu: a slow orbit around the field.
    const a = G.time * 0.05;
    G.camera.position.set(Math.cos(a) * 70, 38, Math.sin(a) * 70);
    G.camera.lookAt(0, 0, 0);
  }
  updateWorldVisuals(dt, simDt);
  renderEnemies(dt);
  renderInstanced();
  if (G.state !== 'menu' && G.state !== 'loading') updateCamera(dt);
  updateDamageNumbers(dt);
  G.ui.update(dt);
  G.renderer.info.reset();
  if (G.composer) G.composer.render(dt);
  else G.renderer.render(G.scene, G.camera);
  perfWatch(dt);
}

// ---- Boot ----------------------------------------------------------------------------------------

function boot() {
  loadSettings();
  const stage = document.getElementById('stage');
  G.stage = stage;
  const root = document.getElementById('ui');
  ART.gradient = makeGradient();
  makeTextures();
  ART.mats.vc = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: ART.gradient });
  ART.mats.enemyBody = enemyMaterial(false);
  ART.mats.enemyOutline = enemyMaterial(true);
  ART.mats.flashWhite = new THREE.MeshToonMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.7, gradientMap: ART.gradient });
  const tier = G.settings.quality === 'auto' ? defaultTier() : G.settings.quality;
  G.tier = tier;
  G.tierCfg = CONFIG.tiers[tier];
  G.renderer = makeRenderer(G.tierCfg.msaa);
  stage.appendChild(G.renderer.domElement);
  G.scene = new THREE.Scene();
  G.camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, window.innerWidth / window.innerHeight, 0.3, 700);
  buildWorld();
  G.enemies = createEnemyPool();
  createFx();
  G.player = createPlayer();
  resetPlayer(G.player);
  G.towers = new Array(LEVEL.pads.length).fill(null);
  createInput(stage);
  const ui = createUI(root);
  ui.root = root;
  applyTier(tier, { initial: true });
  ui.syncQualityBtn();
  const best = store.get(CONFIG.storageKeys.best, 0);
  ui.bestText.textContent = best > 0 ? `Best: wave ${best}` : '';
  if (new URLSearchParams(location.search).get('debug') === '1') setupDebug();
  // Three-finger tap opens the debug overlay too.
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 3 && !ui.debugOn) setupDebug();
  }, { passive: true });

  // Resize, orientation, visibility.
  window.addEventListener('resize', resize);
  window.visualViewport?.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  const hide = () => {
    G.input.releaseAll();
    if (G.state === 'build' || G.state === 'wave') ui.pause();
    if (AUDIO.ctx && AUDIO.ctx.state === 'running') AUDIO.ctx.suspend().catch(() => {});
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hide();
    else {
      lastFrame = performance.now();
      if (AUDIO.ctx) AUDIO.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener('pagehide', hide);
  // Block page zoom, scrolling, selection and the callout on iPad.
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1 || e.target.closest('#stage, .hud, .tray')) e.preventDefault();
  }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const t = performance.now();
    if (t - lastTouchEnd < 320 && !e.target.closest('input, select')) e.preventDefault();
    lastTouchEnd = t;
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('selectstart', (e) => {
    if (!e.target.closest?.('input')) e.preventDefault();
  });

  resize();
  // Pre-warm: compile every material and draw a frame with all pools visible behind the start
  // screen, so the first wave never stutters on shader compilation.
  G.scene.traverse((o) => {
    if (o.isInstancedMesh) o.visible = true;
  });
  G.ghostGroup.visible = true;
  const ghostGeo = towerGeometry('blaster', 1);
  G.ghostGroup.add(new THREE.Mesh(ghostGeo.base, G.ghostMat));
  for (const t of CONFIG.towerOrder) for (let l = 1; l <= 3; l++) towerGeometry(t, l);
  G.renderer.compile(G.scene, G.camera);
  if (G.composer) G.composer.render(0);
  else G.renderer.render(G.scene, G.camera);
  G.ghostGroup.visible = false;
  G.state = 'menu';
  G.ready = true;
  ui.loadingText.style.display = 'none';
  ui.showScreen('start');
  // Touch icon for the Home Screen, drawn on a canvas.
  makeTouchIcon();
  requestAnimationFrame(frame);
}

function makeTouchIcon() {
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 180);
  grad.addColorStop(0, '#6EC6FF');
  grad.addColorStop(1, '#7BC950');
  g.fillStyle = grad;
  g.fillRect(0, 0, 180, 180);
  g.fillStyle = '#C9CCD6';
  g.strokeStyle = '#1B1B2F';
  g.lineWidth = 6;
  g.beginPath();
  g.moveTo(30, 150); g.lineTo(30, 80); g.lineTo(55, 80); g.lineTo(55, 100); g.lineTo(75, 100); g.lineTo(75, 70);
  g.lineTo(105, 70); g.lineTo(105, 100); g.lineTo(125, 100); g.lineTo(125, 80); g.lineTo(150, 80); g.lineTo(150, 150); g.closePath();
  g.fill();
  g.stroke();
  g.fillStyle = '#5CFF8A';
  g.beginPath();
  g.moveTo(90, 18); g.lineTo(104, 44); g.lineTo(90, 66); g.lineTo(76, 44); g.closePath();
  g.fill();
  g.stroke();
  const url = c.toDataURL('image/png');
  for (const rel of ['apple-touch-icon', 'icon']) {
    const l = document.createElement('link');
    l.rel = rel;
    l.href = url;
    document.head.appendChild(l);
  }
}

try {
  boot();
} catch (err) {
  console.error(err);
  const box = document.getElementById('fatal');
  if (box) {
    box.style.display = 'flex';
    box.textContent = `Sorry, the game could not start: ${err && err.message ? err.message : err}`;
  }
}

window.__blockholdStarted = true;

</script>
<script>
  // If the module can't load (offline, very old browser), say so instead of a blank page.
  setTimeout(function () {
    if (!window.__blockholdStarted) {
      var f = document.getElementById('fatal');
      if (f && f.style.display !== 'flex') { f.style.display = 'flex'; f.textContent = 'Loading the 3D engine… If this stays, check your internet connection and reload.'; }
    }
  }, 12000);
</script>
</body>

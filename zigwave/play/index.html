<!-- Tailwind only adds polish to menus/HUD. Everything essential is in the <style> below, so the game is unaffected if this fails. -->
<script async src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --c1:#ff4fd8; --c2:#b388ff; --bg:#12041f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; color:#fff;
    font-family:"Segoe UI","Trebuchet MS",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #root { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage { position:relative; overflow:hidden; background:var(--bg); box-shadow:0 0 3em rgba(0,0,0,.8); }
  #game { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }

  /* HUD */
  #hud { position:absolute; inset:0; pointer-events:none; display:none; }
  #hud.on { display:block; }
  #attempt { position:absolute; left:1.1em; top:.8em; font-weight:800; font-size:1.25em; letter-spacing:.12em;
    text-transform:uppercase; text-shadow:0 0 .6em var(--c1); }
  #prog { position:absolute; left:50%; top:1em; width:38%; transform:translateX(-50%); display:flex; align-items:center; gap:.7em; }
  #progTrack { position:relative; flex:1; height:.7em; border:1px solid rgba(255,255,255,.55); border-radius:.4em;
    background:rgba(0,0,0,.45); overflow:hidden; box-shadow:0 0 .7em var(--c1); }
  #progFill { position:absolute; inset:0; transform-origin:0 50%; transform:scaleX(0);
    background:linear-gradient(90deg,var(--c2),var(--c1)); }
  #progBest { position:absolute; top:0; bottom:0; width:2px; background:#fff; opacity:.75; left:0; }
  #progPct { min-width:3em; text-align:right; font-weight:800; font-variant-numeric:tabular-nums; text-shadow:0 0 .6em var(--c1); }
  .iconbtn { position:absolute; top:.7em; height:2.3em; min-width:2.6em; padding:0 .6em; border-radius:.5em; border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.5); color:#fff; font:inherit; font-size:.85em; font-weight:700; letter-spacing:.08em; cursor:pointer; pointer-events:auto; }
  .iconbtn:hover,.iconbtn:focus { border-color:var(--c1); box-shadow:0 0 .7em var(--c1); outline:none; }
  #btnMute { right:.9em; z-index:30; }
  #btnPause { right:10.4em; display:none; z-index:30; }
  #btnPause.on { display:block; }

  /* Screens */
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1em;
    padding:1.5em; overflow:auto; touch-action:pan-y; z-index:20; background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.72)); }
  .screen.on { display:flex; }
  .title { margin:0; font-size:5.6em; line-height:1; font-weight:900; letter-spacing:.08em; font-style:italic;
    color:#fff; text-shadow:0 0 .12em #fff,0 0 .35em var(--c1),0 0 .9em var(--c1); }
  .title span { color:var(--c1); }
  h2.head { margin:0; font-size:2.4em; font-weight:900; letter-spacing:.14em; text-transform:uppercase; text-shadow:0 0 .4em var(--c1); text-align:center; }
  .sub { margin:0; opacity:.85; letter-spacing:.1em; text-transform:uppercase; font-size:.95em; text-align:center; }
  .foot { margin:.4em 0 0; opacity:.6; font-size:.82em; letter-spacing:.04em; text-align:center; }
  .col { display:flex; flex-direction:column; gap:.75em; align-items:stretch; min-width:18em; }
  .row { display:flex; flex-direction:row; gap:.9em; justify-content:center; flex-wrap:wrap; }
  .btn { font:inherit; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#fff; cursor:pointer; padding:.75em 1.8em;
    border-radius:.6em; border:2px solid var(--c1); background:rgba(10,0,20,.72);
    box-shadow:0 0 .7em color-mix(in srgb,var(--c1) 55%,transparent),inset 0 0 .7em color-mix(in srgb,var(--c1) 22%,transparent);
    text-shadow:0 0 .5em var(--c1); outline:none; }
  .btn.primary { background:var(--c1); color:#100018; text-shadow:none; }
  .btn:hover,.btn:focus { border-color:#fff; box-shadow:0 0 1.3em var(--c1),inset 0 0 .9em color-mix(in srgb,var(--c1) 35%,transparent); }

  .cards { display:grid; gap:1em; width:100%; max-width:66em; }
  .cards.levels { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .cards.skins { grid-template-columns:repeat(3,minmax(0,1fr)); max-width:52em; gap:.8em; }
  .card { font:inherit; color:#fff; text-align:left; cursor:pointer; padding:1em 1.1em; border-radius:.8em; border:2px solid rgba(255,255,255,.22);
    background:rgba(6,0,14,.78); outline:none; display:flex; flex-direction:column; gap:.3em; min-width:0; --cc:var(--c1); }
  .card:hover,.card:focus { border-color:var(--cc); box-shadow:0 0 1.1em var(--cc); }
  .card.sel { border-color:var(--cc); }
  .card .num { font-size:.8em; letter-spacing:.2em; opacity:.6; }
  .card .name { font-size:1.35em; font-weight:800; letter-spacing:.03em; color:var(--cc); text-shadow:0 0 .5em var(--cc); }
  .card .diff { font-size:.85em; letter-spacing:.1em; text-transform:uppercase; opacity:.85; }
  .meter { height:.5em; border-radius:.3em; background:rgba(255,255,255,.14); overflow:hidden; margin-top:.5em; }
  .meter i { display:block; height:100%; background:var(--cc); }
  .card .best { font-size:.85em; opacity:.85; font-variant-numeric:tabular-nums; }
  .stars { font-size:1.5em; letter-spacing:.08em; color:#ffd65c; text-shadow:0 0 .5em rgba(255,200,60,.7); line-height:1.1; }
  .stars .off { color:rgba(255,255,255,.2); text-shadow:none; }
  .skin { padding:.5em .6em .55em; gap:.1em; }
  .skin canvas { width:100%; aspect-ratio:16/8; border-radius:.45em; display:block; background:#05000a; }
  .skin .name { font-size:1em; }
  .skin .req { font-size:.78em; opacity:.8; min-height:1.3em; }
  .skin.locked canvas { opacity:.4; filter:saturate(.35); }
  .skin.locked .name { color:#aaa; text-shadow:none; }
  .skin.on { box-shadow:0 0 1em var(--cc); border-color:var(--cc); }
  .skin.deny { animation:deny .25s linear; }
  @keyframes deny { 25%{transform:translateX(-.3em)} 75%{transform:translateX(.3em)} }
  .statline { display:flex; gap:2em; justify-content:center; font-size:1.1em; letter-spacing:.06em; }
  .statline b { color:var(--c1); font-size:1.3em; }
  #unlocks { color:#ffd65c; letter-spacing:.06em; text-align:center; min-height:1.3em; text-shadow:0 0 .6em rgba(255,200,60,.6); }
  #toast { position:absolute; left:50%; bottom:1.6em; transform:translateX(-50%); z-index:40; padding:.5em 1.2em; border-radius:.5em; pointer-events:none;
    background:rgba(0,0,0,.8); border:1px solid #ffd65c; color:#ffd65c; font-weight:700; letter-spacing:.06em; opacity:0; transition:opacity .25s; white-space:nowrap; }
  #toast.on { opacity:1; }
  #rotate { display:none; }
  @media (orientation:portrait) and (max-width:700px) { #rotate { display:block; } }
  #botPanel { position:absolute; left:1em; bottom:1em; z-index:50; max-width:80%; max-height:60%; overflow:auto; margin:0; padding:.7em 1em; font:12px/1.4 Consolas,Menlo,monospace;
    background:rgba(0,0,0,.85); color:#7dffb0; border:1px solid #7dffb0; white-space:pre; pointer-events:none; }
</style>

<body>
<div id="root"><div id="stage">
  <canvas id="game" aria-label="ZIGWAVE game canvas"></canvas>

  <div id="hud">
    <div id="attempt" class="uppercase font-extrabold tracking-widest">Attempt <span id="attemptN">1</span></div>
    <div id="prog"><div id="progTrack"><div id="progFill"></div><div id="progBest"></div></div><span id="progPct">0%</span></div>
  </div>
  <button id="btnPause" class="iconbtn transition-shadow" aria-label="Pause">II</button>
  <button id="btnMute" class="iconbtn transition-shadow" aria-label="Toggle sound">SOUND ON</button>

  <section id="s-main" class="screen">
    <h1 class="title select-none">ZIG<span>WAVE</span></h1>
    <p class="sub" id="mainSub"></p>
    <div class="col">
      <button id="bPlay" class="btn primary transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Play Level</button>
      <button id="bLevels" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Level Select</button>
      <button id="bSkins" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Skin Select</button>
    </div>
    <p class="foot">Hold Space, Up, click or touch to rise. Release to fall. R restart &middot; Esc pause &middot; M mute &middot; <a href="../../" style="color:inherit">All games</a></p>
    <p class="foot" id="rotate">Rotate your device to landscape for the best view.</p>
  </section>

  <section id="s-levels" class="screen">
    <h2 class="head">Level Select</h2>
    <div class="cards levels" id="levelCards"></div>
    <button id="bLevelsBack" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Back</button>
  </section>

  <section id="s-skins" class="screen">
    <h2 class="head">Skin Select</h2>
    <div class="cards skins" id="skinCards"></div>
    <button id="bSkinsBack" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Back</button>
  </section>

  <section id="s-pause" class="screen">
    <h2 class="head">Paused</h2>
    <div class="col">
      <button id="bResume" class="btn primary transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Resume</button>
      <button id="bRestart" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Restart</button>
      <button id="bQuit" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Main Menu</button>
    </div>
    <p class="foot">Esc returns to the menu</p>
  </section>

  <section id="s-complete" class="screen">
    <h2 class="head">Level Complete</h2>
    <p class="sub" id="doneName"></p>
    <div class="stars" id="doneStars" style="font-size:3em"></div>
    <div class="statline"><span>Attempts <b id="doneAttempts">1</b></span><span>Best <b>100%</b></span></div>
    <div id="unlocks"></div>
    <div class="row">
      <button id="bNext" class="btn primary transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Continue</button>
      <button id="bReplay" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Replay</button>
      <button id="bDoneMenu" class="btn transition-transform duration-100 hover:scale-105 active:scale-95" data-nav>Main Menu</button>
    </div>
  </section>

  <div id="toast"></div>
</div></div>

<script>
(function () {
'use strict';

/*<sim>*/
/* ==========================================================================
   1. CONFIG / CONSTANTS
   ========================================================================== */
const CFG = {
  W: 1280, H: 720,               // logical canvas size (16:9)
  TICK_HZ: 240, DT: 1 / 240,     // fixed simulation step
  MAX_FRAME: 0.1,                // longest wall-clock gap simulated in one frame
  PLAYER_SCREEN_X: 0.30,         // player is held 30% from the left edge
  HIT_R: 6,                      // hitbox radius; the sprite is about 30px long
  MINI_SCALE: 0.7,               // sprite + hitbox scale inside "mini" sections
  TOP: 30, BOT: 690, MID: 360,   // hard limits for corridor walls
  TRAIL_LIFE: 0.8,               // seconds
  TRAIL_SAMPLE_TICKS: 6,
  DEATH_DELAY: 0.6, SHAKE_TIME: 0.3, SHAKE_PX: 14,
  WIN_DELAY: 1.1,
  BUCKET: 200, BUCKET_MARGIN: 24,// collision broadphase
  STORAGE_KEY: 'waveGame.v1'
};

/* ==========================================================================
   2. LEVEL DATA
   A level is a list of compact corridor sections. compileLevel() expands them
   into plain {type:'block'|'spike'|...} obstacles; no level knowledge lives in
   the drawing code.

   Section fields
     path  string of steps, each `run` px wide:
             U/D full slope up/down, u/d half slope, F flat
     n     repeat count for path            gap   vertical corridor height
     to    instead of path: travel straight to this centre y
     slope/mini  portal at section start that changes slope and sprite size
     spikes {side:'top'|'bot'|'both', every, h, w}   rows along the walls
     gates  {every, open, w, ys:[...]}  pillar pairs with an opening offset ys[i]
     dia    {every, r, ys:[...]}        free-floating diamonds offset ys[i]
   ========================================================================== */
const LEVELS = [
  {
    id: 'drift', name: 'Neon Drift', difficulty: 'Easy', speed: 320, slope: 1,
    hint: 'HOLD to rise  /  RELEASE to fall',
    palette: { bg: '#12041f', bg2: '#35105c', grid: '#ff4fd8', wall: '#1d0836', outline: '#ff5ce1', glow: '#c13bff', accent: '#b388ff' },
    music: { bpm: 124, root: 45, kick: 'x...x...x...x...', hat: '..x...x...x...x.', bass: [0, 0, 12, 0, 7, 0, 10, 0, 3, 3, 15, 3, 5, 5, 7, 10], arp: [24, 31, 36, 31, 27, 34, 39, 34] },
    sections: [
      { path: 'F', run: 1000, gap: 560 },
      { path: 'F', run: 560, n: 6, gap: 560, gates: { every: 560, open: 300, w: 48, ys: [-90, 90, -60, 120, -120, 60] } },
      { path: 'UUDDDDUU', run: 70, n: 4, gap: 380 },
      { path: 'F', run: 300, n: 6, gap: 440, spikes: { side: 'both', every: 56, h: 34, w: 46 }, dia: { every: 420, r: 56, ys: [0, -90, 90, 0] } },
      { path: 'uuuFdddFdddFuuuF', run: 110, n: 2, gap: 300 },
      { path: 'UDDU', run: 100, n: 6, gap: 260 },
      { path: 'F', run: 440, n: 6, gap: 540, gates: { every: 440, open: 260, w: 48, ys: [100, -100, 40, -130, 130, 0] } },
      { path: 'F', run: 800, gap: 560 }
    ]
  },
  {
    id: 'circuit', name: 'Circuit Line', difficulty: 'Medium', speed: 430, slope: 1,
    palette: { bg: '#03161a', bg2: '#07403c', grid: '#2fffd0', wall: '#062822', outline: '#39ff9c', glow: '#18e0ff', accent: '#7dfff0' },
    music: { bpm: 140, root: 40, kick: 'x..x..x.x..x..x.', hat: '.xx.xx.x.xx.xx.x', bass: [0, 0, 0, 12, 0, 0, 7, 0, 5, 5, 5, 17, 3, 3, 10, 3], arp: [24, 28, 31, 36, 31, 28, 24, 19] },
    sections: [
      { path: 'F', run: 1000, gap: 520 },
      { path: 'UDDU', run: 120, n: 8, gap: 200 },
      { path: 'F', run: 300, n: 6, gap: 250, spikes: { side: 'both', every: 44, h: 28, w: 38 } },
      { path: 'uuuuFFddddddddFFuuuu', run: 90, n: 2, gap: 190 },
      { path: 'F', run: 380, n: 8, gap: 520, gates: { every: 380, open: 180, w: 44, ys: [-120, 100, -40, 140, -140, 60, -80, 120] } },
      { path: 'UFUFDFDFDFDFUFUF', run: 90, n: 3, gap: 180 },
      { path: 'UD', run: 84, n: 12, gap: 165 },
      { path: 'F', run: 420, n: 5, gap: 420, dia: { every: 210, r: 54, ys: [-90, 90] } },
      { path: 'UUDDDDUU', run: 110, n: 4, gap: 180 },
      { path: 'F', run: 900, gap: 520 }
    ]
  },
  {
    id: 'crimson', name: 'Crimson Descent', difficulty: 'Hard / Demon', speed: 560, slope: 1,
    palette: { bg: '#0a0003', bg2: '#320408', grid: '#ff2a3c', wall: '#170305', outline: '#ff2a3c', glow: '#ff0022', accent: '#ff9a6b' },
    music: { bpm: 172, root: 38, kick: 'x.x.x.x.x.x.xxx.', hat: 'xxxxxxxxxxxxxxxx', bass: [0, 0, 12, 0, 1, 1, 13, 1, 0, 0, 12, 0, 6, 6, 5, 3], arp: [24, 27, 30, 36, 30, 27, 25, 31] },
    sections: [
      { path: 'F', run: 1300, gap: 580 },
      // Tunnels
      { path: 'UDDU', run: 110, n: 9, gap: 150 },
      { path: 'UUDDDDUU', run: 80, n: 4, gap: 150 },
      // Gates
      { path: 'F', run: 300, n: 10, gap: 540, gates: { every: 300, open: 155, w: 44, ys: [-130, 110, -60, 150, -150, 40, -100, 130, -20, 90] } },
      // Spam
      { path: 'UD', run: 76, n: 20, gap: 128 },
      { path: 'UUDUDD', run: 70, n: 7, gap: 128 },
      // Spiked tunnel
      { path: 'F', run: 210, n: 13, gap: 195, spikes: { side: 'both', every: 34, h: 24, w: 30 } },
      // Mini: steeper slope, smaller hitbox
      { slope: 2, mini: true, path: 'UD', run: 60, n: 20, gap: 215 },
      { path: 'UUDD', run: 44, n: 8, gap: 205 },
      { slope: 1, mini: false, path: 'F', run: 320, gap: 300 },
      // Shallow narrow slopes
      { path: 'uuuuFddddddddFuuuu', run: 80, n: 3, gap: 124 },
      // Diamond slalom
      { path: 'F', run: 340, n: 7, gap: 340, dia: { every: 170, r: 46, ys: [-70, 70] } },
      // Stairs
      { path: 'UFUFDFDFDFDFUFUF', run: 70, n: 3, gap: 142 },
      // Mini again
      { slope: 2, mini: true, path: 'UDDU', run: 52, n: 11, gap: 205 },
      { slope: 1, mini: false, path: 'F', run: 280, gap: 280 },
      // Final gauntlet
      { path: 'UD', run: 66, n: 22, gap: 120 },
      { path: 'F', run: 260, n: 7, gap: 520, gates: { every: 260, open: 150, w: 44, ys: [-110, 100, -130, 80, -70, 120, 0] } },
      { path: 'F', run: 1000, gap: 580 }
    ]
  }
];

/* ==========================================================================
   3. PHYSICS: level compiler, collision, player step
   ========================================================================== */
function spikePoints(o) {
  const r = o.rotation * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
  const P = (lx, ly) => [o.x + lx * cs - ly * sn, o.y + lx * sn + ly * cs];
  return [P(-o.w / 2, 2), P(o.w / 2, 2), P(0, -o.h)]; // base sunk 2px into its mount
}

function compileLevel(def) {
  const V = [], obstacles = [], portals = [], warnings = [], jobs = [];
  const stepOf = { U: -1, D: 1, u: -0.5, d: 0.5, F: 0 };
  let x = 0, c = CFG.MID, slope = def.slope || 1, mini = false, g = def.sections[0].gap;
  V.push({ x: -800, c, g }, { x: 0, c, g });
  const push = () => V.push({ x, c, g });

  for (const s of def.sections) {
    if (s.slope !== undefined && (s.slope !== slope || !!s.mini !== mini)) {
      slope = s.slope; mini = !!s.mini;
      portals.push({ x, y: c, h: Math.max(g, s.gap), slope, mini });
    }
    if (Math.abs(s.gap - g) > 1) {                 // funnel between corridor heights
      x += Math.max(100, Math.abs(s.gap - g) * 0.7); g = s.gap; push();
    }
    const x0 = x, v0 = V.length - 1;
    if (s.to !== undefined) {
      const dy = s.to - c;
      if (Math.abs(dy) > 0.01) { x += Math.abs(dy) / (slope * (s.k || 1)); c = s.to; push(); }
    } else {
      for (const ch of s.path.repeat(s.n || 1)) { x += s.run; c += stepOf[ch] * s.run * slope; push(); }
    }
    jobs.push({ s, x0, x1: x, v0, v1: V.length - 1 });
  }
  const endX = x;
  x += 1800; push();                                // walls run on past the end portal

  for (const v of V) {
    if (v.c - v.g / 2 < CFG.TOP - 1 || v.c + v.g / 2 > CFG.BOT + 1) warnings.push('corridor out of bounds at x=' + Math.round(v.x));
  }

  const wallAt = (px) => {
    let lo = 0, hi = V.length - 2;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (V[m].x <= px) lo = m; else hi = m - 1; }
    const a = V[lo], b = V[lo + 1], t = b.x > a.x ? Math.min(1, Math.max(0, (px - a.x) / (b.x - a.x))) : 0;
    const cc = a.c + (b.c - a.c) * t, gg = a.g + (b.g - a.g) * t;
    return { c: cc, top: cc - gg / 2, bot: cc + gg / 2 };
  };

  // Walls become axis-aligned rects plus right triangles.
  for (let i = 0; i + 1 < V.length; i++) {
    const a = V[i], b = V[i + 1];
    if (b.x <= 0) continue;
    const ta = a.c - a.g / 2, tb = b.c - b.g / 2, ba = a.c + a.g / 2, bb = b.c + b.g / 2, w = b.x - a.x;
    const tm = Math.min(ta, tb), bm = Math.max(ba, bb);
    obstacles.push({ type: 'block', wall: true, x: a.x, y: -200, w, h: tm + 200 });
    obstacles.push({ type: 'block', wall: true, x: a.x, y: bm, w, h: CFG.H + 200 - bm });
    if (ta !== tb) obstacles.push({ type: 'slope', wall: true, pts: ta < tb ? [[a.x, ta], [b.x, ta], [b.x, tb]] : [[a.x, tb], [b.x, tb], [a.x, ta]] });
    if (ba !== bb) obstacles.push({ type: 'slope', wall: true, pts: ba > bb ? [[a.x, ba], [b.x, ba], [b.x, bb]] : [[a.x, bb], [b.x, bb], [a.x, ba]] });
  }

  for (const { s, x0, x1, v0, v1 } of jobs) {
    if (s.spikes) {
      const { side, every, h, w } = s.spikes;
      for (let i = v0; i < v1; i++) {
        const a = V[i], b = V[i + 1];
        for (const edge of side === 'both' ? ['top', 'bot'] : [side]) {
          const sign = edge === 'top' ? -1 : 1;
          const ay = a.c + sign * a.g / 2, by = b.c + sign * b.g / 2;
          const len = Math.hypot(b.x - a.x, by - ay), n = Math.floor(len / every);
          const ang = Math.atan2(by - ay, b.x - a.x) * 180 / Math.PI;
          for (let k = 0; k < n; k++) {
            const t = (k + 0.5) / n;
            obstacles.push({ type: 'spike', x: a.x + (b.x - a.x) * t, y: ay + (by - ay) * t, w, h, rotation: edge === 'top' ? ang + 180 : ang });
          }
        }
      }
    }
    if (s.gates) {
      const { every, open, w, ys } = s.gates, tip = s.gates.tip || 30;
      let i = 0;
      for (let gx = x0 + every / 2; gx < x1; gx += every, i++) {
        const wall = wallAt(gx), oy = wall.c + ys[i % ys.length], t = oy - open / 2, b = oy + open / 2;
        if (t - tip > wall.top + 4) {
          obstacles.push({ type: 'block', pillar: 'top', x: gx - w / 2, y: -200, w, h: t - tip + 200, edge: wall.top });
          obstacles.push({ type: 'spike', x: gx, y: t - tip, w, h: tip, rotation: 180 });
        }
        if (b + tip < wall.bot - 4) {
          obstacles.push({ type: 'block', pillar: 'bot', x: gx - w / 2, y: b + tip, w, h: CFG.H + 200 - (b + tip), edge: wall.bot });
          obstacles.push({ type: 'spike', x: gx, y: b + tip, w, h: tip, rotation: 0 });
        }
      }
    }
    if (s.dia) {
      const { every, r, ys } = s.dia;
      let i = 0;
      for (let dx = x0 + every / 2; dx < x1; dx += every, i++) {
        obstacles.push({ type: 'diamond', x: dx, y: wallAt(dx).c + ys[i % ys.length], r });
      }
    }
  }

  const speed = def.speed, stepX = speed * CFG.DT;
  const lv = { def, id: def.id, name: def.name, speed, slope: def.slope || 1, stepX, startY: CFG.MID, endX, duration: endX / speed,
    V, obstacles, portals, warnings, wallAt, palette: def.palette, grid: [], chunks: null };
  buildGrid(lv);
  return lv;
}

// Turn obstacles into prepared solids and bucket them by x.
function buildGrid(lv) {
  const B = CFG.BUCKET, M = CFG.BUCKET_MARGIN, solids = [];
  const tri = (p) => {
    const xs = [p[0][0], p[1][0], p[2][0]], ys = [p[0][1], p[1][1], p[2][1]];
    solids.push({ k: 1, ax: p[0][0], ay: p[0][1], bx: p[1][0], by: p[1][1], cx: p[2][0], cy: p[2][1],
      minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) });
  };
  for (const o of lv.obstacles) {
    if (o.type === 'block') solids.push({ k: 0, minX: o.x, maxX: o.x + o.w, minY: o.y, maxY: o.y + o.h });
    else if (o.type === 'spike') tri(spikePoints(o));
    else if (o.type === 'slope') tri(o.pts);
    else if (o.type === 'diamond') {
      tri([[o.x - o.r, o.y], [o.x, o.y - o.r], [o.x + o.r, o.y]]);
      tri([[o.x - o.r, o.y], [o.x + o.r, o.y], [o.x, o.y + o.r]]);
    }
  }
  const grid = lv.grid = new Array(Math.ceil((lv.endX + 400) / B) + 1);
  for (let i = 0; i < grid.length; i++) grid[i] = [];
  for (const s of solids) {
    const i0 = Math.max(0, Math.floor((s.minX - M) / B)), i1 = Math.min(grid.length - 1, Math.floor((s.maxX + M) / B));
    for (let i = i0; i <= i1; i++) grid[i].push(s);
  }
}

function distSq2Seg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + t * dx - px, qy = ay + t * dy - py;
  return qx * qx + qy * qy;
}

function circleTri(x, y, r, s) {
  // Centre inside the triangle?
  const d1 = (x - s.bx) * (s.ay - s.by) - (s.ax - s.bx) * (y - s.by);
  const d2 = (x - s.cx) * (s.by - s.cy) - (s.bx - s.cx) * (y - s.cy);
  const d3 = (x - s.ax) * (s.cy - s.ay) - (s.cx - s.ax) * (y - s.ay);
  if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) return true;
  const r2 = r * r;
  return distSq2Seg(x, y, s.ax, s.ay, s.bx, s.by) < r2 || distSq2Seg(x, y, s.bx, s.by, s.cx, s.cy) < r2 || distSq2Seg(x, y, s.cx, s.cy, s.ax, s.ay) < r2;
}

function circleRect(x, y, r, s) {
  const dx = x < s.minX ? s.minX - x : x > s.maxX ? x - s.maxX : 0;
  const dy = y < s.minY ? s.minY - y : y > s.maxY ? y - s.maxY : 0;
  return dx * dx + dy * dy < r * r;
}

function hits(lv, x, y, r) {
  const b = lv.grid[Math.floor(x / CFG.BUCKET)];
  if (!b) return false;
  for (let i = 0; i < b.length; i++) {
    const s = b[i];
    if (x + r < s.minX || x - r > s.maxX || y + r < s.minY || y - r > s.maxY) continue;
    if (s.k === 0 ? circleRect(x, y, r, s) : circleTri(x, y, r, s)) return true;
  }
  return false;
}

function newPlayer(lv) {
  return { tick: 0, x: 0, y: lv.startY, px: 0, py: lv.startY, hold: false, slope: lv.slope, mini: false, pi: 0, dead: false, won: false };
}

// One fixed 1/240 s step. x comes from the tick count, so it can't drift.
function stepPlayer(p, hold, lv, extraR) {
  p.px = p.x; p.py = p.y; p.hold = hold; p.tick++;
  p.x = p.tick * lv.stepX;
  while (p.pi < lv.portals.length && lv.portals[p.pi].x <= p.x) { p.slope = lv.portals[p.pi].slope; p.mini = lv.portals[p.pi].mini; p.pi++; }
  p.y += (hold ? -1 : 1) * lv.stepX * p.slope;
  const r = (p.mini ? CFG.HIT_R * CFG.MINI_SCALE : CFG.HIT_R) + (extraR || 0);
  if (hits(lv, p.x, p.y, r)) p.dead = true;
  else if (p.x >= lv.endX) p.won = true;
}

// Fixed-timestep clock. Calls onTick(simTime) once for every whole DT behind
// `now` and returns the interpolation factor for rendering.
function advanceClock(clock, now, onTick) {
  if (now - clock.sim > CFG.MAX_FRAME) clock.sim = now - CFG.MAX_FRAME;
  while (clock.sim + CFG.DT <= now) { clock.sim += CFG.DT; onTick(clock.sim); }
  return (now - clock.sim) / CFG.DT;
}

/* --------------------------------------------------------------------------
   Auto-play solver (only runs with ?bot). BFS over hold/release decisions
   using the real stepPlayer + collision code.
   -------------------------------------------------------------------------- */
function solveLevel(lv, opt) {
  const every = (opt && opt.every) || 4, extraR = (opt && opt.extraR) || 0;
  let frontier = [newPlayer(lv)], furthest = 0;
  const trace = [];
  for (;;) {
    const next = new Map(), parents = [], holds = [];
    for (let i = 0; i < frontier.length; i++) {
      for (let h = 0; h < 2; h++) {
        const n = Object.assign({}, frontier[i]);
        for (let k = 0; k < every && !n.dead && !n.won; k++) stepPlayer(n, h === 1, lv, extraR);
        if (n.dead) continue;
        furthest = Math.max(furthest, n.x);
        if (n.won) {
          const seq = [h === 1];
          for (let d = trace.length - 1, idx = i; d >= 0; d--) { seq.push(trace[d].holds[idx] === 1); idx = trace[d].parents[idx]; }
          seq.reverse();
          const inputs = [];
          for (const v of seq) for (let k = 0; k < every; k++) inputs.push(v);
          return { solved: true, inputs, furthest: lv.endX };
        }
        const key = Math.round(n.y * 16) * 8 + n.slope;
        if (!next.has(key)) { next.set(key, n); parents.push(i); holds.push(h); }
      }
    }
    if (!next.size) return { solved: false, furthest };
    frontier = Array.from(next.values());
    trace.push({ parents: Int32Array.from(parents), holds: Uint8Array.from(holds) });
  }
}

function replayLevel(lv, inputs) {
  const p = newPlayer(lv);
  while (!p.dead && !p.won && p.tick < inputs.length) stepPlayer(p, !!inputs[p.tick], lv);
  return { won: p.won, dead: p.dead, ticks: p.tick, seconds: p.tick * CFG.DT, x: p.x };
}

function botReport(lv) {
  const base = solveLevel(lv, { every: 4 });
  const replay = base.solved ? replayLevel(lv, base.inputs) : null;
  const coarse = solveLevel(lv, { every: 10 });       // about 42 ms between decisions
  let margin = -1;
  for (let m = 0; m <= 18; m += 2) { if (solveLevel(lv, { every: 4, extraR: m }).solved) margin = m; else break; }
  return { id: lv.id, name: lv.name, solved: !!(replay && replay.won), seconds: replay ? replay.seconds : null, coarse42ms: coarse.solved,
    safetyMarginPx: margin, furthestPct: Math.floor(100 * base.furthest / lv.endX), inputs: base.inputs, warnings: lv.warnings };
}

/* ==========================================================================
   5. STORAGE (versioned, try/catch, in-memory fallback)
   ========================================================================== */
const Store = {
  data: null,
  defaults() { return { v: 1, skin: 'classic', unlocked: ['classic'], level: 0, muted: false, totalAttempts: 0, levels: {} }; },
  sanitize(o) {
    const d = this.defaults();
    if (!o || typeof o !== 'object' || o.v !== 1) return d;
    if (Array.isArray(o.unlocked)) d.unlocked = Array.from(new Set(['classic'].concat(o.unlocked.filter((id) => SKINS.some((s) => s.id === id)))));
    if (d.unlocked.includes(o.skin)) d.skin = o.skin;
    if (Number.isInteger(o.level) && o.level >= 0 && o.level < LEVELS.length) d.level = o.level;
    d.muted = !!o.muted;
    if (Number.isFinite(o.totalAttempts) && o.totalAttempts > 0) d.totalAttempts = Math.floor(o.totalAttempts);
    for (const lv of LEVELS) {
      const r = o.levels && o.levels[lv.id];
      if (r && typeof r === 'object') {
        const done = r.done === true, best = done ? 100 : Math.min(99, Math.max(0, Math.floor(+r.best || 0)));
        const cap = done ? 3 : best >= 50 ? 1 : 0, stars = Math.floor(+r.stars || 0);
        d.levels[lv.id] = { best, stars: Math.max(done ? 2 : 0, Math.min(cap, stars)), done };
      }
    }
    return d;
  },
  load() {
    let parsed = null;
    try { const raw = window.localStorage.getItem(CFG.STORAGE_KEY); if (raw) parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    this.data = this.sanitize(parsed);
  },
  save() { try { window.localStorage.setItem(CFG.STORAGE_KEY, JSON.stringify(this.data)); } catch (e) { /* keep running from memory */ } },
  level(id) { return this.data.levels[id] || (this.data.levels[id] = { best: 0, stars: 0, done: false }); },
  totalStars() { return LEVELS.reduce((n, l) => n + this.level(l.id).stars, 0); }
};

function skinUnlocked(skin) {
  const u = skin.unlock;
  if (!u) return true;
  if (u.type === 'level') return Store.level(u.id).done;
  if (u.type === 'stars') return Store.totalStars() >= u.n;
  return Store.data.totalAttempts >= u.n;
}

const Sound = {
  ctx: null, master: null, noise: null, song: null, step: 0, nextT: 0,
  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = Store.data.muted ? 0 : 0.8;
        this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate * 0.6, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') { const r = this.ctx.resume(); if (r && r.catch) r.catch(() => {}); }
  },
  setMuted(m) { if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ctx.currentTime, 0.01); },
  ready() { return this.ctx && this.ctx.state === 'running'; },
  tone(freq, t, dur, type, vol, opts) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (opts && opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = o;
    if (opts && opts.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.lp; o.connect(f); out = f; }
    out.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  burst(t, dur, vol, type, freq) {
    const c = this.ctx, s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    s.buffer = this.noise; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  hover() { if (this.ready()) this.tone(1100, this.ctx.currentTime, 0.04, 'triangle', 0.05); },
  tap() { if (this.ready()) { const t = this.ctx.currentTime; this.tone(660, t, 0.07, 'square', 0.07); this.tone(990, t + 0.05, 0.08, 'square', 0.06); } },
  deny() { if (this.ready()) this.tone(170, this.ctx.currentTime, 0.14, 'sawtooth', 0.09); },
  flip() { if (this.ready()) this.tone(2300, this.ctx.currentTime, 0.018, 'square', 0.012); },
  death() {
    if (!this.ready()) return;
    const t = this.ctx.currentTime;
    this.burst(t, 0.35, 0.3, 'lowpass', 2600);
    this.tone(320, t, 0.42, 'sawtooth', 0.2, { to: 36 });
  },
  complete() {
    if (!this.ready()) return;
    const t = this.ctx.currentTime;
    [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => this.tone(this.midi(m), t + i * 0.085, 0.28, 'square', 0.08));
    this.tone(this.midi(84), t + 0.6, 0.7, 'triangle', 0.12);
  },
  unlock() { if (this.ready()) { const t = this.ctx.currentTime; [76, 83, 88].forEach((m, i) => this.tone(this.midi(m), t + i * 0.07, 0.2, 'triangle', 0.1)); } },
  midi(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  startMusic(def) {

  stopMusic() { this.song = null; },
  // Lookahead scheduler; called every frame.
  update() {

    const m = this.song, sd = 60 / m.bpm / 4, now = this.ctx.currentTime;
    if (this.nextT < now) this.nextT = now + 0.02;

      if (m.kick[i] === 'x') this.tone(150, t, 0.13, 'sine', 0.28, { to: 42 });
      if (m.hat[i] === 'x') this.burst(t, 0.03, 0.05, 'highpass', 7500);
      if (i === 4 || i === 12) this.burst(t, 0.1, 0.08, 'bandpass', 2200);
      this.tone(this.midi(m.root + m.bass[this.step % m.bass.length]), t, sd * 0.85, 'sawtooth', 0.07, { lp: 620 });
      if (this.step % 2 === 0) this.tone(this.midi(m.root + m.arp[(this.step >> 1) % m.arp.length]), t, sd * 1.5, 'square', 0.016, { lp: 2400 });

    }
  }
};

/* ==========================================================================
   7. INPUT
   Events are timestamped and applied at the matching simulation tick, so
   reaction timing doesn't depend on the display's refresh rate.

const Input = {
  keys: new Set(), ptrs: new Set(), queue: [], cur: false,
  emit() { this.queue.push({ t: performance.now() / 1000, v: this.keys.size + this.ptrs.size > 0 }); },
  sample(t) { while (this.queue.length && this.queue[0].t <= t) this.cur = this.queue.shift().v; return this.cur; },
  reset() { this.keys.clear(); this.ptrs.clear(); this.queue.length = 0; this.cur = false; }
};

const canvas = document.getElementById('game');

function fit() {

const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };
const mixHex = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')'; };

// Pre-builds static Path2D batches per chunk so glow is drawn once per chunk, not per object.
function prepareRender(lv) {

  const touch = (c, a, b) => { c.minX = Math.min(c.minX, a); c.maxX = Math.max(c.maxX, b); };
  let topLast = null, botLast = null;
  for (let i = 0; i + 1 < lv.V.length; i++) {
    const a = lv.V[i], b = lv.V[i + 1], c = chunkAt(a.x);
    const ta = a.c - a.g / 2, tb = b.c - b.g / 2, ba = a.c + a.g / 2, bb = b.c + b.g / 2;
    touch(c, a.x, b.x);
    c.fill.moveTo(a.x, -40); c.fill.lineTo(a.x, ta); c.fill.lineTo(b.x, tb); c.fill.lineTo(b.x + 1, tb); c.fill.lineTo(b.x + 1, -40); c.fill.closePath();
    c.fill.moveTo(a.x, CFG.H + 40); c.fill.lineTo(a.x, ba); c.fill.lineTo(b.x, bb); c.fill.lineTo(b.x + 1, bb); c.fill.lineTo(b.x + 1, CFG.H + 40); c.fill.closePath();
    if (topLast !== c) { c.stroke.moveTo(a.x, ta); topLast = c; }
    c.stroke.lineTo(b.x, tb);
    c.detail.moveTo(a.x, ta - 16); c.detail.lineTo(b.x, tb - 16); c.detail.moveTo(b.x, tb); c.detail.lineTo(b.x, tb - 16);
  }
  for (let i = 0; i + 1 < lv.V.length; i++) {
    const a = lv.V[i], b = lv.V[i + 1], c = chunkAt(a.x);
    const ba = a.c + a.g / 2, bb = b.c + b.g / 2;
    if (botLast !== c) { c.stroke.moveTo(a.x, ba); botLast = c; }
    c.stroke.lineTo(b.x, bb);
    c.detail.moveTo(a.x, ba + 16); c.detail.lineTo(b.x, bb + 16); c.detail.moveTo(b.x, bb); c.detail.lineTo(b.x, bb + 16);
  }
  for (const o of lv.obstacles) {
    if (o.wall) continue;
    if (o.type === 'block') {
      const c = chunkAt(o.x), top = o.pillar === 'top', y0 = top ? o.edge : o.y, y1 = top ? o.y + o.h : o.edge;
      touch(c, o.x, o.x + o.w);
      c.fill.rect(o.x, y0, o.w, y1 - y0);
      c.stroke.moveTo(o.x, top ? y0 : y1); c.stroke.lineTo(o.x, top ? y1 : y0); c.stroke.moveTo(o.x + o.w, top ? y0 : y1); c.stroke.lineTo(o.x + o.w, top ? y1 : y0);
      for (let y = y0 + 20; y < y1 - 6; y += 28) { c.detail.moveTo(o.x + 8, y); c.detail.lineTo(o.x + o.w - 8, y); }
    } else if (o.type === 'spike') {
      const p = spikePoints(o), c = chunkAt(o.x);
      touch(c, o.x - o.w, o.x + o.w);
      for (const t of [c.fill, c.stroke]) { t.moveTo(p[0][0], p[0][1]); t.lineTo(p[2][0], p[2][1]); t.lineTo(p[1][0], p[1][1]); }
      c.fill.closePath();
    } else if (o.type === 'diamond') {
      const c = chunkAt(o.x), q = [[o.x - o.r, o.y], [o.x, o.y - o.r], [o.x + o.r, o.y], [o.x, o.y + o.r]];
      touch(c, o.x - o.r, o.x + o.r);
      for (const t of [c.fill, c.stroke]) { t.moveTo(q[0][0], q[0][1]); q.slice(1).forEach((v) => t.lineTo(v[0], v[1])); t.closePath(); }
      const r2 = o.r * 0.45;
      c.detail.moveTo(o.x - r2, o.y); c.detail.lineTo(o.x, o.y - r2); c.detail.lineTo(o.x + r2, o.y); c.detail.lineTo(o.x, o.y + r2); c.detail.closePath();
    }
  }
  lv.chunks = Array.from(map.values());
}

const bgCache = new Map();
function drawBackground(lvPal, camX, pulse, seconds) {
  const S = View.S, W = CFG.W, H = CFG.H;
  let grad = bgCache.get(lvPal);
  if (!grad) {
    grad = ctx.createRadialGradient(W * 0.6, H * 0.5, 40, W * 0.6, H * 0.5, W * 0.85);
    grad.addColorStop(0, lvPal.bg2); grad.addColorStop(1, lvPal.bg);
    bgCache.set(lvPal, grad);
  }
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  // Far drifting diamonds
  ctx.strokeStyle = rgba(lvPal.accent, 0.1); ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < 9; i++) {
    const r = 40 + hash01(i) * 90, span = W + 400;
    const x = ((hash01(i + 20) * span - camX * (0.08 + hash01(i + 40) * 0.08)) % span + span) % span - 200, y = 90 + hash01(i + 60) * 540 + Math.sin(seconds * 0.4 + i) * 10;
    ctx.moveTo(x - r, y); ctx.lineTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.closePath();
  }
  ctx.stroke();

  // Two parallax grid layers, batched as one path each
  const layer = (sp, f, a) => {
    ctx.strokeStyle = rgba(lvPal.grid, a); ctx.lineWidth = 1; ctx.beginPath();
    for (let x = -(((camX * f) % sp) + sp) % sp; x <= W; x += sp) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = (H / 2) % sp; y <= H; y += sp) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  };
  layer(160, 0.25, 0.05 + 0.03 * pulse);
  layer(80, 0.5, 0.05 + 0.05 * pulse);
}

function drawWalls(lv, camX, pulse) {
  const S = View.S, pal = lv.palette, x0 = camX - 30, x1 = camX + CFG.W + 30;
  const vis = lv.chunks.filter((c) => c.maxX >= x0 && c.minX <= x1);
  ctx.setTransform(S, 0, 0, S, -camX * S + Shake.x * S, Shake.y * S);
  ctx.fillStyle = pal.wall;
  for (const c of vis) ctx.fill(c.fill);
  ctx.strokeStyle = rgba(pal.outline, 0.3); ctx.lineWidth = 1.5;
  for (const c of vis) ctx.stroke(c.detail);
  ctx.strokeStyle = pal.outline; ctx.lineWidth = 2.5; ctx.lineJoin = 'miter'; ctx.miterLimit = 8;
  ctx.shadowColor = pal.glow; ctx.shadowBlur = (12 + 8 * pulse) * S;
  for (const c of vis) ctx.stroke(c.stroke);
  ctx.shadowBlur = 0;
}

function drawPortal(x, y, h, color, seconds) {
  const S = View.S, wobble = 1 + Math.sin(seconds * 6) * 0.04, rx = 22 * wobble, ry = (h / 2 - 6) * wobble;
  ctx.save();
  ctx.fillStyle = rgba(color, 0.14); ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.shadowColor = color; ctx.shadowBlur = 18 * S; ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

// Draws one trail. pts: oldest to newest, each {x, y, t, d}. Splitting by age into
// a few stroke batches gives the fade without a stroke per segment.
function drawTrail(c, pts, now, skin, S, width) {
  const n = pts.length;
  if (n < 2) return;
  const life = CFG.TRAIL_LIFE, K = skin.style === 'rainbow' ? 10 : 6, w = width || 1;
  c.save();
  c.lineJoin = 'miter'; c.miterLimit = 10; c.lineCap = 'butt';
  c.shadowColor = skin.glow; c.shadowBlur = 12 * S * w;
  const interp = (a, b, t) => {
    const f = (t - a.t) / ((b.t - a.t) || 1);
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, d: a.d + (b.d - a.d) * f };
  };
  for (let b = K - 1; b >= 0; b--) {
    const tNew = now - life * b / K, tOld = now - life * (b + 1) / K;
    let i = 0;
    while (i < n - 1 && pts[i + 1].t <= tOld) i++;
    if (i >= n - 1 || pts[i].t >= tNew) continue;
    const first = pts[i].t < tOld ? interp(pts[i], pts[i + 1], tOld) : pts[i];
    let ox = 0, oy = 0, color = skin.trail;
    const fade = 1 - b / K, seed = Math.floor(now * 24) + b * 7;
    if (skin.style === 'glitch') {
      if (hash01(seed) < 0.18) continue;
      ox = (hash01(seed + 1) - 0.5) * 12 * (1 - fade); oy = (hash01(seed + 2) - 0.5) * 12 * (1 - fade);
      color = hash01(seed + 3) < 0.25 ? '#e9ffe9' : skin.trail;
    } else if (skin.style === 'ember') {
      color = mixHex(skin.primary, skin.secondary, 1 - fade);
    } else if (skin.style === 'rainbow') {
      color = 'hsl(' + Math.round(first.d * 0.45 + now * 200) % 360 + ',100%,66%)';
    }
    c.beginPath(); c.moveTo(first.x + ox, first.y + oy);
    let j = i + 1;
    for (; j < n && pts[j].t < tNew; j++) c.lineTo(pts[j].x + ox, pts[j].y + oy);
    if (j < n) { const e = interp(pts[j - 1], pts[j], tNew); c.lineTo(e.x + ox, e.y + oy); }
    c.globalAlpha = Math.pow(fade, 1.2);
    c.lineWidth = (2.2 + 4 * fade) * w;
    c.strokeStyle = color;
    if (skin.style === 'dashed') { c.setLineDash([16 * w, 11 * w]); c.lineDashOffset = first.d; }
    c.stroke();
    if (skin.style === 'core') {
      c.shadowBlur = 0; c.strokeStyle = '#0a0014'; c.lineWidth *= 0.5; c.stroke();
      c.shadowBlur = 12 * S * w;
    }
  }
  c.restore();
}

function polygon(c, pts, flipY) {
  c.beginPath();
  pts.forEach((p, i) => { const y = flipY ? -p[1] : p[1]; if (i) c.lineTo(p[0], y); else c.moveTo(p[0], y); });
  c.closePath();
}

function drawArrow(c, skin, x, y, angle, scale, S, alpha) {
  c.save();
  c.translate(x, y); c.rotate(angle); c.scale(scale, scale);
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.lineJoin = 'miter';
  c.shadowColor = skin.glow; c.shadowBlur = 14 * S;
  c.fillStyle = skin.secondary;
  polygon(c, skin.fin, false); c.fill();
  polygon(c, skin.fin, true); c.fill();
  c.fillStyle = skin.primary;
  polygon(c, skin.body, false); c.fill();
  c.shadowBlur = 0;
  c.lineWidth = 1.5; c.strokeStyle = skin.edge; c.stroke();
  const e = skin.eye;
  if (e.kind === 'round') {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(e.x, 0, e.r, 0, 7); c.fill();
    c.fillStyle = '#20002f'; c.beginPath(); c.arc(e.x + 1.1, 0, e.r * 0.5, 0, 7); c.fill();
  } else if (e.kind === 'visor') {
    c.fillStyle = '#04161c'; c.fillRect(e.x - e.w / 2 - 1, -e.h / 2 - 1, e.w + 2, e.h + 2);
    c.fillStyle = '#fff'; c.fillRect(e.x - e.w / 2 + 3, -e.h / 2, e.w - 3, e.h);
  } else if (e.kind === 'slit') {
    c.fillStyle = '#fff4c9'; c.beginPath(); c.ellipse(e.x, 0, e.w, e.h + 1, 0, 0, 7); c.fill();
    c.fillStyle = '#531000'; c.beginPath(); c.ellipse(e.x, 0, 0.9, e.h + 0.6, 0, 0, 7); c.fill();
  } else if (e.kind === 'pixel') {
    c.fillStyle = '#031a0a'; c.fillRect(e.x, -5, 4, 4); c.fillRect(e.x, 1, 4, 4);
    c.fillStyle = '#d6ffe3'; c.fillRect(e.x + 2, -4, 2, 2); c.fillRect(e.x + 2, 2, 2, 2);
  } else if (e.kind === 'ring') {
    c.strokeStyle = '#efe4ff'; c.lineWidth = 1.6; c.beginPath(); c.arc(e.x, 0, e.r, 0, 7); c.stroke();
    c.fillStyle = '#efe4ff'; c.beginPath(); c.arc(e.x, 0, 0.9, 0, 7); c.fill();
  } else if (e.kind === 'star') {
    c.fillStyle = '#2b1050'; c.beginPath(); c.moveTo(e.x - e.r, 0); c.lineTo(e.x, -e.r * 0.65); c.lineTo(e.x + e.r, 0); c.lineTo(e.x, e.r * 0.65); c.closePath(); c.fill();
  }
  c.restore();
}

/* Particles: stored flat, drawn per color in a single path. */
const FX = {
  list: [], colors: ['#fff'],
  burst(x, y, colors, n, speed, life) {
    this.colors = colors;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.25 + Math.random());
      this.list.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.5 + Math.random() * 0.5), max: life, size: 3 + Math.random() * 5, c: i % colors.length });
    }
  },
  update(dt) {
    const l = this.list;
    for (let i = l.length - 1; i >= 0; i--) {
      const p = l[i];
      p.life -= dt;
      if (p.life <= 0) { l[i] = l[l.length - 1]; l.pop(); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= 1 - 1.4 * dt;
    }
  },
  draw() {
    if (!this.list.length) return;
    ctx.save();
    ctx.shadowBlur = 10 * View.S;
    for (let c = 0; c < this.colors.length; c++) {
      ctx.fillStyle = ctx.shadowColor = this.colors[c];
      ctx.beginPath();
      for (const p of this.list) {
        if (p.c !== c) continue;
        const s = p.size * Math.min(1, p.life / p.max * 1.6);
        ctx.rect(p.x - s / 2, p.y - s / 2, s, s);
      }
      ctx.fill();
    }
    ctx.restore();
  }
};

const Shake = { x: 0, y: 0, left: 0,
  start() { this.left = CFG.SHAKE_TIME; },
  update(dt) {
    if (this.left <= 0) { this.x = this.y = 0; return; }
    this.left = Math.max(0, this.left - dt);
    const k = this.left / CFG.SHAKE_TIME, a = CFG.SHAKE_PX * k * k;
    this.x = (Math.random() * 2 - 1) * a; this.y = (Math.random() * 2 - 1) * a;
  }
};

function renderGame(alpha) {
  const lv = G.lv, p = G.p, pal = lv.palette, S = View.S;
  const rx = p.px + (p.x - p.px) * alpha, ry = p.py + (p.y - p.py) * alpha;
  const camX = rx - CFG.W * CFG.PLAYER_SCREEN_X;
  const phase = (G.clock * lv.def.music.bpm / 60) % 1, pulse = Math.pow(1 - phase, 3);
  const skin = skinById(Store.data.skin);

  drawBackground(pal, camX, pulse, G.clock);
  drawWalls(lv, camX, pulse);

  if (lv.def.hint && G.attempts === 1) {
    ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.font = '700 26px "Segoe UI",system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(lv.def.hint, 620, 250);
  }
  for (const pt of lv.portals) if (Math.abs(pt.x - camX - CFG.W / 2) < CFG.W) drawPortal(pt.x, pt.y, pt.h, pal.accent, G.clock);
  if (lv.endX - camX < CFG.W + 80) { const w = lv.wallAt(lv.endX); drawPortal(lv.endX + 10, w.c, w.bot - w.top, '#ffffff', G.clock); }

  const T = G.trail;
  if (G.mode !== 'dead' || G.deadT < 0.4) {
    T.push({ x: rx, y: ry, t: G.clock, d: G.trailD });
    drawTrail(ctx, T, G.clock, skin, S, 1);
    T.pop();
  }

  if (G.mode === 'play' || (G.mode === 'paused' && G.pausedFrom === 'play')) {
    drawArrow(ctx, skin, rx, ry, (p.hold ? -1 : 1) * Math.atan(p.slope), p.mini ? CFG.MINI_SCALE : 1, S);
  } else if (G.mode === 'dead' && G.deadT < 0.12) {
    drawArrow(ctx, skin, rx, ry, (p.hold ? -1 : 1) * Math.atan(p.slope), p.mini ? CFG.MINI_SCALE : 1, S, 1 - G.deadT / 0.12);
  }
  if (Bot.showHit) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(rx, ry, p.mini ? CFG.HIT_R * CFG.MINI_SCALE : CFG.HIT_R, 0, 7); ctx.stroke(); }
  FX.draw();
  ctx.setTransform(S, 0, 0, S, 0, 0);
}

/* Attract mode behind the menus: a zigzagging arrow in the selected skin. */
const Demo = { x: 0, y: 360, dir: 1, trail: [], t: 0, d: 0, nextFlip: 0.8,
  update(dt) {
    const v = 340;
    this.t += dt; this.x += v * dt; this.y += this.dir * v * dt; this.d += v * 1.41 * dt;
    const flip = this.y > 610 || this.y < 110 || this.t > this.nextFlip;
    if (flip) {
      this.dir = this.y > 610 ? -1 : this.y < 110 ? 1 : -this.dir;
      this.nextFlip = this.t + 0.3 + hash01(this.t) * 0.7;
      this.y = Math.min(610, Math.max(110, this.y));
    }
    this.trail.push({ x: this.x, y: this.y, t: this.t, d: this.d });
    while (this.trail.length > 2 && this.trail[1].t < this.t - CFG.TRAIL_LIFE) this.trail.shift();
  },
  draw() {
    const pal = LEVELS[Store.data.level].palette, camX = this.x - CFG.W * 0.62, S = View.S, skin = skinById(Store.data.skin);
    const phase = (this.t * LEVELS[Store.data.level].music.bpm / 60) % 1, pulse = Math.pow(1 - phase, 3);
    drawBackground(pal, camX, pulse, this.t);
    ctx.setTransform(S, 0, 0, S, -camX * S, 0);
    drawTrail(ctx, this.trail, this.t, skin, S, 1);
    drawArrow(ctx, skin, this.x, this.y, this.dir * Math.PI / 4, 1.2, S);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.strokeStyle = pal.outline; ctx.lineWidth = 2.5; ctx.shadowColor = pal.glow; ctx.shadowBlur = 12 * S;
    ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(CFG.W, 60); ctx.moveTo(0, 660); ctx.lineTo(CFG.W, 660); ctx.stroke();
    ctx.shadowBlur = 0;
  }
};

// Skin previews: an analytic zigzag so nothing is simulated while browsing.
function drawSkinPreview(cv, skin, t, dim) {
  const c = cv.getContext('2d'), dpr = View.dpr, cssW = cv.clientWidth || 200, cssH = cv.clientHeight || 100;
  const W = Math.round(cssW * dpr), H = Math.round(cssH * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const sc = H / 110;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#05000a'; c.fillRect(0, 0, W, H);
  const v = 130, period = 110, x = t * v;
  const yAt = (px) => { const f = ((px / period) % 1 + 1) % 1; return 55 + (f < 0.5 ? f * 2 - 0.5 : 1.5 - f * 2) * 62; };
  const pts = [];
  const tail = x - CFG.TRAIL_LIFE * v;
  pts.push({ x: tail, y: yAt(tail), t: t - CFG.TRAIL_LIFE, d: tail * 1.41 });
  for (let k = Math.ceil(tail / (period / 2)); k * period / 2 < x; k++) { const px = k * period / 2; pts.push({ x: px, y: yAt(px), t: px / v, d: px * 1.41 }); }
  pts.push({ x, y: yAt(x), t, d: x * 1.41 });
  const screenW = W / sc;
  c.setTransform(sc, 0, 0, sc, (screenW * 0.68 - x) * sc, 0);
  drawTrail(c, pts, t, skin, sc, 0.8);
  const f = ((x / period) % 1 + 1) % 1;
  drawArrow(c, skin, x, yAt(x), (f < 0.5 ? 1 : -1) * Math.PI / 4, 1.1, sc, dim ? 0.8 : 1);
}

/* ==========================================================================
   9. UI / MENUS
   ========================================================================== */
const $ = (id) => document.getElementById(id);
const hud = $('hud');
const UI = { screen: null, lastPct: -1 };

function applyTheme(pal) {
  const r = document.documentElement.style;
  r.setProperty('--c1', pal.outline); r.setProperty('--c2', pal.accent); r.setProperty('--bg', pal.bg);
}

function show(name) {
  UI.screen = name; UI.shownAt = performance.now();
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === 's-' + name));
  if (name === 'main') { applyTheme(LEVELS[Store.data.level].palette); $('mainSub').textContent = 'Level ' + (Store.data.level + 1) + ': ' + LEVELS[Store.data.level].name; }
  if (name === 'levels') renderLevelCards();
  if (name === 'skins') renderSkinCards();
  if (name) {
    const s = $('s-' + name), target = s.querySelector('.sel') || s.querySelector('[data-nav]:not([disabled])');
    if (target) target.focus();
  } else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

const starHtml = (n) => [0, 1, 2].map((i) => '<span class="' + (i < n ? '' : 'off') + '">★</span>').join('');

function renderLevelCards() {
  const host = $('levelCards');
  host.textContent = '';
  LEVELS.forEach((def, i) => {
    const rec = Store.level(def.id), b = document.createElement('button');
    b.className = 'card transition-transform duration-100 hover:scale-105 active:scale-95' + (i === Store.data.level ? ' sel' : '');
    b.setAttribute('data-nav', ''); b.style.setProperty('--cc', def.palette.outline);
    b.innerHTML = '<div class="num">LEVEL ' + (i + 1) + '</div><div class="name"></div><div class="diff"></div>' +
      '<div class="meter"><i style="width:' + rec.best + '%"></i></div><div class="best">Best ' + rec.best + '%' + (rec.done ? ' · Complete' : '') + '</div>' +
      '<div class="stars">' + starHtml(rec.stars) + '</div>';
    b.querySelector('.name').textContent = def.name;
    b.querySelector('.diff').textContent = def.difficulty + ' · ' + Math.round(Levels[i].duration) + 's';
    b.addEventListener('click', () => { Sound.tap(); Store.data.level = i; Store.save(); startLevel(i); });
    wireHover(b);
    host.appendChild(b);
  });
}

function renderSkinCards() {
  checkUnlocks();
  const host = $('skinCards');
  host.textContent = ''; UI.previews = [];
  SKINS.forEach((skin) => {
    const open = Store.data.unlocked.includes(skin.id), active = Store.data.skin === skin.id, b = document.createElement('button');
    b.className = 'card skin' + (open ? '' : ' locked') + (active ? ' on sel' : '');
    b.setAttribute('data-nav', ''); b.style.setProperty('--cc', skin.glow);
    b.innerHTML = '<canvas></canvas><div class="name"></div><div class="req"></div>';
    b.querySelector('.name').textContent = skin.name;
    b.querySelector('.req').textContent = active ? 'Equipped · ' + skin.styleName : open ? skin.styleName : 'LOCKED · ' + skin.unlock.text;
    b.addEventListener('click', () => {
      if (!Store.data.unlocked.includes(skin.id)) { Sound.deny(); b.classList.remove('deny'); void b.offsetWidth; b.classList.add('deny'); return; }
      Sound.tap(); Store.data.skin = skin.id; Store.save(); renderSkinCards();
      const again = $('skinCards').querySelector('.on'); if (again) again.focus();
    });
    wireHover(b);
    host.appendChild(b);
    UI.previews.push({ cv: b.querySelector('canvas'), skin, dim: !open });
  });
}

function wireHover(el) { el.addEventListener('mouseenter', () => Sound.hover()); }

function setMuteLabel() { $('btnMute').textContent = Store.data.muted ? 'SOUND OFF' : 'SOUND ON'; }
function toggleMute() { Store.data.muted = !Store.data.muted; Store.save(); Sound.setMuted(Store.data.muted); setMuteLabel(); }

let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

function updateHud() {
  const lv = G.lv, pct = Math.min(1, G.p.x / lv.endX);
  $('progFill').style.transform = 'scaleX(' + pct.toFixed(4) + ')';
  const shown = Math.floor(pct * 100);
  if (shown !== UI.lastPct) { UI.lastPct = shown; $('progPct').textContent = shown + '%'; }
}

function bindMenus() {
  const click = (id, fn) => { const b = $(id); b.addEventListener('click', () => { Sound.tap(); fn(); }); wireHover(b); };
  click('bPlay', () => startLevel(Store.data.level));
  click('bLevels', () => show('levels'));
  click('bSkins', () => show('skins'));
  click('bLevelsBack', () => show('main'));
  click('bSkinsBack', () => show('main'));
  click('bResume', resume);
  click('bRestart', () => restart());
  click('bQuit', quitToMenu);
  click('bNext', () => { const i = G.index + 1; if (i < LEVELS.length) { Store.data.level = i; Store.save(); startLevel(i); } else { quitToMenu(); show('levels'); } });
  click('bReplay', () => startLevel(G.index));
  click('bDoneMenu', quitToMenu);
  $('btnMute').addEventListener('click', (e) => { toggleMute(); e.currentTarget.blur(); });
  $('btnPause').addEventListener('click', (e) => { pause(); e.currentTarget.blur(); });
}

// Geometry-based arrow-key navigation over the visible screen's [data-nav] items.
function navMove(dx, dy) {
  const s = UI.screen && $('s-' + UI.screen);
  if (!s) return;
  const items = Array.from(s.querySelectorAll('[data-nav]'));
  const cur = document.activeElement;
  if (!items.includes(cur)) { if (items[0]) items[0].focus(); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const it of items) {
    if (it === cur) continue;
    const r = it.getBoundingClientRect(), ex = r.left + r.width / 2 - ax, ey = r.top + r.height / 2 - ay;
    const along = ex * dx + ey * dy, across = Math.abs(ex * dy) + Math.abs(ey * dx);
    if (along <= 1) continue;
    const score = along + across * 2;
    if (score < bestScore) { bestScore = score; best = it; }
  }
  if (best) { best.focus(); Sound.hover(); }
}

/* ==========================================================================
   10. GAME FLOW
   ========================================================================== */
const Levels = LEVELS.map(compileLevel);
const Bot = { active: false, inputs: null, speed: 1, showHit: false };
const G = { mode: 'menu', pausedFrom: null, index: 0, lv: null, p: null, attempts: 1, trail: [], trailD: 0, clock: 0, deadT: 0, wonT: 0 };

function startLevel(i) {
  G.index = i; G.lv = Levels[i]; prepareRender(G.lv);
  applyTheme(G.lv.palette);
  G.attempts = 1; G.clock = 0;
  Store.data.totalAttempts++; Store.save();
  Input.reset(); beginAttempt();
  show(null);
  hud.classList.add('on'); $('btnPause').classList.add('on');
  $('progBest').style.left = Store.level(G.lv.id).best + '%';
  checkUnlocks();
}

function beginAttempt() {
  G.p = newPlayer(G.lv); G.mode = 'play'; G.deadT = 0; G.wonT = 0; G.trail = []; G.trailD = 0;
  G.trail.push({ x: 0, y: G.p.y, t: G.clock, d: 0 });
  FX.list.length = 0; Shake.left = 0;
  $('attemptN').textContent = G.attempts; UI.lastPct = -1;
  Sound.startMusic(G.lv.def);
}

function recordProgress(done) {
  const rec = Store.level(G.lv.id), pct = done ? 100 : Math.floor(Math.min(99, G.p.x / G.lv.endX * 100));
  rec.best = Math.max(rec.best, pct);
  rec.done = rec.done || done;
  rec.stars = Math.max(rec.stars, done ? (G.attempts <= 10 ? 3 : 2) : rec.best >= 50 ? 1 : 0);
  $('progBest').style.left = rec.best + '%';
  Store.save();
}

function checkUnlocks() {
  const fresh = [];
  for (const s of SKINS) {
    if (!Store.data.unlocked.includes(s.id) && skinUnlocked(s)) { Store.data.unlocked.push(s.id); fresh.push(s); }
  }
  if (fresh.length) {
    Store.save(); Sound.unlock();
    toast('Skin unlocked: ' + fresh.map((s) => s.name).join(', '));
  }
  return fresh;
}

function nextAttempt() {
  recordProgress(false);
  G.attempts++; Store.data.totalAttempts++; Store.save();
  checkUnlocks();
  beginAttempt();
}

function restart() {
  if (!G.lv) return;
  if (G.mode === 'won' || UI.screen === 'complete') { startLevel(G.index); return; }
  show(null);
  nextAttempt();
}

function onDeath() {
  const p = G.p, skin = skinById(Store.data.skin);
  G.mode = 'dead'; G.deadT = 0;
  FX.burst(p.x, p.y, [skin.primary === '#17052b' ? skin.secondary : skin.primary, skin.secondary, skin.edge], 90, 620, 0.8);
  Shake.start();
  Sound.stopMusic(); Sound.death();
  recordProgress(false);
}

function onWin() {
  const skin = skinById(Store.data.skin), p = G.p, cols = [skin.trail, skin.secondary, '#ffffff', G.lv.palette.accent];
  G.mode = 'won'; G.wonT = 0;
  recordProgress(true);
  Sound.stopMusic(); Sound.complete();
  FX.burst(p.x, p.y, cols, 160, 800, 1.5);
  G.fireworks = 3;
}

function showComplete() {
  const rec = Store.level(G.lv.id), fresh = checkUnlocks();
  G.mode = 'menu-complete';
  $('btnPause').classList.remove('on');
  $('doneName').textContent = G.lv.name;
  $('doneStars').innerHTML = starHtml(G.attempts <= 10 ? 3 : 2);
  $('doneAttempts').textContent = G.attempts;
  $('unlocks').textContent = fresh.length ? 'New skin: ' + fresh.map((s) => s.name).join(', ') : rec.stars === 3 ? 'All stars collected' : '';
  $('bNext').textContent = G.index + 1 < LEVELS.length ? 'Continue' : 'Level Select';
  show('complete');
}

function pause() {
  if (G.mode !== 'play' && G.mode !== 'dead') return;
  G.pausedFrom = G.mode; G.mode = 'paused';
  Input.reset();
  Sound.stopMusic();
  show('pause');
}

function resume() {
  if (G.mode !== 'paused') return;
  G.mode = G.pausedFrom;
  show(null);
  if (G.mode === 'play') Sound.startMusic(G.lv.def);
}

function quitToMenu() {
  if (G.lv && G.p && (G.mode === 'paused' || G.mode === 'play')) recordProgress(false);
  G.mode = 'menu'; G.lv = null;
  Sound.stopMusic(); Input.reset();
  hud.classList.remove('on'); $('btnPause').classList.remove('on');
  show('main');
}

/* Fixed-step game logic */
function onTick(t) {
  const held = Input.sample(t);
  if (G.mode === 'paused' || G.mode === 'menu' || G.mode === 'menu-complete') return;
  G.clock += CFG.DT;

  if (G.mode === 'play') {
    const p = G.p, was = p.hold, hold = Bot.inputs ? !!Bot.inputs[p.tick] : held;
    stepPlayer(p, hold, G.lv);
    G.trailD += G.lv.stepX * Math.hypot(1, p.slope);
    const T = G.trail;
    if (hold !== was) { T.push({ x: p.px, y: p.py, t: G.clock - CFG.DT, d: G.trailD }); Sound.flip(); }
    else if (p.tick % CFG.TRAIL_SAMPLE_TICKS === 0) T.push({ x: p.x, y: p.y, t: G.clock, d: G.trailD });
    while (T.length > 2 && T[1].t < G.clock - CFG.TRAIL_LIFE) T.shift();
    if (p.dead) onDeath();
    else if (p.won) onWin();
  } else if (G.mode === 'dead') {
    G.p.px = G.p.x; G.p.py = G.p.y;
    G.deadT += CFG.DT;
    if (G.deadT >= CFG.DEATH_DELAY) nextAttempt();
  } else if (G.mode === 'won') {
    G.p.px = G.p.x; G.p.py = G.p.y;
    G.wonT += CFG.DT;
    if (G.fireworks > 0 && G.wonT > 0.28 * (4 - G.fireworks)) {
      const skin = skinById(Store.data.skin);
      FX.burst(G.p.x + 80 + Math.random() * 500, 150 + Math.random() * 400, [skin.trail, '#ffffff', G.lv.palette.accent], 80, 520, 1.1);
      G.fireworks--;
    }
    if (G.wonT >= CFG.WIN_DELAY) showComplete();
  }
}

/* --------------------------------------------------------------------------
   Keyboard / pointer wiring
   -------------------------------------------------------------------------- */
function bindInput() {
  const inGame = () => !UI.screen && (G.mode === 'play' || G.mode === 'dead' || G.mode === 'won');
  const hasScreen = () => !!UI.screen;

  window.addEventListener('keydown', (e) => {
    Sound.ensure();
    const c = e.code;
    if (c === 'KeyM') { if (!e.repeat) toggleMute(); return; }
    if (inGame()) {
      if (c === 'Space' || c === 'ArrowUp') { e.preventDefault(); if (!e.repeat && !Input.keys.has(c)) { Input.keys.add(c); Input.emit(); } }
      else if (c === 'KeyR') { if (!e.repeat) restart(); }
      else if (c === 'Escape') { if (!e.repeat) pause(); }
      return;
    }
    if (!hasScreen()) return;
    if (c === 'KeyR' && !e.repeat && (UI.screen === 'pause' || UI.screen === 'complete')) { if (UI.screen === 'pause') restart(); else startLevel(G.index); return; }
    if (c === 'ArrowUp') { e.preventDefault(); navMove(0, -1); }
    else if (c === 'ArrowDown') { e.preventDefault(); navMove(0, 1); }
    else if (c === 'ArrowLeft') { e.preventDefault(); navMove(-1, 0); }
    else if (c === 'ArrowRight') { e.preventDefault(); navMove(1, 0); }
    else if (c === 'Enter' || c === 'Space' || c === 'NumpadEnter') {
      e.preventDefault();
      if (UI.screen === 'complete' && performance.now() - UI.shownAt < 500) return;   // a late tap from gameplay must not skip this screen
      if (!e.repeat && document.activeElement && document.activeElement.matches('[data-nav]')) document.activeElement.click();
    } else if (c === 'Escape' && !e.repeat) {
      if (UI.screen === 'pause' || UI.screen === 'complete') quitToMenu();
      else if (UI.screen === 'levels' || UI.screen === 'skins') { Sound.tap(); show('main'); }
    }
  });
  window.addEventListener('keyup', (e) => {
    if (Input.keys.delete(e.code)) Input.emit();
    if (e.code === 'Space') e.preventDefault();   // stops Firefox clicking a focused button on keyup
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    if (!inGame()) return;
    Input.ptrs.add(e.pointerId); Input.emit();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older Safari */ }
  });
  const up = (e) => { if (Input.ptrs.delete(e.pointerId)) Input.emit(); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('pointerdown', () => Sound.ensure(), true);

  const autoPause = () => { if (!Bot.active) pause(); Input.reset(); };
  window.addEventListener('blur', autoPause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
  window.addEventListener('resize', () => { fit(); draw(lastAlpha); });
  window.addEventListener('orientationchange', () => { fit(); draw(lastAlpha); });
}

/* ==========================================================================
   11. BOT (debug only, enabled by ?bot)
     ?bot       solves all levels and prints a report
     ?bot=2     solves level 2 and auto-plays it (&speed=N fast-forwards)
     &hitbox    draws the hitbox
   ========================================================================== */
function runBotMode(params) {
  const raw = params.get('bot');
  Bot.active = true;
  Bot.speed = Math.max(1, +params.get('speed') || 1);
  Bot.showHit = params.has('hitbox');
  const panel = document.createElement('pre');
  panel.id = 'botPanel'; panel.textContent = '[bot] solving...';
  stage.appendChild(panel);
  window.__wave = { G, Bot, Sound, Store, Levels, Input, UI, solveLevel, replayLevel, show, startLevel };
  setTimeout(() => {
    if (raw === '') {
      const rows = Levels.map(botReport);
      const lines = rows.map((r) => r.name.padEnd(16) + ' solved=' + r.solved + ' time=' + (r.seconds ? r.seconds.toFixed(1) + 's' : '-') +
        ' 42ms-decisions=' + r.coarse42ms + ' extraHitboxRadius=' + r.safetyMarginPx + 'px');
      lines.forEach((l) => console.log('[bot] ' + l));
      panel.textContent = lines.join('\n');
      window.__waveBotReport = rows.map((r) => { const c = Object.assign({}, r); delete c.inputs; return c; });
    } else {
      const i = Math.max(0, Math.min(LEVELS.length - 1, (parseInt(raw, 10) || 1) - 1));
      const sol = solveLevel(Levels[i], { every: 4, extraR: 2 });
      panel.textContent = '[bot] ' + LEVELS[i].name + ': ' + (sol.solved ? 'solved, auto-playing' : 'no solution');
      console.log(panel.textContent);
      if (sol.solved) { Bot.inputs = sol.inputs; startLevel(i); }
    }
  }, 50);
}

/* ==========================================================================
   12. MAIN LOOP
   ========================================================================== */
const Clock = { sim: performance.now() / 1000 };
let lastT = Clock.sim, lastAlpha = 0, ticksThisFrame = 0;

function draw(alpha) {
  if (G.lv && G.p && UI.screen !== 'main') { renderGame(alpha); updateHud(); }
  else Demo.draw();
}

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000, dt = Math.min(0.05, now - lastT);
  lastT = now;
  ticksThisFrame = 0;
  lastAlpha = advanceClock(Clock, now, (t) => { ticksThisFrame++; onTick(t); });
  if (Bot.speed > 1) { const extra = ticksThisFrame * (Bot.speed - 1); for (let i = 0; i < extra; i++) onTick(Clock.sim); }

  if (G.mode !== 'paused') { FX.update(dt); Shake.update(dt); }
  if (!G.lv) Demo.update(dt);
  Sound.update();
  draw(lastAlpha);
  if (UI.screen === 'skins' && UI.previews) for (const p of UI.previews) drawSkinPreview(p.cv, p.skin, now, p.dim);
}

function boot() {
  Store.load();
  setMuteLabel();
  fit();
  bindMenus();
  bindInput();
  show('main');
  requestAnimationFrame(frame);
  const params = new URLSearchParams(window.location.search);
  if (params.has('bot')) runBotMode(params);
}
boot();
})();
</script>
